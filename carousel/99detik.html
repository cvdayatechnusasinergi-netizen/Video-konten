<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>99 Detik</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Carousel foto TikTok "Kalau $20 Bisa Ngomong" — 1080x1920, hitam-putih.
// Teks di area aman y 330–1480 (bawah dipakai UI/caption TikTok).
const SLIDES = [
  { cover: true },
  { sec: 20, step: 1, title: 'Cek mutasi kemarin', lines: [['Cari 1 jajan', 0], ['yang sebenernya', 0], ['nggak perlu.', 1]] },
  { sec: 15, step: 2, title: 'Hapus kartu dari app belanja', lines: [['Checkout jadi ribet.', 0], ['Ribet = mikir dua kali.', 1]] },
  { sec: 20, step: 3, title: 'Matiin 1 langganan', lines: [['Yang terakhir lo buka', 0], ['…bulan lalu.', 1]] },
  { sec: 25, step: 4, title: 'Pasang autodebet nabung', lines: [['Tiap hari gajian,', 0], ['otomatis kepotong.', 0], ['Nggak perlu niat.', 1]] },
  { sec: 9, step: 5, title: 'Kosongin keranjang', lines: [['Iya, semuanya.', 0], ['Lo bakal lupa kok.', 1]] },
  { sec: 10, step: 6, title: 'Tulis 1 target', lines: [['"Dana darurat', 0], ['3 bulan gaji."', 1]] },
  { end: true },
];
const id = +(new URLSearchParams(location.search).get('id') || 0);
const S = SLIDES[id], N = SLIDES.length;
const W = 1080, H = 1920, ctx = document.getElementById('c').getContext('2d');
const FONT = 'Inter, sans-serif';
const f = (s, w = 800) => ctx.font = `${w} ${s}px ${FONT}`;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function bg() {
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, 820, 0, W / 2, 820, 900);
  g.addColorStop(0, 'rgba(255,255,255,.11)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let y = 30; y < H; y += 60) for (let x = 30; x < W; x += 60) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill(); }
}
function header() {
  f(24, 800); ctx.letterSpacing = '7px'; ctx.fillStyle = '#bdbdbd'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('99 DETIK BUAT DUIT LO', 60, 250); ctx.letterSpacing = '0px';
  f(20, 600); ctx.fillStyle = '#6a6a6a'; ctx.fillText(`${id + 1}/${N}`, 60, 288);
  logo(W - 110, 262, 1);
}
function logo(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(0, 0, 46, 0, 7); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.beginPath();
  [[-28, -4], [-12, -4], [-6, -14], [0, 6], [6, -22], [12, 8], [18, -4], [28, -4]].forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.stroke();
  f(13, 800); ctx.letterSpacing = '3px'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('SUARA', 2, 24); ctx.letterSpacing = '0px';
  ctx.restore();
}
// tokoh: selembar $20 dengan wajah, tangan & kaki
function bill(x, y, s, mood) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (mood === 'shock') ctx.rotate(-.06);
  if (mood === 'hurt') ctx.rotate(.05);
  const ghost = mood === 'ghost';
  ctx.globalAlpha = ghost ? .55 : 1;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // kaki & tangan
  if (!ghost) {
    ctx.beginPath(); ctx.moveTo(-70, 120); ctx.lineTo(-90, 250); ctx.lineTo(-130, 255); ctx.moveTo(70, 120); ctx.lineTo(90, 250); ctx.lineTo(130, 255); ctx.stroke();
  } else { // ekor hantu
    ctx.beginPath(); ctx.moveTo(-200, 120); for (let i = 0; i <= 8; i++) ctx.quadraticCurveTo(-200 + i * 50 - 25, 120 + (i % 2 ? 70 : 20), -200 + i * 50, 120); ctx.stroke();
  }
  ctx.beginPath();
  if (mood === 'happy') { ctx.moveTo(-230, -10); ctx.lineTo(-310, -110); ctx.moveTo(230, -10); ctx.lineTo(300, 60); }
  else if (mood === 'shock') { ctx.moveTo(-230, -10); ctx.lineTo(-300, -150); ctx.moveTo(230, -10); ctx.lineTo(300, -150); }
  else if (mood === 'hurt') { ctx.moveTo(-230, 0); ctx.lineTo(-120, 30); ctx.moveTo(230, 0); ctx.lineTo(300, 90); }
  else if (mood === 'tiny') { ctx.moveTo(-230, 0); ctx.lineTo(-280, 110); ctx.moveTo(230, 0); ctx.lineTo(280, 110); }
  else { ctx.moveTo(-230, -20); ctx.lineTo(-300, -80); ctx.moveTo(230, -20); ctx.lineTo(300, -80); }
  ctx.stroke();
  // badan uang
  ctx.fillStyle = '#f2f2f2'; ctx.shadowColor = 'rgba(255,255,255,.45)'; ctx.shadowBlur = ghost ? 60 : 40;
  ctx.beginPath(); ctx.roundRect(-230, -130, 460, 260, 22); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#111'; ctx.lineWidth = 5; ctx.beginPath(); ctx.roundRect(-210, -110, 420, 220, 14); ctx.stroke();
  f(44, 900); ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('20', -165, -72); ctx.fillText('20', 165, 72); f(34, 900); ctx.fillText('$', -165, 70); ctx.fillText('$', 165, -70);
  // oval wajah
  ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(0, 0, 95, 100, 0, 0, 7); ctx.stroke();
  // mata
  ctx.fillStyle = '#111'; ctx.lineWidth = 6;
  if (mood === 'happy') { ctx.beginPath(); ctx.arc(-34, -18, 16, Math.PI * 1.1, Math.PI * 1.9); ctx.arc(34, -18, 16, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  else if (mood === 'shock') { [-34, 34].forEach(ex => { ctx.beginPath(); ctx.arc(ex, -20, 15, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(ex, -20, 5, 0, 7); ctx.fill(); }); }
  else if (mood === 'ghost') { [-34, 34].forEach(ex => { ctx.beginPath(); ctx.moveTo(ex - 13, -22); ctx.lineTo(ex + 13, -22); ctx.stroke(); }); }
  else { [-34, 34].forEach(ex => { ctx.beginPath(); ctx.arc(ex, -18, 8, 0, 7); ctx.fill(); }); ctx.beginPath(); ctx.moveTo(-52, -42); ctx.lineTo(-20, -34); ctx.moveTo(52, -42); ctx.lineTo(20, -34); ctx.stroke(); }
  // mulut
  ctx.beginPath();
  if (mood === 'happy') ctx.arc(0, 18, 34, .1 * Math.PI, .9 * Math.PI);
  else if (mood === 'shock') ctx.ellipse(0, 40, 18, 26, 0, 0, 7);
  else if (mood === 'ghost') ctx.arc(0, 50, 18, 1.1 * Math.PI, 1.9 * Math.PI);
  else { ctx.moveTo(-32, 52); ctx.quadraticCurveTo(0, 20, 32, 52); }
  ctx.stroke();
  // air mata / keringat
  if (mood === 'hurt' || mood === 'tiny') { ctx.fillStyle = '#9ad'; ctx.fillStyle = '#bbb';
    [[-40, 10], [44, 14]].forEach(([tx, ty]) => { ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(tx + 12, ty + 26, tx, ty + 34); ctx.quadraticCurveTo(tx - 12, ty + 26, tx, ty); ctx.fill(); }); }
  ctx.restore();
  if (mood === 'shock') { ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    [[-1, -1], [1, -1]].forEach(([sx]) => { for (let k = 0; k < 3; k++) { const a = -Math.PI / 2 + sx * (.5 + k * .35); ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 330 * s, y + Math.sin(a) * 230 * s); ctx.lineTo(x + Math.cos(a) * 400 * s, y + Math.sin(a) * 290 * s); ctx.stroke(); } }); ctx.restore(); }
  if (mood === 'ghost') { ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.shadowColor = 'rgba(255,255,255,.8)'; ctx.shadowBlur = 25;
    ctx.beginPath(); ctx.ellipse(x, y - 190 * s, 120 * s, 28 * s, 0, 0, 7); ctx.stroke(); ctx.restore(); }
}
function lines(arr, y0) {
  arr.forEach(([t, hl], i) => {
    const size = hl ? 64 : 54, y = y0 + i * 92;
    f(size, hl ? 900 : 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(t).width, sc = Math.min(1, 940 / (tw + 40));
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(sc, sc);
    if (hl) { ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(255,255,255,.5)'; ctx.shadowBlur = 30; ctx.beginPath(); ctx.roundRect(-tw / 2 - 22, -size * .62, tw + 44, size * 1.24, 14); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#000'; }
    else ctx.fillStyle = '#fff';
    ctx.fillText(t, 0, 3); ctx.restore();
  });
}
function timeTag(t) {
  f(40, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; const tw = ctx.measureText(t).width;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2 - 70, 400 - 36, tw + 140, 72, 36); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2 - tw / 2 - 34, 400, 16, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(W / 2 - tw / 2 - 34, 400); ctx.lineTo(W / 2 - tw / 2 - 34, 390); ctx.moveTo(W / 2 - tw / 2 - 34, 400); ctx.lineTo(W / 2 - tw / 2 - 26, 404); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillText(t, W / 2 + 18, 402);
}
function swipe() { f(28, 700); ctx.fillStyle = '#9a9a9a'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('geser  →', W - 70, 1440); }

function elapsed(i) { let t = 0; for (let k = 1; k <= i; k++) t += SLIDES[k].sec || 0; return t; }
const mmss = t => '0' + Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
function ring(cx, cy, r, frac, label, sub, ls = 96) {
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 26; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.shadowColor = 'rgba(255,255,255,.7)'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke(); ctx.shadowBlur = 0;
  // tick marks
  for (let k = 0; k < 60; k++) { const a = k / 60 * Math.PI * 2; ctx.strokeStyle = k % 5 ? 'rgba(255,255,255,.15)' : 'rgba(255,255,255,.4)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (r - 40), cy + Math.sin(a) * (r - 40)); ctx.lineTo(cx + Math.cos(a) * (r - (k % 5 ? 50 : 58)), cy + Math.sin(a) * (r - (k % 5 ? 50 : 58))); ctx.stroke(); }
  f(ls, 900); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, cx, cy - (ls > 120 ? 20 : 6));
  if (sub) { f(ls > 120 ? 32 : 26, 700); ctx.letterSpacing = '6px'; ctx.fillStyle = '#9a9a9a'; ctx.fillText(sub, cx + 3, cy + (ls > 120 ? 100 : 64)); ctx.letterSpacing = '0px'; }
  ctx.restore();
}
function draw() {
  bg();
  if (S.cover) {
    logo(W - 110, 262, 1);
    f(28, 700); ctx.letterSpacing = '12px'; ctx.fillStyle = '#bdbdbd'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('CHALLENGE', W / 2 + 6, 400); ctx.letterSpacing = '0px';
    ring(W / 2, 700, 230, 1, '99', 'DETIK', 170);
    f(86, 900); ctx.fillStyle = '#fff'; ctx.fillText('BUAT NYELAMETIN', W / 2, 1040);
    const t = 'DUIT LO'; f(130, 900); const tw = ctx.measureText(t).width;
    ctx.shadowColor = 'rgba(255,255,255,.55)'; ctx.shadowBlur = 50; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2 - 30, 1115, tw + 60, 150, 22); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#000'; ctx.fillText(t, W / 2, 1195);
    f(34, 600); ctx.fillStyle = '#bdbdbd'; ctx.fillText('6 langkah. Lebih cepet dari scroll FYP.', W / 2, 1340);
    swipe(); return;
  }
  if (S.end) {
    header();
    ring(W / 2, 640, 200, 1, '01:39', 'SELESAI');
    lines([['99 detik.', 0], ['Lebih cepet dari', 0], ['scroll FYP.', 1]], 960);
    f(40, 600); ctx.fillStyle = '#cfcfcf'; ctx.textAlign = 'center'; ctx.fillText('Udah lakuin yang nomor berapa?', W / 2, 1270);
    f(52, 800); ctx.fillStyle = '#fff'; ctx.fillText('@.suaraduit', W / 2, 1380);
    f(28, 500); ctx.fillStyle = '#9a9a9a'; ctx.fillText('Simpan biar nggak lupa.', W / 2, 1440);
    return;
  }
  header();
  const t1 = elapsed(id), t0 = t1 - S.sec;
  ring(W / 2, 680, 210, t1 / 99, mmss(t1), '+' + S.sec + ' DETIK');
  f(30, 800); ctx.letterSpacing = '8px'; ctx.fillStyle = '#9a9a9a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('LANGKAH ' + S.step, W / 2 + 4, 960); ctx.letterSpacing = '0px';
  f(68, 900); ctx.fillStyle = '#fff'; const tt = S.title; const tw = ctx.measureText(tt).width, sc = Math.min(1, 960 / tw);
  ctx.save(); ctx.translate(W / 2, 1040); ctx.scale(sc, sc); ctx.fillText(tt, 0, 0); ctx.restore();
  lines(S.lines, 1170);
  if (id < N - 1) swipe();
}
// grain
function grain() { const r = rng(5), d = ctx.getImageData(0, 0, W, H), p = d.data; for (let i = 0; i < p.length; i += 4) { const v = (r() - .5) * 12; p[i] += v; p[i + 1] += v; p[i + 2] += v; } ctx.putImageData(d, 0, 0); }
window.ready = document.fonts.load(`900 40px Inter`).then(() => document.fonts.load(`500 40px Inter`)).then(() => { draw(); grain(); return SLIDES.length; });
</script>
</body>
</html>
