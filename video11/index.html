// ============ CONFIG ============
const params = new URLSearchParams(location.search);
const CONFIG = {
  handle: params.get('handle') || '@.suaraduit',
  brand: params.get('brand') || 'SUARA',
  saveRate: 10000,      // Rp per hari

const W = 1080, H = 1920, FPS = 30, DURATION = 37.9;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'Inter, "Inter Display", "DejaVu Sans", sans-serif';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const expo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmtNum = (v, d) => v.toFixed(d).replace('.', ',');
const rupiah = v => 'Rp' + Math.round(v).toLocaleString('id-ID');

function font(size, weight = 700) { ctx.font = `${weight} ${size}px ${FONT}`; }

// fade in at [a, a+fi], fade out at [b-fo, b]
function life(t, a, b, fi = .35, fo = .35) { return Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b)); }

// Animated word-by-word text (centered)
function words(text, x, y, size, t, start, opts = {}) {
  const { weight = 700, color = '#fff', stagger = .09, dur = .55, end = 1e9, fo = .35, spacing = 0, align = 'center', rise = 46 } = opts;
  font(size, weight);
  ctx.letterSpacing = spacing + 'px';
  const ws = text.split(' ');
  const sp = ctx.measureText(' ').width;
  const widths = ws.map(w => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'left' ? x : x - total;
  const outA = 1 - prog(t, end - fo, end);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ws.forEach((w, i) => {
    const p = prog(t, start + i * stagger, start + i * stagger + dur);
    if (p > 0 && outA > 0) {
      const e = eo(p);
      ctx.save();
      ctx.globalAlpha *= e * outA;
      ctx.fillStyle = color;
      const blur = (1 - e) * 14 + (1 - outA) * 10;
      if (blur > .3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
      ctx.fillText(w, cx, y + (1 - e) * rise - (1 - outA) * 30);
      ctx.restore();
    }
    cx += widths[i] + sp;
  });
  ctx.letterSpacing = '0px';
}

function label(text, y, t, start, end) {
  // letter-spaced small label with side lines
  const a = life(t, start, end, .5, .4);
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha *= a;
  font(30, 600);
  ctx.letterSpacing = '14px';
  ctx.fillStyle = '#bdbdbd';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2 + 7, y);
  const tw = ctx.measureText(text).width;
  const lp = eo(prog(t, start, start + .8));
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - tw / 2 - 30, y); ctx.lineTo(W / 2 - tw / 2 - 30 - 90 * lp, y);
  ctx.moveTo(W / 2 + tw / 2 + 30, y); ctx.lineTo(W / 2 + tw / 2 + 30 + 90 * lp, y);
  ctx.stroke();
  ctx.restore();
  ctx.letterSpacing = '0px';
}

function dot(x, y, r, a = 1, glow = 30) {
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.shadowColor = 'rgba(255,255,255,.9)';
  ctx.shadowBlur = glow;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- background ----------
const grain = [];
(function makeGrain() {
  const r = rng(7);
  for (let k = 0; k < 6; k++) {
    const g = document.createElement('canvas'); g.width = 270; g.height = 480;
    const gx = g.getContext('2d'); const id = gx.createImageData(270, 480);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
    gx.putImageData(id, 0, 0); grain.push(g);
  }
})();

const dust = (() => { const r = rng(42); return Array.from({ length: 70 }, () => ({ x: r() * W, y: r() * H, s: .5 + r() * 2, v: 8 + r() * 30, a: .1 + r() * .35, ph: r() * 6 })); })();

function background(t, frame) {
  ctx.fillStyle = '#040404'; ctx.fillRect(0, 0, W, H);
  // soft center light
  const g = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, H * .7);
  g.addColorStop(0, 'rgba(255,255,255,.07)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // dot grid ("titik")
  const step = 60, off = (t * 6) % step;
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let y = -step; y < H + step; y += step) for (let x = 30; x < W; x += step) {
    ctx.beginPath(); ctx.arc(x, y + off, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  // floating dust
  dust.forEach(d => {
    const y = ((d.y - t * d.v) % H + H) % H;
    ctx.fillStyle = `rgba(255,255,255,${d.a * (.6 + .4 * Math.sin(t * 2 + d.ph))})`;
    ctx.beginPath(); ctx.arc(d.x + Math.sin(t * .5 + d.ph) * 20, y, d.s, 0, Math.PI * 2); ctx.fill();
  });
}
function overlay(t, frame) {
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // grain
  ctx.save(); ctx.globalAlpha = .9;
  ctx.drawImage(grain[frame % grain.length], 0, 0, W, H);
  ctx.restore();
  // progress line at very top
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, 0, W, 4);
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(0, 0, W * (t / DURATION), 4);
}

// scene wrapper: fade + slight zoom/blur on exit
function scene(t, a, b, fn, fi = .3, fo = .5) {
  if (t < a || t > b) return;
  const inp = prog(t, a, a + fi), outp = prog(t, b - fo, b);
  ctx.save();
  ctx.globalAlpha = Math.min(eo(inp), 1 - outp);
  const s = 1 + eio(outp) * .08;
  ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
  if (outp > 0) ctx.filter = `blur(${(outp * 10).toFixed(1)}px)`;
  fn(t - a, t);
  ctx.restore();
}

function strike(x0, x1, y, p, w = 8) {
  if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(lerp(x0, x1, eo(p)), y); ctx.stroke(); ctx.restore();
}
function pill(text, x, y, a, opts = {}) {
  if (a <= 0) return;
  const { size = 32, filled = false, dim = 1 } = opts;
  font(size, 700);
  const tw = ctx.measureText(text).width, pw = tw + 48, ph = size * 1.75;
  ctx.save(); ctx.globalAlpha *= eo(a) * dim; ctx.translate(x, y + (1 - eo(a)) * 30);
  const s = back(a); ctx.scale(s, s);
  ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, ph / 2);
  if (filled) { ctx.fillStyle = '#fff'; ctx.fill(); } else { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2.5; ctx.stroke(); }
  ctx.fillStyle = filled ? '#000' : '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 2);
  ctx.restore();
}

    person(330, 1050, .95, { mood: 'flat', label: 'PETER THIEL' });
    person(750, 1050, .95, { mood: 'panic', label: 'KANDIDAT' });
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(380, 1050); ctx.lineTo(700, 1050); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(300, 560, 220, 130, 30); ctx.fill(); ctx.beginPath(); ctx.moveTo(340, 680); ctx.lineTo(320, 740); ctx.lineTo(380, 690); ctx.fill();
    font(90, 900); ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 410, 628);
    tag('PERTANYAAN FAVORIT', W / 2, 470, prog(v, 5.6, 6.0), false, 30);
    ctx.restore();
  }
  const bp = prog(v, 9.48, 10.0);
  if (bp > 0) { ctx.save(); ctx.globalAlpha *= eo(bp); book(W / 2, 820, back(bp) * .85); ctx.restore(); tag(BADGE, W / 2, 1160, prog(v, 9.9, 10.3), false, 28); }
}
// coba jawab → semua jawab hal yang sama
function k3(lt, t) {
  const v = t - OFF;
  bigPop('COBA JAWAB.', W / 2, 520, 110, prog(v, 13.4, 13.8), 40);
  for (let i = 0; i < 12; i++) {
    const x = 220 + (i % 4) * 213, y = 760 + Math.floor(i / 4) * 140, p = prog(v, 14.8 + i * .08, 15.1 + i * .08); if (p <= 0) continue;
    ctx.save(); ctx.globalAlpha *= eo(p) * .7; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x - 90, y - 45, 180, 90, 22); ctx.stroke();
    font(26, 700); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('"udah tau"', x, y + 2); ctx.restore();
  }
}
// spotlight ke kebenaran tersembunyi
function k4(lt, t) {
  const v = t - OFF;
  const r = rng(31);
  for (let i = 0; i < 60; i++) dot(140 + r() * 800, 460 + r() * 720, 5, .2, 0);
  const sp = eo(prog(v, 17.9, 18.6));
  if (sp > 0) {
    ctx.save(); ctx.globalAlpha *= sp; const g = ctx.createRadialGradient(700, 880, 0, 700, 880, 260);
    g.addColorStop(0, 'rgba(255,255,255,.28)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 380, W, 900); ctx.restore();
    dot(700, 880, 22, sp, 60);
  }
  tag('PELUANG TERBESAR', 700, 760, prog(v, 18.6, 19.0), true, 30);
  tag('BENER', 560, 1010, prog(v, 20.14, 20.5), false, 30);
  tag('BELUM DISADARI', 820, 1010, prog(v, 21.38, 21.7), true, 30);
}
// percaya yang dipercaya semua orang → hasil sama
function k5(lt, t) {
  const v = t - OFF;
  crowd(v, false, eo(prog(v, 23.1, 23.6)));
  bigPop('HASIL LO = SAMA.', W / 2, 470, 90, prog(v, 26.82, 27.3), 40);
}
// ajak komen
function k6(lt, t) {
  const v = t - OFF;
  bigPop('JAWABAN LO APA?', W / 2, 720, 82, prog(v, 29.24, 29.7), 45);
  const p = prog(v, 31.2, 31.6);
  if (p > 0) {
    ctx.save(); ctx.translate(W / 2, 950); const s = back(p); ctx.scale(s, s);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.roundRect(-70, -55, 140, 100, 26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-30, 45); ctx.lineTo(-44, 80); ctx.lineTo(-5, 45); ctx.stroke();
    ctx.fillStyle = '#fff'; [-30, 0, 30].forEach(x => { ctx.beginPath(); ctx.arc(x, -5, 8, 0, 7); ctx.fill(); });
    ctx.restore();
    tag('TULIS DI KOMEN', W / 2, 1110, p, true, 36);
  }
}
const SCENES = [[0, HOOK_END, k1], [HOOK_END, OFF + 11.6, k2], [OFF + 11.6, OFF + 17.8, k3], [OFF + 17.8, OFF + 22.9, k4], [OFF + 22.9, OFF + 29.1, k5], [OFF + 29.1, CTA_AT, k6]];

// ---------- captions (subtitle per kata) ----------
function captions(t) {
  const v = t - OFF;
  if (t > CTA_AT) return;
  let c = null;
  for (let i = 0; i < CAPS.length; i++) {
    const nx = CAPS[i + 1] ? CAPS[i + 1].s : CAPS[i].e + .6;
    if (v >= CAPS[i].s - .05 && v < Math.min(nx, CAPS[i].e + .8)) { c = CAPS[i]; break; }
  }
  if (!c) return;
  const size = 54, y = 1300;
  font(size, 800);
  const sp = ctx.measureText(' ').width;
  const ws = c.words.map(w => ({ ...w, tw: ctx.measureText(w.w).width }));
  const total = ws.reduce((a, w) => a + w.tw, 0) + sp * (ws.length - 1);
  const scale = Math.min(1, 920 / total);
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(scale, scale);
  // backing box
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.roundRect(-total / 2 - 26, -size * .85, total + 52, size * 1.7, 18); ctx.fill();
  let x = -total / 2;
  ws.forEach(w => {
    const p = prog(v, w.s - .04, w.s + .12);
    {
      ctx.save(); ctx.globalAlpha *= .3 + .7 * eo(p); ctx.translate(x + w.tw / 2, (1 - eo(p)) * 10);
      const s = 1 + (w.hl ? .12 : 0) * Math.sin(Math.PI * prog(v, w.s, w.s + .25)); ctx.scale(s, s);
      if (w.hl && p > 0) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(-w.tw / 2 - 10, -size * .62, w.tw + 20, size * 1.22, 10); ctx.fill(); ctx.fillStyle = '#000'; }
      else ctx.fillStyle = '#fff';
      font(size, 800); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(w.w, 0, 3);
      ctx.restore();
    }
    x += w.tw + sp;
  });
  ctx.restore();
}
// persistent header + logo
function chrome(t) {
  if (t > CTA_AT + .3) return;
  const a = 1 - prog(t, CTA_AT, CTA_AT + .3);
  ctx.save(); ctx.globalAlpha = a;
  font(26, 800); ctx.letterSpacing = '6px'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('CARA DUITMU DIMAINKAN', 60, 250); ctx.letterSpacing = '0px';
  font(18, 500); ctx.fillStyle = '#7a7a7a'; ctx.fillText(BADGE + ' · Peter Thiel (2014)', 60, 288);
  // logo
  ctx.translate(W - 110, 262); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(0, 0, 46, 0, 7); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.beginPath();
  [[-28, -4], [-12, -4], [-6, -14], [0, 6], [6, -22], [12, 8], [18, -4], [28, -4]].forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  font(13, 800); ctx.letterSpacing = '3px'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('SUARA', 2, 24); ctx.letterSpacing = '0px';
  ctx.restore();
}

// ---------- kamera virtual ----------
function camZoom(t) {
  const v = t - OFF;
  let z = 1 + .22 * (1 - eio(prog(t, 0.05, 0.75)));            // punch-out pembuka
  for (const c of CAPS) for (const w of c.words) if (w.hl) { const d = v - w.s; if (d > 0 && d < .35) z += .035 * (1 - d / .35); }
  return z;
}
function sceneW(t, a, b, fn, fo = .15) {
  const p = prog(t, a, a + .3);
  ctx.save();
  if (p < 1 && t >= a) { ctx.translate(W * .85 * (1 - eo(p)), 0); ctx.filter = `blur(${(18 * (1 - p)).toFixed(1)}px)`; }
  scene(t, a, b, fn, .05, fo);
  ctx.restore();
}
function viewfinder(t) {
  if (t > HOOK_END + .2) return;
  const a = 1 - prog(t, HOOK_END - .1, HOOK_END + .2);
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
  const m = 70, L = 70, top = 330, bot = 1500;
  [[m, top, 1, 1], [W - m, top, -1, 1], [m, bot, 1, -1], [W - m, bot, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke(); });
  if (Math.floor(t * 2) % 2 === 0) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(m + 30, top + 50, 12, 0, 7); ctx.fill(); }
  font(30, 800); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('REC', m + 55, top + 51);
  const tc = '00:00:' + String(Math.floor(t)).padStart(2, '0') + ':' + String(Math.floor((t % 1) * 30)).padStart(2, '0');
  ctx.textAlign = 'right'; ctx.fillText(tc, W - m - 20, top + 51);
  ctx.strokeRect(W - m - 70, bot - 60, 50, 24); ctx.fillStyle = '#fff'; ctx.fillRect(W - m - 66, bot - 56, 30, 16); ctx.fillRect(W - m - 20, bot - 52, 5, 8);
  font(24, 700); ctx.textAlign = 'left'; ctx.fillText('4K  30FPS', m + 20, bot - 48);
  const f = eo(prog(t, .45, .7)); const fs = lerp(200, 140, f);
  ctx.globalAlpha = a * (1 - prog(t, 1.2, 1.6)); ctx.lineWidth = 3;
  ctx.strokeRect(W / 2 - fs, 1000 - fs * 1.1, fs * 2, fs * 2.2);
  ctx.restore();
}

// ---------- master ----------
let frameNo = 0;
function renderFrame(t) {
  const frame = Math.round(t * FPS); frameNo = frame;
  ctx.save();
  ctx.globalAlpha = 1; ctx.filter = 'none';
  background(t, frame);
  const z = camZoom(t), sh = t < HOOK_END ? 9 : 3;
  ctx.translate(W / 2 + Math.sin(t * 7.3) * sh + Math.sin(t * 13.1) * sh * .4, H / 2 + Math.cos(t * 6.1) * sh * .8);
  ctx.rotate(Math.sin(t * 3.7) * .004 * (t < HOOK_END ? 2 : 1)); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  const rack = 16 * (1 - eo(prog(t, 0.15, 0.6)));
  if (rack > .3) ctx.filter = `blur(${rack.toFixed(1)}px)`;
  SCENES.forEach(([a, b, fn], i) => i === 0 ? scene(t, a, b, fn, .01, .15) : sceneW(t, a, b, fn));
  ctx.restore();
  ctx.save(); sceneW(t, CTA_AT, DURATION + .01, cta, .01); ctx.restore();
  chrome(t);
  viewfinder(t);
  captions(t);
  overlay(t, frame);
}

function cta(lt, t) {
  // title
  words(CTA_TITLE[0], W / 2, 470, 92, lt, .1, { weight: 900, stagger: .1, spacing: 2 });
  words(CTA_TITLE[1], W / 2, 570, 92, lt, .35, { weight: 300, stagger: .1, spacing: 12, color: '#d8d8d8' });

  // avatar
  const ap = prog(lt, .6, 1.2);
  if (ap > 0) {
    const s = back(ap);
    ctx.save(); ctx.translate(W / 2, 790); ctx.scale(s, s);
    // logo: black disc, white ring, pulse waveform + brand name
    ctx.shadowColor = 'rgba(255,255,255,.55)'; ctx.shadowBlur = 45;
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, 105, 0, 7); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
    const wp = eo(prog(lt, .9, 1.6));
    ctx.save(); ctx.beginPath(); ctx.rect(-80, -60, 160 * wp, 100); ctx.clip();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255,255,255,.9)'; ctx.shadowBlur = 14;
    const pts = [[-70,-12],[-34,-12],[-24,-30],[-12,14],[0,-52],[12,26],[24,-22],[34,-12],[70,-12]];
    ctx.beginPath(); pts.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
    ctx.restore();
    font(26, 800); ctx.letterSpacing = '7px'; ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(CONFIG.brand, 4, 50);
    ctx.letterSpacing = '0px';
    // rotating dashed ring
    ctx.rotate(t * .6); ctx.setLineDash([6, 14]); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 130, 0, 7); ctx.stroke();
    ctx.restore();
    // "+" follow badge
    const bp = back(prog(lt, 1.0, 1.4));
    const followed = lt > 3.25;
    ctx.save(); ctx.translate(W / 2, 900); ctx.scale(bp, bp);
    ctx.fillStyle = followed ? '#fff' : '#000'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = followed ? '#000' : '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
    if (followed) { ctx.moveTo(-11, 1); ctx.lineTo(-3, 9); ctx.lineTo(12, -8); } else { ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.moveTo(0, -11); ctx.lineTo(0, 11); }
    ctx.stroke(); ctx.restore();
  }
  words(CONFIG.handle, W / 2, 1005, 64, lt, 1.0, { weight: 700, stagger: 0 });

  // buttons
  const btn = (y, start, text, filled, icon, pressT) => {
    const p = prog(lt, start, start + .5); if (p <= 0) return;
    const press = Math.sin(Math.PI * prog(lt, pressT, pressT + .3));
    const done = lt > pressT + .15;
    ctx.save(); ctx.globalAlpha *= eo(p);
    ctx.translate(W / 2, y + (1 - eo(p)) * 50); const s = 1 - press * .06; ctx.scale(s, s);
    const bw = 560, bh = 112;
    ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2);
    const isFilled = filled !== done;
    if (isFilled) { ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(255,255,255,.5)'; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0; }
    else { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke(); }
    const label = done ? text[1] : text[0];
    font(46, 800); ctx.letterSpacing = '6px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = isFilled ? '#000' : '#fff';
    ctx.fillText(label, 34, 2);
    ctx.letterSpacing = '0px';
    const tw = ctx.measureText(label).width;
    icon(34 - tw / 2 - 52, 0, isFilled ? '#000' : '#fff', done);
    ctx.restore();
    // tap ripple
    const rp = prog(lt, pressT, pressT + .7);
    if (rp > 0 && rp < 1) { ctx.save(); ctx.globalAlpha = (1 - rp) * .7; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W / 2 + 150, y, 20 + rp * 110, 0, 7); ctx.stroke(); ctx.restore(); }
  };
  const iconUser = (x, y, c, done) => {
    ctx.save(); ctx.translate(x, y); ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-6, -9, 9, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-6, 18, 16, Math.PI, 0); ctx.fill();
    ctx.beginPath();
    if (done) { ctx.moveTo(10, -2); ctx.lineTo(15, 4); ctx.lineTo(24, -8); } else { ctx.moveTo(17, -9); ctx.lineTo(17, 7); ctx.moveTo(9, -1); ctx.lineTo(25, -1); }
    ctx.stroke(); ctx.restore();
  };
  const iconShare = (x, y, c) => {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(4, -20); ctx.lineTo(26, 0); ctx.lineTo(4, 20); ctx.lineTo(4, 9);
    ctx.quadraticCurveTo(-14, 7, -24, 20); ctx.quadraticCurveTo(-20, -6, 4, -9); ctx.closePath(); ctx.fill(); ctx.restore();
  };
  btn(1170, 1.5, ['FOLLOW', 'FOLLOWING'], true, iconUser, 3.1);
  btn(1310, 1.8, ['SHARE', 'TERKIRIM'], false, iconShare, 4.2);
  words('Follow buat insight harian.', W / 2, 1430, 38, lt, 2.4, { weight: 500, color: '#a8a8a8', stagger: .05 });
  words('Tulis jawaban lo di komen.', W / 2, 1485, 38, lt, 2.8, { weight: 500, color: '#a8a8a8', stagger: .05 });
}


window.renderFrame = renderFrame;
window.FPS = FPS; window.DURATION = DURATION;
window.ready = document.fonts.load(`800 40px Inter`).then(() => document.fonts.load(`300 40px Inter`)).then(() => document.fonts.ready).then(() => true);

// preview mode: play in browser
if (!params.has('render')) {
  const t0 = performance.now();
  (function loop() { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else document.body.classList.add('render');
</script>
