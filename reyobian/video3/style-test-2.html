<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Style Test 2</title>
<style>html,body{margin:0;background:#222}canvas{display:block}</style>
</head>
<body>
<canvas id="a" width="1080" height="1920"></canvas>
<canvas id="b" width="1080" height="1920"></canvas>
<script>
// Uji gaya "tech": C = keynote minimal (hitam, render HP realistis), D = blueprint/HUD (garis teknis, mono).
const SANS = 'Inter, sans-serif', MONO = '"JetBrains Mono", monospace';
function t(c, s, x, y, size, w, col, al = 'center', f = SANS, ls = 0) { c.font = `${w} ${size}px ${f}`; c.letterSpacing = ls + 'px'; c.fillStyle = col; c.textAlign = al; c.textBaseline = 'middle'; c.fillText(s, x, y); c.letterSpacing = '0px'; }

// HP realistis (gaya keynote)
function realPhone(c, x, y, s, rot = 0) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  c.shadowColor = 'rgba(0,0,0,.8)'; c.shadowBlur = 80; c.shadowOffsetY = 40;
  const edge = c.createLinearGradient(-160, 0, 160, 0); edge.addColorStop(0, '#5a5d63'); edge.addColorStop(.08, '#c9ccd1'); edge.addColorStop(.5, '#8d9096'); edge.addColorStop(.92, '#d7dadf'); edge.addColorStop(1, '#4c4f55');
  c.fillStyle = edge; c.beginPath(); c.roundRect(-160, -320, 320, 640, 58); c.fill(); c.shadowColor = 'transparent';
  c.fillStyle = '#050505'; c.beginPath(); c.roundRect(-150, -310, 300, 620, 50); c.fill();
  const sc = c.createLinearGradient(0, -290, 0, 290); sc.addColorStop(0, '#0d1b3d'); sc.addColorStop(.55, '#1a3a7a'); sc.addColorStop(1, '#0a1226');
  c.fillStyle = sc; c.beginPath(); c.roundRect(-138, -298, 276, 596, 42); c.fill();
  const orb = c.createRadialGradient(40, 60, 0, 40, 60, 260); orb.addColorStop(0, 'rgba(90,160,255,.55)'); orb.addColorStop(1, 'rgba(90,160,255,0)');
  c.fillStyle = orb; c.fillRect(-138, -298, 276, 596);
  t(c, '9:41', 0, -190, 64, 300, 'rgba(255,255,255,.92)');
  t(c, 'Selasa, 9 Januari', 0, -140, 20, 500, 'rgba(255,255,255,.6)');
  c.fillStyle = '#000'; c.beginPath(); c.roundRect(-42, -288, 84, 24, 12); c.fill();
  const gl = c.createLinearGradient(-150, -310, 150, 310); gl.addColorStop(0, 'rgba(255,255,255,.14)'); gl.addColorStop(.4, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = gl; c.beginPath(); c.roundRect(-150, -310, 300, 620, 50); c.fill();
  c.fillStyle = '#9a9da2'; c.fillRect(-164, -170, 4, 60); c.fillRect(-164, -90, 4, 60); c.fillRect(160, -130, 4, 90);
  c.restore();
}
function realKeypad(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.shadowColor = 'rgba(0,0,0,.8)'; c.shadowBlur = 60; c.shadowOffsetY = 30;
  const b = c.createLinearGradient(-120, 0, 120, 0); b.addColorStop(0, '#26282c'); b.addColorStop(.5, '#3a3d42'); b.addColorStop(1, '#1f2124');
  c.fillStyle = b; c.beginPath(); c.roundRect(-120, -280, 240, 560, 46); c.fill(); c.shadowColor = 'transparent';
  c.fillStyle = '#0b0d10'; c.beginPath(); c.roundRect(-92, -230, 184, 150, 10); c.fill();
  c.fillStyle = 'rgba(140,200,255,.25)'; c.beginPath(); c.roundRect(-84, -222, 168, 134, 6); c.fill();
  for (let r = 0; r < 4; r++) for (let k = 0; k < 3; k++) { const g = c.createLinearGradient(0, -20 + r * 64, 0, 24 + r * 64); g.addColorStop(0, '#55595f'); g.addColorStop(1, '#2d3035'); c.fillStyle = g; c.beginPath(); c.roundRect(-84 + k * 60, -20 + r * 64, 48, 44, 10); c.fill(); }
  c.restore();
}

// ===== C: keynote minimal =====
function drawC() {
  const c = document.getElementById('a').getContext('2d'), W = 1080, H = 1920;
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const sp = c.createRadialGradient(W / 2, 1080, 0, W / 2, 1080, 760); sp.addColorStop(0, 'rgba(70,110,200,.22)'); sp.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = sp; c.fillRect(0, 0, W, H);
  t(c, '2007', W / 2, 330, 30, 500, '#6b7280', 'center', SANS, 10);
  t(c, 'HP ini sempat', W / 2, 440, 92, 600, '#f5f5f7', 'center', SANS, -2);
  t(c, 'diketawain.', W / 2, 545, 92, 600, '#4c8dff', 'center', SANS, -2);
  realKeypad(c, 300, 1110, .58);
  realPhone(c, 640, 1080, .95, 0);
  // kutipan bersih
  [['“Enggak ada keyboard-nya.”', 1440], ['“Kemahalan.”', 1505]].forEach(([s, y]) => t(c, s, W / 2, y, 36, 400, '#9ca3af', 'center', SANS));
  c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(W / 2 - 40, 1400, 80, 2);
}

// ===== D: blueprint / HUD =====
function drawD() {
  const c = document.getElementById('b').getContext('2d'), W = 1080, H = 1920, CY = '#38E1FF';
  c.fillStyle = '#05080d'; c.fillRect(0, 0, W, H);
  c.strokeStyle = 'rgba(56,225,255,.06)'; c.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = 0; y <= H; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.strokeStyle = 'rgba(56,225,255,.14)'; for (let x = 0; x <= W; x += 200) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); } for (let y = 0; y <= H; y += 200) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  // sudut bingkai
  c.strokeStyle = CY; c.lineWidth = 3; [[60, 260, 1, 1], [1020, 260, -1, 1], [60, 1660, 1, -1], [1020, 1660, -1, -1]].forEach(([x, y, a, b]) => { c.beginPath(); c.moveTo(x, y + b * 50); c.lineTo(x, y); c.lineTo(x + a * 50, y); c.stroke(); });
  t(c, '[ ARSIP_2007 ]', 90, 320, 26, 500, CY, 'left', MONO, 2);
  t(c, 'STATUS: DIREMEHKAN', 990, 320, 26, 500, '#ff5d5d', 'right', MONO, 2);
  t(c, 'HP ini sempat', 90, 430, 80, 700, '#e6f7ff', 'left', SANS, -1);
  t(c, 'diketawain.', 90, 525, 80, 700, CY, 'left', SANS, -1);
  // HP garis
  const px = 620, py = 1080, w = 300, h = 600;
  c.strokeStyle = CY; c.lineWidth = 3; c.beginPath(); c.roundRect(px - w / 2, py - h / 2, w, h, 50); c.stroke();
  c.lineWidth = 2; c.strokeStyle = 'rgba(56,225,255,.6)'; c.beginPath(); c.roundRect(px - w / 2 + 16, py - h / 2 + 70, w - 32, h - 160, 6); c.stroke();
  c.beginPath(); c.arc(px, py + h / 2 - 45, 22, 0, 7); c.stroke(); c.beginPath(); c.roundRect(px - 30, py - h / 2 + 34, 60, 8, 4); c.stroke();
  c.fillStyle = 'rgba(56,225,255,.06)'; c.fillRect(px - w / 2 + 16, py - h / 2 + 70, w - 32, h - 160);
  // garis pindai
  const sy = py - 120; const sg = c.createLinearGradient(0, sy - 40, 0, sy + 4); sg.addColorStop(0, 'rgba(56,225,255,0)'); sg.addColorStop(1, 'rgba(56,225,255,.45)'); c.fillStyle = sg; c.fillRect(px - w / 2 + 16, sy - 40, w - 32, 44); c.fillStyle = CY; c.fillRect(px - w / 2 + 16, sy, w - 32, 2);
  // dimensi
  c.strokeStyle = 'rgba(56,225,255,.7)'; c.lineWidth = 2; c.beginPath(); c.moveTo(px - w / 2, py + h / 2 + 50); c.lineTo(px + w / 2, py + h / 2 + 50); c.moveTo(px - w / 2, py + h / 2 + 38); c.lineTo(px - w / 2, py + h / 2 + 62); c.moveTo(px + w / 2, py + h / 2 + 38); c.lineTo(px + w / 2, py + h / 2 + 62); c.stroke();
  t(c, '61 mm', px, py + h / 2 + 85, 24, 500, CY, 'center', MONO);
  // label callout
  const call = (s, v, x0, y0, x1, y1) => { c.strokeStyle = 'rgba(56,225,255,.7)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.lineTo(x1 - 150, y1); c.stroke(); c.fillStyle = CY; c.beginPath(); c.arc(x0, y0, 6, 0, 7); c.fill(); t(c, s, x1 - 150, y1 - 24, 22, 500, '#7fa6b3', 'left', MONO, 1); t(c, v, x1 - 150, y1 + 18, 30, 700, '#e6f7ff', 'left', MONO); };
  call('LAYAR', '3,5 inci', px - 100, py - 60, 330, 830);
  call('JARINGAN', '2G / EDGE', px - 130, py + 200, 330, 1260);
  call('KEYPAD', 'TIDAK ADA', px, py + h / 2 - 45, 330, 1480);
  // kutipan terminal
  c.fillStyle = 'rgba(56,225,255,.06)'; c.strokeStyle = 'rgba(56,225,255,.35)'; c.lineWidth = 2; c.beginPath(); c.roundRect(90, 1560, 900, 70, 10); c.fill(); c.stroke();
  t(c, '> "enggak ada keyboard-nya?"  "kemahalan."', 120, 1595, 26, 500, '#9fdcea', 'left', MONO);
}
window.ready = Promise.all([document.fonts.load(`600 40px Inter`), document.fonts.load(`700 40px Inter`), document.fonts.load(`500 40px "JetBrains Mono"`)]).then(() => { drawC(); drawD(); return true; });
</script>
</body>
</html>
