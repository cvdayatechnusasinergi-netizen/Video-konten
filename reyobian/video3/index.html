<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sejarah iPhone</title>
<style>
  html,body{margin:0;background:#000;}
  canvas{display:block;width:360px;height:640px;}
  body.render canvas{width:1080px;height:1920px;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timing.js"></script>
<script>
// Reyo Bian #3 (v2, gaya B: gelap berwarna) — "HP Ini Sempat Diketawain". HP digambar generik: tanpa logo/foto produk.
// Gaya: latar hitam, grid titik, grain, aksen KUNING/EMAS (warna sampul profil Reyo Bian).
// ============ CONFIG ============
const params = new URLSearchParams(location.search);
const CONFIG = {
  name: params.get('brand') || 'Reyo Bian',
  sub: 'Pangkalan Bun',
};
// ================================

const W = 1080, H = 1920, FPS = 30, DURATION = TIMING.END;
const EVENTS = TIMING.EVENTS.filter(e => e[1] !== "whoosh").map(e => e[0]);
const GOLD = '#FFB547', GOLD_GLOW = 'rgba(255,140,120,.6)';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'Inter, "Inter Display", "DejaVu Sans", sans-serif';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rupiah = v => 'Rp' + Math.max(0, Math.round(v)).toLocaleString('id-ID');
function font(size, weight = 700) { ctx.font = `${weight} ${size}px ${FONT}`; }
function life(t, a, b, fi = .35, fo = .35) { return Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b)); }

function words(text, x, y, size, t, start, opts = {}) {
  const { weight = 700, color = '#fff', stagger = .09, dur = .55, end = 1e9, fo = .35, spacing = 0, align = 'center', rise = 46, glow = null } = opts;
  font(size, weight);
  ctx.letterSpacing = spacing + 'px';
  const ws = text.split(' ');
  const sp = ctx.measureText(' ').width;
  const widths = ws.map(w => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'left' ? x : x - total;
  const outA = 1 - prog(t, end - fo, end);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ws.forEach((w, i) => {
    const p = start <= -1 ? 1 : prog(t, start + i * stagger, start + i * stagger + dur);
    if (p > 0 && outA > 0) {
      const e = eo(p);
      ctx.save();
      ctx.globalAlpha *= e * outA;
      ctx.fillStyle = color;
      if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 30; }
      const blur = (1 - e) * 14 + (1 - outA) * 10;
      if (blur > .3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
      ctx.fillText(w, cx, y + (1 - e) * rise - (1 - outA) * 30);
      ctx.restore();
    }
    cx += widths[i] + sp;
  });
  ctx.letterSpacing = '0px';
}

function label(text, y, t, start, end = 1e9, color = GOLD) {
  const a = start <= -1 ? 1 - prog(t, end - .4, end) : life(t, start, end, .5, .4);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  font(30, 700); ctx.letterSpacing = '12px';
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2 + 6, y);
  const tw = ctx.measureText(text).width;
  const lp = start <= -1 ? 1 : eo(prog(t, start, start + .8));
  ctx.strokeStyle = 'rgba(245,179,1,.55)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - tw / 2 - 30, y); ctx.lineTo(W / 2 - tw / 2 - 30 - 80 * lp, y);
  ctx.moveTo(W / 2 + tw / 2 + 30, y); ctx.lineTo(W / 2 + tw / 2 + 30 + 80 * lp, y);
  ctx.stroke(); ctx.restore(); ctx.letterSpacing = '0px';
}

function pill(text, x, y, size, bg, fg, p, glow = GOLD_GLOW, padX = .45) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = back(p); ctx.scale(s, s);
  font(size, 900);
  const tw = ctx.measureText(text).width, ph = size * 1.25, pw = tw + size * padX * 2;
  ctx.fillStyle = bg; if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 45; }
  ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, 22); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, size * .03);
  ctx.restore();
}

// warning triangle
function warn(x, y, s, a = 1, filled = true) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, -46); ctx.lineTo(50, 40); ctx.lineTo(-50, 40); ctx.closePath();
  ctx.lineJoin = 'round';
  if (filled) { ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#000'; }
  else { ctx.strokeStyle = GOLD; ctx.lineWidth = 6; ctx.stroke(); ctx.fillStyle = GOLD; }
  ctx.fillRect(-5, -18, 10, 34); ctx.beginPath(); ctx.arc(0, 28, 6, 0, 7); ctx.fill();
  ctx.restore();
}

// file attachment card (chat-style)
function fileCard(x, y, w, name, a = 1, hlApk = 0, size = '4,2 MB') {
  if (a <= 0) return;
  const h = 150;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 26); ctx.fill(); ctx.stroke();
  // file icon
  const ix = x + 30, iy = y + 25;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ix + 60, iy); ctx.lineTo(ix + 80, iy + 20); ctx.lineTo(ix + 80, iy + 100); ctx.lineTo(ix, iy + 100); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#000'; font(22, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('APK', ix + 40, iy + 62);
  // name
  const base = name.replace(/\.apk$/, '');
  font(40, 700); ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText(base, x + 135, y + 58);
  const bw = ctx.measureText(base).width;
  ctx.fillStyle = hlApk > 0 ? GOLD : '#fff';
  if (hlApk > 0) { ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 25 * hlApk; }
  ctx.save(); ctx.translate(x + 135 + bw, y + 58); const s = 1 + .25 * Math.sin(Math.PI * clamp(hlApk * 1.6)); ctx.scale(s, s); ctx.fillText('.apk', 0, 0); ctx.restore();
  ctx.shadowBlur = 0;
  font(28, 500); ctx.fillStyle = '#8a8a8a'; ctx.fillText(size + ' · Aplikasi', x + 135, y + 106);
  ctx.restore();
}

function check(x, y, r, p, filled = true) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = back(clamp(p * 1.5)); ctx.scale(s, s);
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 25; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#000'; ctx.lineWidth = r * .2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const cp = clamp(p * 1.5 - .3);
  ctx.beginPath(); ctx.moveTo(-r * .42, 0);
  const pts = [[-r * .42, 0], [-r * .1, r * .32], [r * .45, -r * .3]];
  if (cp < .4) ctx.lineTo(lerp(pts[0][0], pts[1][0], cp / .4), lerp(pts[0][1], pts[1][1], cp / .4));
  else { ctx.lineTo(pts[1][0], pts[1][1]); const q = (cp - .4) / .6; ctx.lineTo(lerp(pts[1][0], pts[2][0], q), lerp(pts[1][1], pts[2][1], q)); }
  ctx.stroke(); ctx.restore();
}

function numBadge(x, y, n, p) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = back(p); ctx.scale(s, s);
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 25; ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  font(44, 900); ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(n), 0, 2);
  ctx.restore();
}

// ---------- background ----------
const grain = [];
(function makeGrain() {
  const r = rng(7);
  for (let k = 0; k < 6; k++) {
    const g = document.createElement('canvas'); g.width = 270; g.height = 480;
    const gx = g.getContext('2d'); const id = gx.createImageData(270, 480);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
    gx.putImageData(id, 0, 0); grain.push(g);
  }
})();
const dust = (() => { const r = rng(42); return Array.from({ length: 60 }, () => ({ x: r() * W, y: r() * H, s: .5 + r() * 2, v: 8 + r() * 30, a: .1 + r() * .3, ph: r() * 6, g: r() < .3 })); })();

function background(t) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#0B1026'); g.addColorStop(1, '#1A0B2E');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  [[.2, .26, '91,140,255', 0], [.85, .68, '255,107,214', 2], [.45, .9, '255,181,71', 4]].forEach(([bx, by, col, ph]) => {
    const x = W * (bx + .1 * Math.sin(t * .3 + ph)), y = H * (by + .06 * Math.cos(t * .25 + ph));
    const rg = ctx.createRadialGradient(x, y, 0, x, y, 560); rg.addColorStop(0, `rgba(${col},.32)`); rg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  });
  const off = (t * 10) % 90; ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 2;
  for (let x = 0; x <= W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -90 + off; y < H; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  dust.forEach(d => { const y = ((d.y - t * d.v) % H + H) % H; ctx.fillStyle = `rgba(255,255,255,${d.a * .6})`; ctx.beginPath(); ctx.arc(d.x, y, d.s, 0, 7); ctx.fill(); });
}
function overlay(t, frame) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .5; ctx.drawImage(grain[frame % grain.length], 0, 0, W, H); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 0, W, 5);
  const pg = ctx.createLinearGradient(0, 0, W, 0); pg.addColorStop(0, '#FFB547'); pg.addColorStop(1, '#FF6BD6');
  ctx.fillStyle = pg; ctx.fillRect(0, 0, W * (t / DURATION), 5);
}
// peta waktu per adegan: [waktu baru, waktu animasi lama] supaya animasi ikut VO yang lebih cepat
function warp(lt, P) { if (!P) return lt; for (let i = 1; i < P.length; i++) if (lt <= P[i][0]) return lerp(P[i - 1][1], P[i][1], (lt - P[i - 1][0]) / (P[i][0] - P[i - 1][0])); const L = P[P.length - 1]; return L[1] + (lt - L[0]); }
function scene(t, a, b, fn, fi = .3, fo = .5, P = null) {
  if (t < a || t > b) return;
  const inp = fi <= 0 ? 1 : prog(t, a, a + fi), outp = prog(t, b - fo, b);
  ctx.save();
  ctx.globalAlpha = Math.min(eo(inp), 1 - outp);
  const push = 1 + .035 * prog(t, a, b);                       // kamera pelan mendekat
  const s = push * (fi <= 0 ? 1 : lerp(.86, 1, back(inp))) * (1 + eio(outp) * .18);
  ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
  if (outp > 0) ctx.filter = `blur(${(outp * 6).toFixed(1)}px)`;
  fn(warp(t - a, P), t);
  ctx.restore();
}

// ---------- cue helper ----------
const cu = (i, k, f = 0) => { const c = TIMING.CUE[i]; return c[k] + f * (c[k + 1] - c[k]) - TIMING.SC[i]; };
const PINK = '#FF6BD6', BLUE = '#5B8CFF', SKY = '#9FB4FF';
function grad(x0, x1) { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, '#FFB547'); g.addColorStop(1, PINK); return g; }
function gtext(s, x, y, size, p = 1, weight = 900) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const k = back(clamp(p)); ctx.scale(k, k); ctx.globalAlpha *= clamp(p * 2);
  font(size, weight); const tw = ctx.measureText(s).width; ctx.fillStyle = grad(-tw / 2, tw / 2);
  ctx.shadowColor = 'rgba(255,107,214,.45)'; ctx.shadowBlur = 40; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 0); ctx.restore();
}
function wtext(s, x, y, size, p = 1, col = '#fff', weight = 800) {
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= eo(clamp(p)); ctx.translate(x, y + (1 - eo(clamp(p))) * 40);
  font(size, weight); ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 0); ctx.restore();
}
function glass(s, x, y, size, p, col = '#fff', hl = false) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const k = back(clamp(p)); ctx.scale(k, k);
  font(size, 700); const w = ctx.measureText(s).width + size * 1.5, h = size * 2.1;
  ctx.fillStyle = hl ? 'rgba(255,107,214,.22)' : 'rgba(255,255,255,.1)'; ctx.strokeStyle = hl ? PINK : 'rgba(255,255,255,.3)'; ctx.lineWidth = hl ? 4 : 2;
  if (hl) { ctx.shadowColor = 'rgba(255,107,214,.6)'; ctx.shadowBlur = 35; }
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 2); ctx.restore();
}
const SCREENS = [['#5B8CFF', '#A86BFF', '#FF8A5B'], ['#22D3EE', '#5B8CFF', '#A86BFF'], ['#FF6BD6', '#FFB547', '#FDE68A'], ['#34D399', '#22D3EE', '#5B8CFF'], ['#A86BFF', '#FF6BD6', '#FF8A5B']];
function touchPhone(x, y, s, rot = 0, a = 1, v = 0, glow = .8) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = `rgba(168,107,255,${glow})`; ctx.shadowBlur = 90;
  ctx.fillStyle = '#0F0F14'; ctx.beginPath(); ctx.roundRect(-150, -300, 300, 600, 52); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 3; ctx.stroke();
  const C = SCREENS[v % SCREENS.length], g = ctx.createLinearGradient(-130, -280, 130, 280);
  g.addColorStop(0, C[0]); g.addColorStop(.5, C[1]); g.addColorStop(1, C[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-132, -282, 264, 564, 40); ctx.fill();
  const cols = ['#FFD54A', '#4ADE80', '#FF6B6B', '#60A5FA', '#FFFFFF', '#F472B6'];
  for (let r = 0; r < 5; r++) for (let k = 0; k < 4; k++) { ctx.fillStyle = cols[(r * 4 + k + v) % 6]; ctx.beginPath(); ctx.roundRect(-108 + k * 58, -230 + r * 72, 42, 42, 12); ctx.fill(); }
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(-40, -270, 80, 16, 8); ctx.fill();
  // kilau kaca
  const sh = ctx.createLinearGradient(-150, -300, 150, 300); sh.addColorStop(0, 'rgba(255,255,255,.18)'); sh.addColorStop(.35, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.beginPath(); ctx.roundRect(-132, -282, 264, 564, 40); ctx.fill();
  ctx.restore();
}
function keypadPhone(x, y, s, a = 1, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 300, 150, 22, 0, 0, 7); ctx.fill();
  const bg = ctx.createLinearGradient(-120, -270, 120, 270); bg.addColorStop(0, '#3B4266'); bg.addColorStop(1, '#232842');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-120, -270, 240, 540, 50); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#7DD3FC'; ctx.beginPath(); ctx.roundRect(-90, -220, 180, 150, 14); ctx.fill();
  ctx.fillStyle = 'rgba(15,23,42,.75)'; font(26, 800); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(o.sms !== undefined ? 'SMS' : '12:30', -72, -192);
  if (o.sms !== undefined) { font(28, 700); ctx.fillText(o.sms + (Math.floor((o.t || 0) * 3) % 2 ? '|' : ''), -72, -140); }
  else { ctx.fillRect(-72, -160, 120, 10); ctx.fillRect(-72, -132, 80, 10); }
  for (let r = 0; r < 4; r++) for (let k = 0; k < 3; k++) {
    const n = r * 3 + k, on = o.hl === n;
    ctx.fillStyle = on ? '#FFB547' : '#4A5280'; if (on) { ctx.shadowColor = 'rgba(255,181,71,.8)'; ctx.shadowBlur = 25; }
    ctx.beginPath(); ctx.roundRect(-84 + k * 60, -20 + r * 62 + (on ? 4 : 0), 48, 44, 12); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = on ? '#1a1a1a' : 'rgba(255,255,255,.75)'; font(22, 800); ctx.textAlign = 'center'; ctx.fillText('123456789*0#'[n], -60 + k * 60, 3 + r * 62 + (on ? 4 : 0));
  }
  ctx.restore();
}
function laugh(x, y, r, p, t, ph = 0) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y + Math.sin(t * 9 + ph) * 6); ctx.rotate(Math.sin(t * 7 + ph) * .12); const k = back(clamp(p)); ctx.scale(k, k);
  ctx.fillStyle = '#FFD54A'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#3a2a00'; ctx.lineWidth = r * .1; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-r * .35, -r * .15, r * .18, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(r * .35, -r * .15, r * .18, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ctx.fillStyle = '#3a2a00'; ctx.beginPath(); ctx.arc(0, r * .15, r * .45, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#60A5FA'; ctx.beginPath(); ctx.ellipse(-r * .75, r * .05, r * .12, r * .2, 0, 0, 7); ctx.ellipse(r * .75, r * .05, r * .12, r * .2, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function rays(x, y, R, a, t) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(t * .25);
  for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI * 2 / 16); const g = ctx.createLinearGradient(0, 0, 0, -R); g.addColorStop(0, 'rgba(255,107,214,.35)'); g.addColorStop(1, 'rgba(91,140,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, -R); ctx.lineTo(40, -R); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function xDot(x, y, r, p) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const k = back(clamp(p)); ctx.scale(k, k);
  ctx.fillStyle = PINK; ctx.shadowColor = 'rgba(255,107,214,.7)'; ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * .22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r * .38, -r * .38); ctx.lineTo(r * .38, r * .38); ctx.moveTo(r * .38, -r * .38); ctx.lineTo(-r * .38, r * .38); ctx.stroke(); ctx.restore();
}
const P = (lt, a, d = .35) => prog(lt, a, a + d);

// ---------- S1: hook — frame 0 sudah lengkap ----------
function s1(lt, t) {
  wtext('TAHUN 2007', W / 2, 400, 42, 1, SKY, 800);
  wtext('HP ini sempat', W / 2, 520, 88, 1);
  const pz = 1 + .03 * Math.sin(lt * 6);
  ctx.save(); ctx.translate(W / 2, 660); ctx.scale(pz, pz); gtext('DIKETAWAIN', 0, 0, 138); ctx.restore();
  keypadPhone(250, 1130, .6, 1);
  touchPhone(650, 1110 + Math.sin(t * 2) * 10, .95, .05, 1, 0);
  const b0 = cu(0, 1) + .45;
  glass('“Enggak ada tombolnya?”', 300, 850, 40, P(lt, b0));
  glass('“Kemahalan!”', 820, 1380, 42, P(lt, b0 + .4));
  laugh(170, 1330, 62, P(lt, b0), t, 0); laugh(950, 820, 54, P(lt, b0 + .4), t, 2);
}

// ---------- S2: HP zaman dulu ----------
function s2(lt, t) {

// ---------- CTA / penutup ----------
function logo(x, y, s, lt, t) {

  [[3, 0], [3, 1], [3, 2], [1, 2]].forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(...nodes[a]); ctx.lineTo(lerp(nodes[a][0], nodes[b][0], lp), lerp(nodes[a][1], nodes[b][1], lp)); ctx.stroke(); });
  nodes.forEach(([nx, ny], i) => { ctx.fillStyle = i === 3 ? GOLD : '#fff'; ctx.beginPath(); ctx.arc(nx, ny, i === 3 ? 13 : 10, 0, 7); ctx.fill(); });

}
function cta(lt, t) {
  words('SEJARAH', W / 2, 440, 88, lt, .1, { weight: 900, stagger: .1, spacing: 2 });
  pill('iPHONE', W / 2, 555, 76, GOLD, '#000', prog(lt, .35, .85));
  const ap = prog(lt, .6, 1.2);
  if (ap > 0) {
    logo(W / 2, 790, back(ap), lt, t);
    const bp = back(prog(lt, 1.0, 1.4)), followed = lt > 2.05;
    ctx.save(); ctx.translate(W / 2, 905); ctx.scale(bp, bp);
    ctx.fillStyle = followed ? GOLD : '#000'; ctx.strokeStyle = GOLD; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = followed ? '#000' : GOLD; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
    if (followed) { ctx.moveTo(-11, 1); ctx.lineTo(-3, 9); ctx.lineTo(12, -8); } else { ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.moveTo(0, -11); ctx.lineTo(0, 11); }
    ctx.stroke(); ctx.restore();
  }
  words(CONFIG.name, W / 2, 1010, 66, lt, 1.0, { weight: 800, stagger: .08 });
  words(CONFIG.sub, W / 2, 1075, 32, lt, 1.3, { weight: 500, color: '#9a9a9a', stagger: .04 });

  const btn = (y, start, text, filled, icon, pressT) => {
    const p = prog(lt, start, start + .5); if (p <= 0) return;
    const press = Math.sin(Math.PI * prog(lt, pressT, pressT + .3));
    const done = lt > pressT + .15;
    ctx.save(); ctx.globalAlpha *= eo(p);
    ctx.translate(W / 2, y + (1 - eo(p)) * 50); const s = 1 - press * .06; ctx.scale(s, s);
    const bw = 560, bh = 108;
    ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2);
    const isFilled = filled !== done;
    if (isFilled) { ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0; }
    else { ctx.strokeStyle = GOLD; ctx.lineWidth = 4; ctx.stroke(); }
    const lb = done ? text[1] : text[0];
    font(44, 800); ctx.letterSpacing = '6px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = isFilled ? '#000' : GOLD; ctx.fillText(lb, 34, 2); ctx.letterSpacing = '0px';
    const tw = ctx.measureText(lb).width;

    ctx.restore();
    const rp = prog(lt, pressT, pressT + .7);
    if (rp > 0 && rp < 1) { ctx.save(); ctx.globalAlpha = (1 - rp) * .7; ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W / 2 + 150, y, 20 + rp * 110, 0, 7); ctx.stroke(); ctx.restore(); }

    ctx.beginPath(); ctx.arc(-6, 18, 16, Math.PI, 0); ctx.fill();

    ctx.stroke(); ctx.restore();

  const iconShare = (x, y, c) => {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(4, -20); ctx.lineTo(26, 0); ctx.lineTo(4, 20); ctx.lineTo(4, 9);
    ctx.quadraticCurveTo(-14, 7, -24, 20); ctx.quadraticCurveTo(-20, -6, 4, -9); ctx.closePath(); ctx.fill(); ctx.restore();
  };

// ---------- efek: hentakan, getar, partikel, kilat, caption ----------
const lastEvent = t => { let e = -1; for (const x of EVENTS) if (x <= t) e = x; return e; };
const SHAKE_AT = TIMING.SHAKE;
function punch(t) { const e = lastEvent(t); return e < 0 ? 1 : 1 + .028 * Math.exp(-(t - e) * 10); }
function shake(t) {
  let a = 0; SHAKE_AT.forEach(e => { if (t >= e && t < e + .35) a = Math.max(a, 1 - (t - e) / .35); });
  return a > 0 ? [Math.sin(t * 90) * 10 * a, Math.cos(t * 77) * 8 * a] : [0, 0];
}
function bursts(t) {
  EVENTS.forEach((e, n) => {
    const p = (t - e) / .7; if (p < 0 || p > 1) return;
    const r = rng(100 + n), cx = W / 2 + (r() - .5) * 500, cy = 600 + r() * 700;
    for (let k = 0; k < 14; k++) {
      const ang = r() * 6.28, sp = 120 + r() * 260, x = cx + Math.cos(ang) * sp * eo(p), y = cy + Math.sin(ang) * sp * eo(p) + 80 * p * p;
      ctx.save(); ctx.globalAlpha = (1 - p) * .9; ctx.fillStyle = ['#FFB547', '#FF6BD6', '#5B8CFF', '#fff'][k % 4];
      ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(x, y, 3 + r() * 4 * (1 - p), 0, 7); ctx.fill(); ctx.restore();
    }
  });
}
function flash(t) {
  TIMING.SC.slice(1, -1).forEach(c => { const p = (t - c) / .18; if (p >= 0 && p < 1) { ctx.fillStyle = `rgba(255,255,255,${.22 * (1 - p)})`; ctx.fillRect(0, 0, W, H); } });
}
function captions(t) {
  if (t >= TIMING.SC[TIMING.SC.length - 2]) return;
  const c = TIMING.CAPS.find(c => t >= c.t0 && t < c.t1 + .08); if (!c) return;
  const ws = c.text.split(' '), L = ws.map(w => w.length + 1), tot = L.reduce((a, b) => a + b, 0);
  const sp = (c.t1 - c.t0) * .92; let acc = 0; const wt = L.map(l => { const x = c.t0 + sp * acc / tot; acc += l; return x; });
  font(46, 800); const gap = ctx.measureText(' ').width * 1.7, wd = ws.map(w => ctx.measureText(w).width);
  // bungkus jadi maks 2 baris (lebar 900)
  const lines = [[]]; let lw = 0;
  ws.forEach((w, i) => { if (lw + wd[i] > 900 && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(i); lw += wd[i] + gap; });
  const pin = back(clamp((t - c.t0) / .18)), y0 = 1540 - (lines.length - 1) * 31;
  lines.forEach((ln, li) => {
    const tw = ln.reduce((a, i) => a + wd[i], 0) + gap * (ln.length - 1); let x = W / 2 - tw / 2; const y = y0 + li * 62;
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(pin, pin); ctx.translate(-W / 2, -y);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.roundRect(x - 22, y - 34, tw + 44, 68, 18); ctx.fill();
    ln.forEach(i => {
      const on = t >= wt[i], cur = on && (i === ws.length - 1 || t < wt[i + 1]);
      ctx.fillStyle = cur ? GOLD : on ? '#fff' : 'rgba(255,255,255,.45)'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      if (cur) { ctx.save(); ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 18; ctx.translate(x + wd[i] / 2, y); ctx.scale(1.05, 1.05); ctx.fillText(ws[i], -wd[i] / 2, 2); ctx.restore(); }
      else ctx.fillText(ws[i], x, y + 2);
      x += wd[i] + gap;
    });
    ctx.restore();
  });
}

// ---------- master ----------
const FNS = [s1, s2, s3, s4, s5, s6, s7, cta];
function renderFrame(t) {
  const frame = Math.round(t * FPS), SC = TIMING.SC;
  ctx.save(); ctx.globalAlpha = 1; ctx.filter = 'none';
  background(t);
  const [sx, sy] = shake(t), pz = punch(t);
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(pz, pz); ctx.translate(-W / 2, -H / 2);
  FNS.forEach((fn, i) => {
    const last = i === FNS.length - 1, a = SC[i], b = last ? DURATION + .01 : SC[i + 1] + .05;
    scene(t, a, b, fn, i === 0 ? 0 : .22, last ? .01 : .22);
  });
  bursts(t);
  ctx.restore();
  flash(t);
  captions(t);
  overlay(t, frame);
}

window.renderFrame = renderFrame;
window.FPS = FPS; window.DURATION = DURATION;
window.ready = document.fonts.load(`800 40px Inter`).then(() => document.fonts.load(`300 40px Inter`)).then(() => document.fonts.ready).then(() => true);

if (!params.has('render')) {
  const t0 = performance.now();
  (function loop() { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else document.body.classList.add('render');
</script>
