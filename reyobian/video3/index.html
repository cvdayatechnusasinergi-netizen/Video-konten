<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sejarah iPhone</title>
<style>
  html,body{margin:0;background:#000;}
  canvas{display:block;width:360px;height:640px;}
  body.render canvas{width:1080px;height:1920px;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timing.js"></script>
<script>
// Reyo Bian #3 — Sejarah iPhone (Facebook Reels). HP digambar generik: tanpa logo/foto produk.
// Gaya: latar hitam, grid titik, grain, aksen KUNING/EMAS (warna sampul profil Reyo Bian).
// ============ CONFIG ============
const params = new URLSearchParams(location.search);
const CONFIG = {
  name: params.get('brand') || 'Reyo Bian',
  sub: 'Pangkalan Bun',
};
// ================================

const W = 1080, H = 1920, FPS = 30, DURATION = TIMING.END;
const EVENTS = TIMING.EVENTS.filter(e => e[1] !== "whoosh").map(e => e[0]);
const GOLD = '#F5B301', GOLD_GLOW = 'rgba(245,179,1,.65)';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'Inter, "Inter Display", "DejaVu Sans", sans-serif';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rupiah = v => 'Rp' + Math.max(0, Math.round(v)).toLocaleString('id-ID');
function font(size, weight = 700) { ctx.font = `${weight} ${size}px ${FONT}`; }
function life(t, a, b, fi = .35, fo = .35) { return Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b)); }

function words(text, x, y, size, t, start, opts = {}) {
  const { weight = 700, color = '#fff', stagger = .09, dur = .55, end = 1e9, fo = .35, spacing = 0, align = 'center', rise = 46, glow = null } = opts;
  font(size, weight);
  ctx.letterSpacing = spacing + 'px';
  const ws = text.split(' ');
  const sp = ctx.measureText(' ').width;
  const widths = ws.map(w => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'left' ? x : x - total;
  const outA = 1 - prog(t, end - fo, end);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ws.forEach((w, i) => {
    const p = start <= -1 ? 1 : prog(t, start + i * stagger, start + i * stagger + dur);
    if (p > 0 && outA > 0) {
      const e = eo(p);
      ctx.save();
      ctx.globalAlpha *= e * outA;
      ctx.fillStyle = color;
      if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 30; }
      const blur = (1 - e) * 14 + (1 - outA) * 10;
      if (blur > .3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
      ctx.fillText(w, cx, y + (1 - e) * rise - (1 - outA) * 30);
      ctx.restore();
    }
    cx += widths[i] + sp;
  });
  ctx.letterSpacing = '0px';
}

function label(text, y, t, start, end = 1e9, color = GOLD) {
  const a = start <= -1 ? 1 - prog(t, end - .4, end) : life(t, start, end, .5, .4);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  font(30, 700); ctx.letterSpacing = '12px';
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2 + 6, y);
  const tw = ctx.measureText(text).width;
  const lp = start <= -1 ? 1 : eo(prog(t, start, start + .8));
  ctx.strokeStyle = 'rgba(245,179,1,.55)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - tw / 2 - 30, y); ctx.lineTo(W / 2 - tw / 2 - 30 - 80 * lp, y);
  ctx.moveTo(W / 2 + tw / 2 + 30, y); ctx.lineTo(W / 2 + tw / 2 + 30 + 80 * lp, y);
  ctx.stroke(); ctx.restore(); ctx.letterSpacing = '0px';
}

function pill(text, x, y, size, bg, fg, p, glow = GOLD_GLOW, padX = .45) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = back(p); ctx.scale(s, s);
  font(size, 900);
  const tw = ctx.measureText(text).width, ph = size * 1.25, pw = tw + size * padX * 2;
  ctx.fillStyle = bg; if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 45; }
  ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, 22); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, size * .03);
  ctx.restore();
}

// warning triangle
function warn(x, y, s, a = 1, filled = true) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, -46); ctx.lineTo(50, 40); ctx.lineTo(-50, 40); ctx.closePath();
  ctx.lineJoin = 'round';
  if (filled) { ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#000'; }
  else { ctx.strokeStyle = GOLD; ctx.lineWidth = 6; ctx.stroke(); ctx.fillStyle = GOLD; }
  ctx.fillRect(-5, -18, 10, 34); ctx.beginPath(); ctx.arc(0, 28, 6, 0, 7); ctx.fill();
  ctx.restore();
}

// file attachment card (chat-style)
function fileCard(x, y, w, name, a = 1, hlApk = 0, size = '4,2 MB') {
  if (a <= 0) return;
  const h = 150;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 26); ctx.fill(); ctx.stroke();
  // file icon
  const ix = x + 30, iy = y + 25;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ix + 60, iy); ctx.lineTo(ix + 80, iy + 20); ctx.lineTo(ix + 80, iy + 100); ctx.lineTo(ix, iy + 100); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#000'; font(22, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('APK', ix + 40, iy + 62);
  // name
  const base = name.replace(/\.apk$/, '');
  font(40, 700); ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText(base, x + 135, y + 58);
  const bw = ctx.measureText(base).width;
  ctx.fillStyle = hlApk > 0 ? GOLD : '#fff';
  if (hlApk > 0) { ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 25 * hlApk; }
  ctx.save(); ctx.translate(x + 135 + bw, y + 58); const s = 1 + .25 * Math.sin(Math.PI * clamp(hlApk * 1.6)); ctx.scale(s, s); ctx.fillText('.apk', 0, 0); ctx.restore();
  ctx.shadowBlur = 0;
  font(28, 500); ctx.fillStyle = '#8a8a8a'; ctx.fillText(size + ' · Aplikasi', x + 135, y + 106);
  ctx.restore();
}

function check(x, y, r, p, filled = true) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = back(clamp(p * 1.5)); ctx.scale(s, s);
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 25; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#000'; ctx.lineWidth = r * .2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const cp = clamp(p * 1.5 - .3);
  ctx.beginPath(); ctx.moveTo(-r * .42, 0);
  const pts = [[-r * .42, 0], [-r * .1, r * .32], [r * .45, -r * .3]];
  if (cp < .4) ctx.lineTo(lerp(pts[0][0], pts[1][0], cp / .4), lerp(pts[0][1], pts[1][1], cp / .4));
  else { ctx.lineTo(pts[1][0], pts[1][1]); const q = (cp - .4) / .6; ctx.lineTo(lerp(pts[1][0], pts[2][0], q), lerp(pts[1][1], pts[2][1], q)); }
  ctx.stroke(); ctx.restore();
}

function numBadge(x, y, n, p) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = back(p); ctx.scale(s, s);
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 25; ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  font(44, 900); ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(n), 0, 2);
  ctx.restore();
}

// ---------- background ----------
const grain = [];
(function makeGrain() {
  const r = rng(7);
  for (let k = 0; k < 6; k++) {
    const g = document.createElement('canvas'); g.width = 270; g.height = 480;
    const gx = g.getContext('2d'); const id = gx.createImageData(270, 480);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
    gx.putImageData(id, 0, 0); grain.push(g);
  }
})();
const dust = (() => { const r = rng(42); return Array.from({ length: 60 }, () => ({ x: r() * W, y: r() * H, s: .5 + r() * 2, v: 8 + r() * 30, a: .1 + r() * .3, ph: r() * 6, g: r() < .3 })); })();

function background(t) {
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, H * .7);
  g.addColorStop(0, 'rgba(245,179,1,.06)'); g.addColorStop(1, 'rgba(245,179,1,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // dua cahaya yang melayang pelan
  [[.3, .35, .7, 0], [.75, .7, .5, 2.1]].forEach(([bx, by, sp, ph]) => {
    const x = W * (bx + .12 * Math.sin(t * .35 * sp + ph)), y = H * (by + .08 * Math.cos(t * .3 * sp + ph));
    const lg = ctx.createRadialGradient(x, y, 0, x, y, 520); lg.addColorStop(0, 'rgba(245,179,1,.09)'); lg.addColorStop(1, 'rgba(245,179,1,0)');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  });
  // garis cahaya diagonal yang lewat tiap beberapa detik
  const sw = ((t * .22) % 1.6) - .3;
  ctx.save(); ctx.translate(W * sw * 1.4, 0); ctx.rotate(.35);
  const sg = ctx.createLinearGradient(-120, 0, 120, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.035)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(-120, -400, 240, H * 1.6); ctx.restore();
  const step = 60, off = (t * 6) % step;
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let y = -step; y < H + step; y += step) for (let x = 30; x < W; x += step) { ctx.beginPath(); ctx.arc(x, y + off, 1.6, 0, Math.PI * 2); ctx.fill(); }
  dust.forEach(d => {
    const y = ((d.y - t * d.v) % H + H) % H;
    const a = d.a * (.6 + .4 * Math.sin(t * 2 + d.ph));
    ctx.fillStyle = d.g ? `rgba(245,179,1,${a})` : `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(d.x + Math.sin(t * .5 + d.ph) * 20, y, d.s, 0, Math.PI * 2); ctx.fill();
  });
}
function overlay(t, frame) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .9; ctx.drawImage(grain[frame % grain.length], 0, 0, W, H); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, 0, W, 4);
  ctx.fillStyle = GOLD; ctx.fillRect(0, 0, W * (t / DURATION), 4);
}
// peta waktu per adegan: [waktu baru, waktu animasi lama] supaya animasi ikut VO yang lebih cepat
function warp(lt, P) { if (!P) return lt; for (let i = 1; i < P.length; i++) if (lt <= P[i][0]) return lerp(P[i - 1][1], P[i][1], (lt - P[i - 1][0]) / (P[i][0] - P[i - 1][0])); const L = P[P.length - 1]; return L[1] + (lt - L[0]); }
function scene(t, a, b, fn, fi = .3, fo = .5, P = null) {
  if (t < a || t > b) return;
  const inp = fi <= 0 ? 1 : prog(t, a, a + fi), outp = prog(t, b - fo, b);
  ctx.save();
  ctx.globalAlpha = Math.min(eo(inp), 1 - outp);
  const push = 1 + .035 * prog(t, a, b);                       // kamera pelan mendekat
  const s = push * (fi <= 0 ? 1 : lerp(.86, 1, back(inp))) * (1 + eio(outp) * .18);
  ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
  if (outp > 0) ctx.filter = `blur(${(outp * 6).toFixed(1)}px)`;
  fn(warp(t - a, P), t);
  ctx.restore();
}

// ---------- cue helper: waktu lokal adegan i untuk frasa k ----------
const cu = (i, k, f = 0) => { const c = TIMING.CUE[i]; return c[k] + f * (c[k + 1] - c[k]) - TIMING.SC[i]; };

// ---------- HP generik (bukan produk/merek asli) ----------
// style: 'classic' (tombol home), 'x' (layar penuh + poni), 'pill' (layar penuh + pulau), 'fold'
function phone(x, y, s, style, a = 1, screen = null, open = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s);
  if (style === 'fold') {
    const ang = lerp(Math.PI * .5, 0, eio(open));               // 0 = terbuka penuh
    const pw = 210, ph = 460;
    [-1, 1].forEach(side => {
      ctx.save(); ctx.scale(side * Math.cos(ang) + (side < 0 ? 0 : 0), 1);
      ctx.fillStyle = '#0c0c0c'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.roundRect(0, -ph / 2, pw * side * side, ph, 34); ctx.fill(); ctx.stroke();
      ctx.restore();
    });
    // layar terbuka
    const g = ctx.createLinearGradient(-pw, 0, pw, 0); g.addColorStop(0, 'rgba(245,179,1,.25)'); g.addColorStop(1, 'rgba(255,255,255,.12)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-pw * Math.cos(ang) + 14, -ph / 2 + 14, (pw * Math.cos(ang)) * 2 - 28, ph - 28, 24); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(0, -ph / 2 + 10); ctx.lineTo(0, ph / 2 - 10); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore(); return;
  }
  const w = 240, h = style === 'classic' ? 460 : 480, r = style === 'classic' ? 40 : 50;
  ctx.shadowColor = 'rgba(245,179,1,.35)'; ctx.shadowBlur = 50;
  ctx.fillStyle = '#0c0c0c'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, r); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
  let sx, sy, sw, sh;
  if (style === 'classic') {
    sx = -w / 2 + 18; sy = -h / 2 + 62; sw = w - 36; sh = h - 140;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(-26, -h / 2 + 28, 52, 8, 4); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, h / 2 - 38, 20, 0, 7); ctx.stroke();
  } else {
    sx = -w / 2 + 12; sy = -h / 2 + 12; sw = w - 24; sh = h - 24;
  }
  const g = ctx.createLinearGradient(0, sy, 0, sy + sh); g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(245,179,1,.10)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, style === 'classic' ? 6 : 40); ctx.fill();
  if (style === 'x') { ctx.fillStyle = '#0c0c0c'; ctx.beginPath(); ctx.roundRect(-60, -h / 2 + 6, 120, 30, 14); ctx.fill(); }
  if (style === 'pill') { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.roundRect(-46, -h / 2 + 26, 92, 28, 14); ctx.fill(); }
  if (screen) { ctx.save(); ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip(); screen({ sx, sy, sw, sh, w, h }); ctx.restore(); }
  ctx.restore();
}
function xMark(x, y, r, p) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = back(clamp(p * 1.4)); ctx.scale(s, s);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = r * .22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r * .38, -r * .38); ctx.lineTo(r * .38, r * .38); ctx.moveTo(r * .38, -r * .38); ctx.lineTo(-r * .38, r * .38); ctx.stroke();
  ctx.restore();
}
function stamp(text, x, y, p, color = GOLD, rot = -.12, size = 64) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const s = lerp(1.8, 1, eo(p)); ctx.scale(s, s); ctx.globalAlpha *= eo(p);
  font(size, 900); ctx.letterSpacing = '3px'; const tw = ctx.measureText(text).width;
  ctx.strokeStyle = color; ctx.lineWidth = 9; ctx.shadowColor = color === GOLD ? GOLD_GLOW : 'rgba(255,255,255,.5)'; ctx.shadowBlur = 30;
  ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.beginPath(); ctx.roundRect(-tw / 2 - 34, -size * .85, tw + 68, size * 1.7, 18); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 2, 4);
  ctx.restore(); ctx.letterSpacing = '0px';
}

// ---------- S1: hook — frame 0 sudah berisi judul ----------
function s1(lt) {
  label('SEJARAH iPHONE', 400, lt, -1);
  font(100, 900); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('iPHONE PERTAMA', W / 2, 530);
  const pulse = 1 + .035 * Math.sin(lt * 7);
  ctx.save(); ctx.translate(W / 2, 680); ctx.scale(pulse, pulse);
  font(112, 900); const tw = ctx.measureText('ENGGAK BISA').width;
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 50;
  ctx.beginPath(); ctx.roundRect(-tw / 2 - 36, -74, tw + 72, 148, 24); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillText('ENGGAK BISA', 0, 4); ctx.restore();
  font(112, 900); ctx.fillStyle = '#fff'; ctx.fillText('COPY-PASTE?!', W / 2, 840);
  // popup salin/tempel
  const by = 1070;
  ctx.save();
  font(44, 500); ctx.fillStyle = '#cfcfcf'; ctx.fillText('Halo, apa kabar?', W / 2, by + 120);
  const sel = ctx.measureText('Halo, apa kabar?').width;
  ctx.fillStyle = 'rgba(245,179,1,.25)'; ctx.fillRect(W / 2 - sel / 2 - 6, by + 92, sel + 12, 58);
  ctx.fillStyle = '#1b1b1b'; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(W / 2 - 200, by - 30, 400, 84, 20); ctx.fill(); ctx.stroke();
  font(36, 700); ctx.fillStyle = '#fff'; ctx.fillText('Salin', W / 2 - 100, by + 12); ctx.fillText('Tempel', W / 2 + 100, by + 12);
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(W / 2 - 1, by - 14, 2, 52);
  ctx.restore();
  stamp('ENGGAK ADA', W / 2, by + 12, prog(lt, cu(0, 1), cu(0, 1) + .3), GOLD, -.1, 58);
}

// ---------- S2: 2007 ----------
function s2(lt, t) {
  // sorot panggung
  const sa = eo(prog(lt, 0, .5));
  ctx.save(); ctx.globalAlpha *= sa * .5;
  const g = ctx.createLinearGradient(W / 2, 300, W / 2, 1150); g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(W / 2 - 60, 300); ctx.lineTo(W / 2 + 60, 300); ctx.lineTo(W / 2 + 380, 1150); ctx.lineTo(W / 2 - 380, 1150); ctx.closePath(); ctx.fill(); ctx.restore();
  pill('2007', W / 2, 440, 110, GOLD, '#000', prog(lt, 0, .45));
  // 3 ikon -> jadi satu
  const merge = eio(prog(lt, cu(1, 5), cu(1, 5) + .45));
  const icons = [[250, 'note'], [540, 'call'], [830, 'globe']];
  icons.forEach(([x0, k], i) => {
    const p = prog(lt, cu(1, 2 + i), cu(1, 2 + i) + .35); if (p <= 0 || merge >= 1) return;
    const x = lerp(x0, W / 2, merge), y = lerp(760, 860, merge), s = back(p) * (1 - merge * .8);
    ctx.save(); ctx.globalAlpha *= 1 - merge; ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.strokeStyle = GOLD; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 95, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (k === 'note') { ctx.beginPath(); ctx.moveTo(-10, 30); ctx.lineTo(-10, -40); ctx.lineTo(30, -50); ctx.lineTo(30, 20); ctx.stroke(); ctx.beginPath(); ctx.arc(-24, 32, 15, 0, 7); ctx.arc(16, 22, 15, 0, 7); ctx.fill(); }

    ln.forEach(i => {
      const on = t >= wt[i], cur = on && (i === ws.length - 1 || t < wt[i + 1]);
      ctx.fillStyle = cur ? GOLD : on ? '#fff' : 'rgba(255,255,255,.45)'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      if (cur) { ctx.save(); ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 18; ctx.translate(x + wd[i] / 2, y); ctx.scale(1.05, 1.05); ctx.fillText(ws[i], -wd[i] / 2, 2); ctx.restore(); }
      else ctx.fillText(ws[i], x, y + 2);
      x += wd[i] + gap;
    });
    ctx.restore();
  });
}

// ---------- master ----------
const FNS = [s1, s2, s3, s4, s5, s6, cta];
function renderFrame(t) {
  const frame = Math.round(t * FPS), SC = TIMING.SC;
  ctx.save(); ctx.globalAlpha = 1; ctx.filter = 'none';
  background(t);
  const [sx, sy] = shake(t), pz = punch(t);
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(pz, pz); ctx.translate(-W / 2, -H / 2);
  FNS.forEach((fn, i) => {
    const last = i === FNS.length - 1, a = SC[i], b = last ? DURATION + .01 : SC[i + 1] + .05;
    scene(t, a, b, fn, i === 0 ? 0 : .22, last ? .01 : .22);
  });
  bursts(t);
  ctx.restore();
  flash(t);
  captions(t);
  overlay(t, frame);
}

window.renderFrame = renderFrame;
window.FPS = FPS; window.DURATION = DURATION;
window.ready = document.fonts.load(`800 40px Inter`).then(() => document.fonts.load(`300 40px Inter`)).then(() => document.fonts.ready).then(() => true);

if (!params.has('render')) {
  const t0 = performance.now();
  (function loop() { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else document.body.classList.add('render');
</script>
</body>
