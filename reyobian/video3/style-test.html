<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Style Test</title>
<style>html,body{margin:0;background:#222}canvas{display:block}</style>
</head>
<body>
<canvas id="a" width="1080" height="1920"></canvas>
<canvas id="b" width="1080" height="1920"></canvas>
<script>
// Uji gaya untuk video 3 baru: A = flat ilustrasi cerah, B = gelap modern berwarna.
const FONT = 'Inter, sans-serif';
function txt(c, s, x, y, size, w, col, al = 'center') { c.font = `${w} ${size}px ${FONT}`; c.fillStyle = col; c.textAlign = al; c.textBaseline = 'middle'; c.fillText(s, x, y); }
function keypadPhone(c, x, y, s, body, screen, keys) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(0, 300, 150, 22, 0, 0, 7); c.fill();
  c.fillStyle = body; c.beginPath(); c.roundRect(-120, -270, 240, 540, 50); c.fill();
  c.fillStyle = screen; c.beginPath(); c.roundRect(-90, -220, 180, 150, 14); c.fill();
  c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-70, -195, 80, 14); c.fillRect(-70, -165, 120, 10);
  for (let r = 0; r < 4; r++) for (let k = 0; k < 3; k++) { c.fillStyle = keys; c.beginPath(); c.roundRect(-84 + k * 60, -20 + r * 62, 48, 44, 12); c.fill(); }
  c.restore();
}
function touchPhone(c, x, y, s, rot, body, glow) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  if (glow) { c.shadowColor = glow; c.shadowBlur = 80; }
  c.fillStyle = body; c.beginPath(); c.roundRect(-150, -300, 300, 600, 52); c.fill(); c.shadowBlur = 0;
  const g = c.createLinearGradient(-130, -280, 130, 280); g.addColorStop(0, '#5B8CFF'); g.addColorStop(.5, '#A86BFF'); g.addColorStop(1, '#FF8A5B');
  c.fillStyle = g; c.beginPath(); c.roundRect(-132, -282, 264, 564, 40); c.fill();
  const cols = ['#FFD54A', '#4ADE80', '#FF6B6B', '#60A5FA', '#FFFFFF', '#F472B6'];
  for (let r = 0; r < 5; r++) for (let k = 0; k < 4; k++) { c.fillStyle = cols[(r * 4 + k) % 6]; c.beginPath(); c.roundRect(-108 + k * 58, -230 + r * 72, 42, 42, 12); c.fill(); }
  c.fillStyle = '#111'; c.beginPath(); c.roundRect(-40, -270, 80, 16, 8); c.fill();
  c.restore();
}
function bubble(c, s, x, y, bg, fg, size = 46, tail = -1) {
  c.font = `800 ${size}px ${FONT}`; const w = c.measureText(s).width + 70, h = size * 1.9;
  c.fillStyle = bg; c.beginPath(); c.roundRect(x - w / 2, y - h / 2, w, h, h / 2); c.fill();
  c.beginPath(); c.moveTo(x + tail * w * .2, y + h / 2 - 4); c.lineTo(x + tail * w * .2 + tail * 30, y + h / 2 + 28); c.lineTo(x + tail * w * .2 + tail * 50, y + h / 2 - 4); c.fill();
  txt(c, s, x, y + 2, size, 800, fg);
}
function laughFace(c, x, y, r, col) {
  c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  c.strokeStyle = '#3a2a00'; c.lineWidth = r * .1; c.lineCap = 'round';
  c.beginPath(); c.arc(x - r * .35, y - r * .15, r * .18, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
  c.beginPath(); c.arc(x + r * .35, y - r * .15, r * .18, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
  c.fillStyle = '#3a2a00'; c.beginPath(); c.arc(x, y + r * .15, r * .45, 0, Math.PI); c.fill();
  c.fillStyle = '#60A5FA'; c.beginPath(); c.ellipse(x - r * .75, y + r * .05, r * .12, r * .2, 0, 0, 7); c.ellipse(x + r * .75, y + r * .05, r * .12, r * .2, 0, 0, 7); c.fill();
}

function drawAll() {
// ===== A: flat ilustrasi cerah =====
(function () {
  const c = document.getElementById('a').getContext('2d'), W = 1080, H = 1920;
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#FFF4DA'); g.addColorStop(1, '#FFE0A8'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = '#FFD27A'; c.beginPath(); c.arc(W / 2, 1050, 470, 0, 7); c.fill();
  for (let i = 0; i < 14; i++) { c.save(); c.translate(W / 2, 1050); c.rotate(i / 14 * 6.28); c.fillStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.moveTo(0, 0); c.lineTo(-60, -900); c.lineTo(60, -900); c.fill(); c.restore(); }
  c.fillStyle = '#1E1B4B'; c.beginPath(); c.roundRect(W / 2 - 150, 300, 300, 92, 46); c.fill(); txt(c, 'TAHUN 2007', W / 2, 348, 44, 900, '#FFD54A');
  txt(c, 'HP INI SEMPAT', W / 2, 480, 92, 900, '#1E1B4B');
  c.save(); c.translate(W / 2, 600); c.rotate(-.04); c.fillStyle = '#FF5A5F'; c.beginPath(); c.roundRect(-370, -72, 740, 144, 30); c.fill(); txt(c, 'DIKETAWAIN', 0, 4, 104, 900, '#fff'); c.restore();
  touchPhone(c, W / 2, 1080, .95, -.06, '#1E1B4B');
  bubble(c, 'HAHAHA!', 250, 840, '#1E1B4B', '#FFD54A', 52, 1);
  bubble(c, 'Enggak ada tombolnya?!', 760, 1420, '#fff', '#1E1B4B', 42, -1);
  laughFace(c, 180, 1240, 80, '#FFD54A'); laughFace(c, 900, 900, 66, '#FFD54A');
  c.fillStyle = 'rgba(30,27,75,.85)'; c.beginPath(); c.roundRect(110, 1580, 860, 96, 26); c.fill();
  txt(c, 'sekarang semua HP malah ikut', W / 2, 1630, 42, 800, '#fff');
})();

// ===== B: gelap modern berwarna =====
(function () {
  const c = document.getElementById('b').getContext('2d'), W = 1080, H = 1920;
  const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#0B1026'); g.addColorStop(1, '#1A0B2E'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  [[200, 500, '#5B8CFF'], [900, 1300, '#FF6BD6'], [500, 1700, '#FFB547']].forEach(([x, y, col]) => { const rg = c.createRadialGradient(x, y, 0, x, y, 520); rg.addColorStop(0, col + '55'); rg.addColorStop(1, col + '00'); c.fillStyle = rg; c.fillRect(0, 0, W, H); });
  c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 2; for (let x = 0; x < W; x += 90) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); } for (let y = 0; y < H; y += 90) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  txt(c, 'TAHUN 2007', W / 2, 340, 40, 800, '#9FB4FF');
  txt(c, 'HP ini sempat', W / 2, 460, 84, 800, '#fff');
  const tg = c.createLinearGradient(200, 0, 880, 0); tg.addColorStop(0, '#FFB547'); tg.addColorStop(1, '#FF6BD6');
  c.font = `900 130px ${FONT}`; c.fillStyle = tg; c.textAlign = 'center'; c.fillText('DIKETAWAIN', W / 2, 600);
  keypadPhone(c, 260, 1110, .62, '#2A2F4A', '#7DD3FC', '#3B4266');
  touchPhone(c, 640, 1080, .95, .05, '#0F0F14', 'rgba(168,107,255,.8)');
  c.fillStyle = 'rgba(255,255,255,.1)'; c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 2;
  [['“Enggak ada tombolnya?”', 300, 820], ['“Kemahalan!”', 820, 1460]].forEach(([s, x, y]) => { c.fillStyle = 'rgba(255,255,255,.1)'; c.font = `700 40px ${FONT}`; const w = c.measureText(s).width + 60; c.beginPath(); c.roundRect(x - w / 2, y - 45, w, 90, 45); c.fill(); c.stroke(); txt(c, s, x, y + 2, 40, 700, '#fff'); });
  c.fillStyle = 'rgba(0,0,0,.5)'; c.beginPath(); c.roundRect(110, 1580, 860, 96, 26); c.fill();
  c.font = `800 42px ${FONT}`; c.textAlign = 'center'; c.fillStyle = '#fff'; c.fillText('sekarang semua HP malah ikut', W / 2, 1640);
})();
}
window.ready = document.fonts.load(`900 40px Inter`).then(() => document.fonts.load(`700 40px Inter`)).then(() => { drawAll(); return true; });
</script>
</body>
</html>
