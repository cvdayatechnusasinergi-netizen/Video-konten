<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cinematic Test</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:360px;height:640px}body.render canvas{width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Uji gaya sinematik (6 dtk): cahaya volumetrik, HP berputar pelan (pseudo-3D), pantulan lantai,
// kilau cahaya menyapu layar, debu bokeh (depth of field), tipografi tipis bersih, grain film.
const params = new URLSearchParams(location.search);
const W = 1080, H = 1920, FPS = 30, DURATION = 6;
const ctx = document.getElementById('c').getContext('2d');
const SANS = 'Inter, sans-serif';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), prog = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, eo = x => 1 - Math.pow(1 - x, 3);
function rng(s) { return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; }

// --- HP dirender sekali ke kanvas terpisah (muka depan) ---
const PW = 340, PH = 700;
const front = document.createElement('canvas'); front.width = PW; front.height = PH;
function drawFront() {
  const c = front.getContext('2d'); c.translate(PW / 2, PH / 2);
  const edge = c.createLinearGradient(-170, 0, 170, 0); edge.addColorStop(0, '#3a3c40'); edge.addColorStop(.06, '#b9bcc2'); edge.addColorStop(.5, '#6f7278'); edge.addColorStop(.94, '#c9ccd1'); edge.addColorStop(1, '#36383c');
  c.fillStyle = edge; c.beginPath(); c.roundRect(-170, -350, 340, 700, 62); c.fill();
  c.fillStyle = '#030303'; c.beginPath(); c.roundRect(-160, -340, 320, 680, 54); c.fill();
  const sc = c.createLinearGradient(0, -320, 0, 320); sc.addColorStop(0, '#050a18'); sc.addColorStop(.6, '#0b1f4a'); sc.addColorStop(1, '#03060f');
  c.fillStyle = sc; c.beginPath(); c.roundRect(-148, -328, 296, 656, 46); c.fill();
  const orb = c.createRadialGradient(30, 90, 0, 30, 90, 300); orb.addColorStop(0, 'rgba(80,140,255,.45)'); orb.addColorStop(1, 'rgba(80,140,255,0)'); c.fillStyle = orb; c.fillRect(-148, -328, 296, 656);
  c.font = `200 92px ${SANS}`; c.fillStyle = 'rgba(255,255,255,.92)'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('9:41', 0, -200);
  c.font = `500 20px ${SANS}`; c.fillStyle = 'rgba(255,255,255,.55)'; c.fillText('Selasa, 9 Januari', 0, -138);
}

// --- debu bokeh ---
const dust = (() => { const r = rng(9); return Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, z: r(), ph: r() * 6, v: 4 + r() * 10 })); })();
const grain = []; (function () { const r = rng(5); for (let k = 0; k < 6; k++) { const g = document.createElement('canvas'); g.width = 360; g.height = 640; const gx = g.getContext('2d'), id = gx.createImageData(360, 640); for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 18; } gx.putImageData(id, 0, 0); grain.push(g); } })();

function phone3D(cx, cy, s, ang, sweep) {
  // ang: rotasi sumbu Y (rad). Muka depan diskalakan cos(ang), sisi samping tampak sebagai pita logam.
  const k = Math.cos(ang), side = Math.sin(ang) * 46;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  // bayangan lantai
  const sh = ctx.createRadialGradient(0, PH / 2 + 30, 0, 0, PH / 2 + 30, 260); sh.addColorStop(0, 'rgba(0,0,0,.9)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh; ctx.beginPath(); ctx.ellipse(0, PH / 2 + 30, 250, 40, 0, 0, 7); ctx.fill();
  // sisi samping (pita logam)
  if (Math.abs(side) > 1) {
    const sx = side > 0 ? PW / 2 * k : -PW / 2 * k;
    const g = ctx.createLinearGradient(sx, 0, sx + side, 0); g.addColorStop(0, '#8b8e94'); g.addColorStop(.5, '#d9dce1'); g.addColorStop(1, '#4a4c50');
    const bx = side > 0 ? sx - 40 : sx + side; ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(bx, -PH / 2 + 4, Math.abs(side) + 40, PH - 8, [0, 60, 60, 0].map(r => side > 0 ? r : 60 - r)); ctx.fill();
  }
  // muka depan
  ctx.save(); ctx.scale(k, 1); ctx.drawImage(front, -PW / 2, -PH / 2);
  // kilau kaca yang menyapu
  ctx.save(); ctx.beginPath(); ctx.roundRect(-PW / 2 + 10, -PH / 2 + 10, PW - 20, PH - 20, 54); ctx.clip();
  const x = lerp(-PW, PW, sweep); const gl = ctx.createLinearGradient(x - 120, -PH / 2, x + 120, PH / 2);
  gl.addColorStop(0, 'rgba(255,255,255,0)'); gl.addColorStop(.5, 'rgba(255,255,255,.22)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(-PW / 2, -PH / 2, PW, PH); ctx.restore();
  ctx.restore();
  // pantulan lantai
  ctx.save(); ctx.translate(0, PH + 40); ctx.scale(k, -1); ctx.globalAlpha = .18; ctx.drawImage(front, -PW / 2, -PH / 2); ctx.restore();
  const fade = ctx.createLinearGradient(0, PH / 2 + 30, 0, PH / 2 + 420); fade.addColorStop(0, 'rgba(0,0,0,.2)'); fade.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = fade; ctx.fillRect(-PW, PH / 2 + 30, PW * 2, 420);
  ctx.restore();
}

function renderFrame(t) {
  const frame = Math.round(t * FPS);
  ctx.save();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const push = lerp(1, 1.07, eio(t / DURATION));
  ctx.translate(W / 2, H * .55); ctx.scale(push, push); ctx.translate(-W / 2, -H * .55);
  // cahaya volumetrik dari atas
  const beamA = .55 + .08 * Math.sin(t * 1.3);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const bg = ctx.createLinearGradient(0, 0, 0, 1500); bg.addColorStop(0, `rgba(120,160,255,${.20 * beamA})`); bg.addColorStop(1, 'rgba(120,160,255,0)');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(W / 2 - 70, -50); ctx.lineTo(W / 2 + 70, -50); ctx.lineTo(W / 2 + 520, 1500); ctx.lineTo(W / 2 - 520, 1500); ctx.closePath(); ctx.fill();
  const pool = ctx.createRadialGradient(W / 2, 1420, 0, W / 2, 1420, 600); pool.addColorStop(0, 'rgba(70,110,220,.25)'); pool.addColorStop(1, 'rgba(70,110,220,0)'); ctx.fillStyle = pool; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  // debu jauh (blur)
  dust.forEach(d => { if (d.z > .5) return; const y = ((d.y - t * d.v) % H + H) % H, x = d.x + Math.sin(t * .4 + d.ph) * 20;
    const inBeam = Math.abs(x - W / 2) < 60 + y * .3 ? 1 : .25; ctx.fillStyle = `rgba(200,215,255,${.25 * inBeam})`; ctx.beginPath(); ctx.arc(x, y, 1.5 + d.z * 2, 0, 7); ctx.fill(); });
  // HP berputar pelan
  const ang = lerp(.62, -.08, eio(prog(t, 0, 5.2)));
  const rise = eo(prog(t, 0, 1.6));
  ctx.globalAlpha = rise; phone3D(W / 2, 1080 + (1 - rise) * 60, 1.0, ang, prog(t, 2.2, 3.6)); ctx.globalAlpha = 1;
  // anamorphic flare saat kilau lewat
  const fl = Math.sin(Math.PI * prog(t, 2.6, 3.4));
  if (fl > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const fg = ctx.createLinearGradient(0, 0, W, 0); fg.addColorStop(0, 'rgba(60,120,255,0)'); fg.addColorStop(.5, `rgba(110,170,255,${.55 * fl})`); fg.addColorStop(1, 'rgba(60,120,255,0)');
    ctx.fillStyle = fg; ctx.fillRect(0, 760, W, 5); ctx.restore(); }
  // debu dekat (bokeh besar, buram)
  dust.forEach(d => { if (d.z <= .85) return; const y = ((d.y - t * d.v * 2) % H + H) % H, x = d.x + Math.sin(t * .3 + d.ph) * 40;
    const r = 14 + (d.z - .85) * 160; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(180,200,255,.10)'); g.addColorStop(1, 'rgba(180,200,255,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); });
  ctx.restore();
  // tipografi (tidak ikut zoom)
  const ta = (a, b) => eo(prog(t, a, b));
  const txt = (s, y, size, w, a, ls, col = '#fff') => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.filter = a < 1 ? `blur(${((1 - a) * 8).toFixed(1)}px)` : 'none';
    ctx.font = `${w} ${size}px ${SANS}`; ctx.letterSpacing = ls + 'px'; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, W / 2 + ls / 2, y + (1 - a) * 14); ctx.restore(); };
  txt('2 0 0 7', 330, 28, 400, ta(.3, 1.3), 6, 'rgba(255,255,255,.55)');
  txt('HP ini sempat', 450, 88, 300, ta(.8, 1.9), -1);
  txt('diketawain.', 555, 88, 700, ta(1.4, 2.5), -1);
  txt('“Enggak ada keyboard-nya.”', 1560, 34, 300, ta(3.4, 4.4) * (1 - ta(5.2, 5.9)), 1, 'rgba(255,255,255,.7)');
  // letterbox tipis + vignette + grain
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .7; ctx.drawImage(grain[frame % 6], 0, 0, W, H); ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 60); ctx.fillRect(0, H - 60, W, 60);
}
window.renderFrame = renderFrame; window.FPS = FPS; window.DURATION = DURATION;
window.ready = Promise.all([document.fonts.load(`300 40px Inter`), document.fonts.load(`700 40px Inter`), document.fonts.load(`200 40px Inter`)]).then(() => { drawFront(); return true; });
if (!params.has('render')) { const t0 = performance.now(); window.ready.then(() => (function loop() { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })()); }
else document.body.classList.add('render');
</script>
</body>
</html>
