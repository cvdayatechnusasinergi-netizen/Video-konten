<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jangan Buka APK</title>
<style>
  html,body{margin:0;background:#000;}
  canvas{display:block;width:360px;height:640px;}
  body.render canvas{width:1080px;height:1920px;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Reyo Bian #1 — Jangan Buka File "Undangan.apk"! (Facebook Reels)
// Gaya: latar hitam, grid titik, grain, aksen KUNING/EMAS (warna sampul profil Reyo Bian).
// ============ CONFIG ============
const params = new URLSearchParams(location.search);
const CONFIG = {
  name: params.get('brand') || 'Reyo Bian',
  sub: 'Freelance IT Support · Pangkalan Bun',
};
// ================================

const W = 1080, H = 1920, FPS = 30, DURATION = 57.5;
const GOLD = '#F5B301', GOLD_GLOW = 'rgba(245,179,1,.65)';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'Inter, "Inter Display", "DejaVu Sans", sans-serif';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rupiah = v => 'Rp' + Math.max(0, Math.round(v)).toLocaleString('id-ID');
function font(size, weight = 700) { ctx.font = `${weight} ${size}px ${FONT}`; }
function life(t, a, b, fi = .35, fo = .35) { return Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b)); }

function words(text, x, y, size, t, start, opts = {}) {
  const { weight = 700, color = '#fff', stagger = .09, dur = .55, end = 1e9, fo = .35, spacing = 0, align = 'center', rise = 46, glow = null } = opts;
  font(size, weight);
  ctx.letterSpacing = spacing + 'px';
  const ws = text.split(' ');
  const sp = ctx.measureText(' ').width;
  const widths = ws.map(w => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'left' ? x : x - total;
  const outA = 1 - prog(t, end - fo, end);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ws.forEach((w, i) => {
    const p = start <= -1 ? 1 : prog(t, start + i * stagger, start + i * stagger + dur);
    if (p > 0 && outA > 0) {
      const e = eo(p);
      ctx.save();
      ctx.globalAlpha *= e * outA;
      ctx.fillStyle = color;
      if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 30; }
      const blur = (1 - e) * 14 + (1 - outA) * 10;
      if (blur > .3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
      ctx.fillText(w, cx, y + (1 - e) * rise - (1 - outA) * 30);
      ctx.restore();
    }
    cx += widths[i] + sp;
  });
  ctx.letterSpacing = '0px';
}

function label(text, y, t, start, end = 1e9, color = GOLD) {
  const a = start <= -1 ? 1 - prog(t, end - .4, end) : life(t, start, end, .5, .4);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  font(30, 700); ctx.letterSpacing = '12px';
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2 + 6, y);
  const tw = ctx.measureText(text).width;
  const lp = start <= -1 ? 1 : eo(prog(t, start, start + .8));
  ctx.strokeStyle = 'rgba(245,179,1,.55)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - tw / 2 - 30, y); ctx.lineTo(W / 2 - tw / 2 - 30 - 80 * lp, y);
  ctx.moveTo(W / 2 + tw / 2 + 30, y); ctx.lineTo(W / 2 + tw / 2 + 30 + 80 * lp, y);
  ctx.stroke(); ctx.restore(); ctx.letterSpacing = '0px';
}

function pill(text, x, y, size, bg, fg, p, glow = GOLD_GLOW, padX = .45) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = back(p); ctx.scale(s, s);
  font(size, 900);
  const tw = ctx.measureText(text).width, ph = size * 1.25, pw = tw + size * padX * 2;
  ctx.fillStyle = bg; if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 45; }
  ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, 22); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, size * .03);
  ctx.restore();
}

// warning triangle
function warn(x, y, s, a = 1, filled = true) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, -46); ctx.lineTo(50, 40); ctx.lineTo(-50, 40); ctx.closePath();
  ctx.lineJoin = 'round';
  if (filled) { ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#000'; }
  else { ctx.strokeStyle = GOLD; ctx.lineWidth = 6; ctx.stroke(); ctx.fillStyle = GOLD; }
  ctx.fillRect(-5, -18, 10, 34); ctx.beginPath(); ctx.arc(0, 28, 6, 0, 7); ctx.fill();
  ctx.restore();
}

// file attachment card (chat-style)
function fileCard(x, y, w, name, a = 1, hlApk = 0, size = '4,2 MB') {
  if (a <= 0) return;
  const h = 150;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 26); ctx.fill(); ctx.stroke();
  // file icon
  const ix = x + 30, iy = y + 25;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ix + 60, iy); ctx.lineTo(ix + 80, iy + 20); ctx.lineTo(ix + 80, iy + 100); ctx.lineTo(ix, iy + 100); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#000'; font(22, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('APK', ix + 40, iy + 62);
  // name
  const base = name.replace(/\.apk$/, '');
  font(40, 700); ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText(base, x + 135, y + 58);
  const bw = ctx.measureText(base).width;
  ctx.fillStyle = hlApk > 0 ? GOLD : '#fff';
  if (hlApk > 0) { ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 25 * hlApk; }
  ctx.save(); ctx.translate(x + 135 + bw, y + 58); const s = 1 + .25 * Math.sin(Math.PI * clamp(hlApk * 1.6)); ctx.scale(s, s); ctx.fillText('.apk', 0, 0); ctx.restore();
  ctx.shadowBlur = 0;
  font(28, 500); ctx.fillStyle = '#8a8a8a'; ctx.fillText(size + ' · Aplikasi', x + 135, y + 106);
  ctx.restore();
}

function check(x, y, r, p, filled = true) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = back(clamp(p * 1.5)); ctx.scale(s, s);
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 25; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#000'; ctx.lineWidth = r * .2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const cp = clamp(p * 1.5 - .3);
  ctx.beginPath(); ctx.moveTo(-r * .42, 0);
  const pts = [[-r * .42, 0], [-r * .1, r * .32], [r * .45, -r * .3]];
  if (cp < .4) ctx.lineTo(lerp(pts[0][0], pts[1][0], cp / .4), lerp(pts[0][1], pts[1][1], cp / .4));
  else { ctx.lineTo(pts[1][0], pts[1][1]); const q = (cp - .4) / .6; ctx.lineTo(lerp(pts[1][0], pts[2][0], q), lerp(pts[1][1], pts[2][1], q)); }
  ctx.stroke(); ctx.restore();
}

function numBadge(x, y, n, p) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = back(p); ctx.scale(s, s);
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 25; ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  font(44, 900); ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(n), 0, 2);
  ctx.restore();
}

// ---------- background ----------
const grain = [];
(function makeGrain() {
  const r = rng(7);
  for (let k = 0; k < 6; k++) {
    const g = document.createElement('canvas'); g.width = 270; g.height = 480;
    const gx = g.getContext('2d'); const id = gx.createImageData(270, 480);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
    gx.putImageData(id, 0, 0); grain.push(g);
  }
})();
const dust = (() => { const r = rng(42); return Array.from({ length: 60 }, () => ({ x: r() * W, y: r() * H, s: .5 + r() * 2, v: 8 + r() * 30, a: .1 + r() * .3, ph: r() * 6, g: r() < .3 })); })();

function background(t) {
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, H * .7);
  g.addColorStop(0, 'rgba(245,179,1,.06)'); g.addColorStop(1, 'rgba(245,179,1,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const step = 60, off = (t * 6) % step;
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let y = -step; y < H + step; y += step) for (let x = 30; x < W; x += step) { ctx.beginPath(); ctx.arc(x, y + off, 1.6, 0, Math.PI * 2); ctx.fill(); }
  dust.forEach(d => {
    const y = ((d.y - t * d.v) % H + H) % H;
    const a = d.a * (.6 + .4 * Math.sin(t * 2 + d.ph));
    ctx.fillStyle = d.g ? `rgba(245,179,1,${a})` : `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(d.x + Math.sin(t * .5 + d.ph) * 20, y, d.s, 0, Math.PI * 2); ctx.fill();
  });
}
function overlay(t, frame) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .9; ctx.drawImage(grain[frame % grain.length], 0, 0, W, H); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, 0, W, 4);
  ctx.fillStyle = GOLD; ctx.fillRect(0, 0, W * (t / DURATION), 4);
}
function scene(t, a, b, fn, fi = .3, fo = .5) {
  if (t < a || t > b) return;
  const inp = fi <= 0 ? 1 : prog(t, a, a + fi), outp = prog(t, b - fo, b);
  ctx.save();
  ctx.globalAlpha = Math.min(eo(inp), 1 - outp);
  const s = 1 + eio(outp) * .08;
  ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
  if (outp > 0) ctx.filter = `blur(${(outp * 10).toFixed(1)}px)`;
  fn(t - a, t);
  ctx.restore();
}

// ---------- S1: hook (0 - 5.3) — frame 0 sudah berisi judul ----------
function s1(lt) {
  label('AWAS PENIPUAN', 420, lt, -1);
  // title, fully visible on frame 0
  font(132, 900); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('JANGAN BUKA', W / 2, 560);
  const pulse = 1 + .04 * Math.sin(lt * 6);
  ctx.save(); ctx.translate(W / 2, 715); ctx.scale(pulse, pulse);
  font(132, 900); const tw = ctx.measureText('FILE INI!').width;
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 50;
  ctx.beginPath(); ctx.roundRect(-tw / 2 - 40, -80, tw + 80, 160, 26); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillText('FILE INI!', 0, 4); ctx.restore();

  // chat bubble with the file
  const by = 880;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(110, by, 860, 330, 36); ctx.fill(); ctx.stroke();
  font(28, 600); ctx.fillStyle = '#8a8a8a'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('+62 812-xxxx-xxxx  ·  nomor tidak dikenal', 150, by + 48);
  ctx.restore();
  fileCard(140, by + 85, 800, 'Undangan Pernikahan.apk', 1, prog(lt, 1.2, 2.0));
  font(30, 500); ctx.fillStyle = '#cfcfcf'; ctx.textAlign = 'left'; ctx.fillText('Dateng ya kak, dibuka undangannya 🙏'.replace(' 🙏', ''), 150, by + 290);
  warn(905, by + 30, .8, .9 + .1 * Math.sin(lt * 8));

  // stamp "JANGAN DIBUKA" at ~2.6
  const sp = prog(lt, 2.5, 2.85);
  if (sp > 0) {
    ctx.save(); ctx.translate(W / 2, by + 165); ctx.rotate(-.12); const s = lerp(1.8, 1, eo(sp)); ctx.scale(s, s); ctx.globalAlpha *= eo(sp);
    ctx.strokeStyle = GOLD; ctx.lineWidth = 10; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.roundRect(-330, -70, 660, 140, 20); ctx.fillStyle = 'rgba(0,0,0,.82)'; ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    font(76, 900); ctx.letterSpacing = '4px'; ctx.fillStyle = GOLD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('JANGAN DIBUKA', 2, 4);
    ctx.restore(); ctx.letterSpacing = '0px';
  }
  words('Serius.', W / 2, 1340, 64, lt, 3.85, { weight: 800, color: '#fff' });
  words('Penipuan lewat WhatsApp', W / 2, 1430, 38, lt, 4.05, { weight: 500, color: '#9a9a9a', stagger: .05 });
}

// ---------- S2: disguises (5.3 - 15.8) ----------
function s2(lt) {
  words('Penipu sekarang', W / 2, 400, 52, lt, .2, { weight: 500, color: '#bdbdbd' });
  words('nyamar jadi…', W / 2, 475, 72, lt, .55, { weight: 800 });
  const files = [
    ['Undangan Nikah.apk', 1.5, '3,8 MB'],
    ['Resi Paket J&T.apk', 2.6, '5,1 MB'],
    ['Surat Tilang.apk', 3.6, '4,6 MB'],
    ['Tagihan Listrik.apk', 4.6, '4,0 MB'],
  ];
  const hl = prog(lt, 8.3, 8.9);
  files.forEach(([n, st, sz], i) => {
    const p = eo(prog(lt, st, st + .5));
    if (p <= 0) return;
    const y = 580 + i * 175 + (1 - p) * 80;
    const dim = lt > 6.5 && lt < 8.3 ? .55 : 1;
    fileCard(110, y, 860, n, p * dim, hl, sz);
  });
  words('Namanya beda-beda,', W / 2, 1335, 50, lt, 6.6, { weight: 500, color: '#bdbdbd' });
  words('ujungnya sama:', W / 2, 1405, 50, lt, 7.5, { weight: 500, color: '#bdbdbd' });
  pill('FILE .APK', W / 2, 1520, 84, GOLD, '#000', prog(lt, 8.5, 9.0));
}

// ---------- S3: what happens (15.8 - 25.0) ----------
function phone(cx, top, w, h, a) {
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = '#0c0c0c'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.roundRect(cx - w / 2, top, w, h, 56); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(cx - 50, top + 22, 100, 22, 11); ctx.fill();
  ctx.restore();
}
function s3(lt) {
  words('Begitu diinstal…', W / 2, 400, 66, lt, .2, { weight: 800, end: 4.3 });
  words('Kode OTP kamu dicuri', W / 2, 400, 66, lt, 4.35, { weight: 800, end: 6.7 });
  words('Saldo m-banking habis', W / 2, 400, 66, lt, 6.75, { weight: 800 });

  const cx = W / 2, top = 500, pw = 470, ph = 820;
  const pa = eo(prog(lt, 0, .5));
  phone(cx, top, pw, ph, pa);
  const L = cx - pw / 2 + 40, R = cx + pw / 2 - 40, mid = top + ph / 2;
  ctx.save(); ctx.globalAlpha *= pa; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (lt < 2.0) {
    // installing
    font(34, 600); ctx.fillStyle = '#bdbdbd'; ctx.fillText('Menginstal…', cx, mid - 90);
    font(38, 800); ctx.fillStyle = '#fff'; ctx.fillText('Undangan.apk', cx, mid - 30);
    const ip = eio(prog(lt, .3, 1.8));
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.roundRect(L, mid + 40, R - L, 18, 9); ctx.fill();
    ctx.fillStyle = GOLD; ctx.beginPath(); ctx.roundRect(L, mid + 40, (R - L) * ip, 18, 9); ctx.fill();
    font(30, 700); ctx.fillStyle = '#8a8a8a'; ctx.fillText(Math.round(ip * 100) + '%', cx, mid + 100);
  } else if (lt < 4.3) {
    // permission dialog
    const dp = eo(prog(lt, 2.0, 2.3));
    ctx.globalAlpha *= dp;
    ctx.fillStyle = '#1b1b1b'; ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(L - 10, mid - 200, R - L + 20, 400, 30); ctx.fill(); ctx.stroke();
    warn(cx, mid - 130, .55, 1, false);
    font(36, 800); ctx.fillStyle = '#fff'; ctx.fillText('Izinkan aplikasi', cx, mid - 40); ctx.fillText('membaca SMS?', cx, mid + 6);
    const pressed = lt > 3.2;
    font(30, 800);
    ctx.fillStyle = '#8a8a8a'; ctx.fillText('TOLAK', cx - 95, mid + 120);
    const bs = 1 - .08 * Math.sin(Math.PI * prog(lt, 3.1, 3.4));
    ctx.save(); ctx.translate(cx + 95, mid + 120); ctx.scale(bs, bs);
    ctx.fillStyle = pressed ? GOLD : 'rgba(245,179,1,.2)'; ctx.beginPath(); ctx.roundRect(-90, -36, 180, 72, 36); ctx.fill();
    ctx.fillStyle = pressed ? '#000' : GOLD; ctx.fillText('IZINKAN', 0, 2); ctx.restore();
    // finger tap
    const fp = prog(lt, 2.6, 3.2);
    if (fp > 0 && lt < 3.9) { ctx.save(); ctx.globalAlpha *= .9 * (1 - prog(lt, 3.5, 3.9)); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(lerp(cx + 260, cx + 105, eo(fp)), lerp(mid + 330, mid + 130, eo(fp)), 26, 0, 7); ctx.fill(); ctx.restore(); }
    const rp = prog(lt, 3.2, 3.8);
    if (rp > 0 && rp < 1) { ctx.save(); ctx.globalAlpha *= 1 - rp; ctx.strokeStyle = GOLD; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx + 95, mid + 120, 30 + rp * 110, 0, 7); ctx.stroke(); ctx.restore(); }
  } else if (lt < 6.7) {
    // SMS OTP notification + stolen
    const np = eo(prog(lt, 4.3, 4.7));
    const ny = top + 120 - (1 - np) * 60;
    ctx.globalAlpha *= np;
    ctx.fillStyle = '#1b1b1b'; ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(L - 10, ny, R - L + 20, 210, 26); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'left';
    font(26, 700); ctx.fillStyle = '#8a8a8a'; ctx.fillText('SMS · BANK', L + 15, ny + 40);
    font(32, 600); ctx.fillStyle = '#fff'; ctx.fillText('Kode OTP kamu:', L + 15, ny + 90);
    font(54, 900); ctx.fillStyle = GOLD; ctx.fillText('482 913', L + 15, ny + 155);
    ctx.textAlign = 'center';
    // digits fly out to "penipu"
    const fp = prog(lt, 5.0, 6.2);
    const tx = cx, ty = mid + 230;
    ctx.save(); ctx.globalAlpha = 1;
    // penipu icon (hooded figure)
    const ha = eo(prog(lt, 4.8, 5.2));
    ctx.globalAlpha *= ha;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(tx, ty - 30, 46, Math.PI, 0); ctx.lineTo(tx + 70, ty + 70); ctx.lineTo(tx - 70, ty + 70); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(tx, ty - 20, 28, 34, 0, 0, 7); ctx.fill();
    ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(tx - 10, ty - 22, 5, 0, 7); ctx.arc(tx + 10, ty - 22, 5, 0, 7); ctx.fill();
    font(26, 800); ctx.letterSpacing = '6px'; ctx.fillStyle = GOLD; ctx.fillText('PENIPU', tx + 3, ty + 110); ctx.letterSpacing = '0px';
    ctx.restore();
    if (fp > 0 && fp < 1) {
      for (let k = 0; k < 6; k++) {
        const q = clamp(fp * 1.6 - k * .12); if (q <= 0 || q >= 1) continue;
        const sx = L + 30 + k * 34, sy = ny + 155;
        const x = lerp(sx, tx, eio(q)), y = lerp(sy, ty - 20, eio(q)) - Math.sin(Math.PI * q) * 80;
        ctx.save(); ctx.globalAlpha *= 1 - q * .6; font(44, 900); ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 20;
        ctx.fillText('482913'[k], x, y); ctx.restore();
      }
    }
  } else {
    // balance draining
    const bp = eo(prog(lt, 6.7, 7.0));
    ctx.globalAlpha *= bp;
    font(30, 700); ctx.letterSpacing = '6px'; ctx.fillStyle = '#8a8a8a'; ctx.fillText('SALDO', cx + 3, mid - 120); ctx.letterSpacing = '0px';
    const dv = eio(prog(lt, 7.1, 8.6));
    const v = 12450000 * (1 - dv);
    font(v < 1 ? 92 : 70, 900); ctx.fillStyle = v < 1 ? GOLD : '#fff';
    if (v < 1) { ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 40; }
    ctx.fillText(rupiah(v), cx, mid - 40); ctx.shadowBlur = 0;
    // transaction lines
    const tr = [['Transfer keluar', '-Rp4.000.000'], ['Transfer keluar', '-Rp5.000.000'], ['Transfer keluar', '-Rp3.450.000']];
    tr.forEach(([a, b], i) => {
      const q = eo(prog(lt, 7.2 + i * .45, 7.5 + i * .45)); if (q <= 0) return;
      ctx.save(); ctx.globalAlpha *= q; ctx.textAlign = 'left'; font(26, 600); ctx.fillStyle = '#9a9a9a'; ctx.fillText(a, L, mid + 70 + i * 62);
      ctx.textAlign = 'right'; font(26, 800); ctx.fillStyle = '#fff'; ctx.fillText(b, R, mid + 70 + i * 62); ctx.restore();
    });
  }
  ctx.restore();
  words('Dalam hitungan menit.', W / 2, 1440, 50, lt, 7.6, { weight: 600, color: '#bdbdbd' });
}

// ---------- S4: how to recognise (25.0 - 34.9) ----------
function s4(lt) {
  label('CARA NGENALINNYA', 420, lt, .2);
  words('Gampang kok.', W / 2, 510, 70, lt, .9, { weight: 800 });
  const rows = [
    [2.3, 'Nama file berakhiran', '.apk'],
    [4.8, 'Dikirim dari nomor', 'nggak dikenal'],
    [7.1, 'Nyuruh kamu', 'buru-buru buka'],
  ];
  rows.forEach(([st, a, b], i) => {
    const p = prog(lt, st, st + .45); if (p <= 0) return;
    const y = 700 + i * 250;
    ctx.save(); ctx.globalAlpha *= eo(p);
    ctx.translate((1 - eo(p)) * 60, 0);
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.strokeStyle = 'rgba(245,179,1,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(110, y - 95, 860, 190, 30); ctx.fill(); ctx.stroke();
    ctx.restore();
    numBadge(195, y, i + 1, p);
    ctx.save(); ctx.globalAlpha *= eo(p); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    font(40, 500); ctx.fillStyle = '#bdbdbd'; ctx.fillText(a, 280, y - 34);
    font(58, 900); ctx.fillStyle = i === 0 ? GOLD : '#fff'; ctx.fillText(b, 280, y + 34);
    ctx.restore();
  });
  words('Satu aja cocok? Jangan dibuka.', W / 2, 1480, 42, lt, 8.9, { weight: 700, color: GOLD, stagger: .05 });
}

// ---------- S5: already installed (34.9 - 45.6) ----------
function s5(lt) {
  label('TERLANJUR KEINSTAL?', 420, lt, .1);
  words('Lakuin ini sekarang:', W / 2, 510, 64, lt, .5, { weight: 800 });
  const steps = [
    [1.3, 'Matiin data & WiFi'],
    [3.9, 'Hapus aplikasinya'],
    [5.8, 'Telepon bank, blokir m-banking'],
    [8.1, 'Ganti semua password'],
  ];
  steps.forEach(([st, txt], i) => {
    const p = prog(lt, st, st + .45); if (p <= 0) return;
    const y = 680 + i * 190;
    const active = i === steps.length - 1 ? lt >= st : lt >= st && lt < steps[i + 1][0];
    ctx.save(); ctx.globalAlpha *= eo(p) * (active ? 1 : .6);
    ctx.translate((1 - eo(p)) * 60, 0);
    ctx.fillStyle = active ? 'rgba(245,179,1,.12)' : 'rgba(255,255,255,.05)';
    ctx.strokeStyle = active ? GOLD : 'rgba(255,255,255,.2)'; ctx.lineWidth = active ? 3 : 2;
    ctx.beginPath(); ctx.roundRect(110, y - 70, 860, 140, 28); ctx.fill(); ctx.stroke();
    font(28, 800); ctx.letterSpacing = '4px'; ctx.fillStyle = active ? GOLD : '#7a7a7a'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('0' + (i + 1), 150, y); ctx.letterSpacing = '0px';
    font(i === 2 ? 36 : 46, 800); ctx.fillStyle = "#fff"; ctx.fillText(txt, 220, y + 2);
    ctx.restore();
    check(905, y, 34, prog(lt, st + .5, st + 1.1));
  });
  words('Makin cepat, makin aman.', W / 2, 1480, 42, lt, 9.3, { weight: 600, color: '#bdbdbd', stagger: .05 });
}

// ---------- S6: share to family (45.6 - 51.8) ----------
function s6(lt) {
  words('Kirim video ini ke', W / 2, 430, 58, lt, .2, { weight: 600, color: '#bdbdbd' });
  pill('GRUP KELUARGA', W / 2, 540, 78, GOLD, '#000', prog(lt, .9, 1.4));
  // group chat card
  const gp = eo(prog(lt, 1.3, 1.8));
  if (gp > 0) {
    ctx.save(); ctx.globalAlpha *= gp; ctx.translate(0, (1 - gp) * 60);
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(150, 680, 780, 420, 34); ctx.fill(); ctx.stroke();
    // avatars
    [0, 1, 2].forEach(k => { ctx.fillStyle = k === 1 ? '#bdbdbd' : '#fff'; ctx.beginPath(); ctx.arc(225 + k * 42, 750, 30, 0, 7); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.stroke(); });
    font(36, 800); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('Keluarga Besar', 345, 738);
    font(26, 500); ctx.fillStyle = '#8a8a8a'; ctx.fillText('Mama, Papa, Om, Tante, +24', 345, 778);
    ctx.restore();
    // incoming shared video bubble
    const vp = prog(lt, 2.0, 2.5);
    if (vp > 0) {
      ctx.save(); ctx.globalAlpha *= eo(vp); ctx.translate(0, (1 - eo(vp)) * 40);
      ctx.fillStyle = 'rgba(245,179,1,.15)'; ctx.strokeStyle = GOLD; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(390, 830, 500, 230, 26); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.roundRect(410, 850, 140, 190, 14); ctx.fill();
      ctx.fillStyle = GOLD; ctx.beginPath(); ctx.moveTo(462, 915); ctx.lineTo(462, 975); ctx.lineTo(510, 945); ctx.closePath(); ctx.fill();
      font(30, 800); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText('Jangan buka', 575, 900); ctx.fillText('file .apk!', 575, 940);
      font(24, 600); ctx.fillStyle = '#9a9a9a'; ctx.fillText('Reyo Bian · Reels', 575, 990);
      ctx.restore();
    }
    // read ticks / hearts
    const rp = prog(lt, 2.8, 3.2);
    if (rp > 0) { font(26, 700); ctx.save(); ctx.globalAlpha *= rp; ctx.fillStyle = GOLD; ctx.textAlign = 'right'; ctx.fillText('Dibaca 27 ✓✓', 890, 1080 - 2); ctx.restore(); }
  }
  words('Satu share bisa nyelametin', W / 2, 1250, 52, lt, 2.9, { weight: 600, color: '#fff', stagger: .06 });
  words('tabungan orang tua kamu.', W / 2, 1330, 60, lt, 3.7, { weight: 900, color: GOLD, stagger: .07, glow: GOLD_GLOW });
}

// ---------- S7: CTA / closing (51.8 - 57.5) ----------
function logo(x, y, s, lt, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 45;
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, 105, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = GOLD; ctx.lineWidth = 5; ctx.stroke();
  // network nodes (IT) + pulse
  const nodes = [[0, -42], [-46, 18], [46, 18], [0, 4]];
  const lp = eo(prog(lt, .9, 1.5));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.globalAlpha *= 1;
  [[3, 0], [3, 1], [3, 2], [1, 2]].forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(...nodes[a]); ctx.lineTo(lerp(nodes[a][0], nodes[b][0], lp), lerp(nodes[a][1], nodes[b][1], lp)); ctx.stroke(); });
  nodes.forEach(([nx, ny], i) => { ctx.fillStyle = i === 3 ? GOLD : '#fff'; ctx.beginPath(); ctx.arc(nx, ny, i === 3 ? 13 : 10, 0, 7); ctx.fill(); });
  const pp = (t * .8) % 1;
  ctx.strokeStyle = `rgba(245,179,1,${.6 * (1 - pp)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 4, 13 + pp * 50, 0, 7); ctx.stroke();
  font(24, 900); ctx.letterSpacing = '6px'; ctx.fillStyle = GOLD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('RB', 3, 66); ctx.letterSpacing = '0px';
  ctx.rotate(t * .6); ctx.setLineDash([6, 14]); ctx.strokeStyle = 'rgba(245,179,1,.6)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 130, 0, 7); ctx.stroke();
  ctx.restore();
}
function cta(lt, t) {
  words('JANGAN BUKA', W / 2, 440, 88, lt, .1, { weight: 900, stagger: .1, spacing: 2 });
  pill('FILE .APK', W / 2, 555, 76, GOLD, '#000', prog(lt, .35, .85));
  const ap = prog(lt, .6, 1.2);
  if (ap > 0) {
    logo(W / 2, 790, back(ap), lt, t);
    const bp = back(prog(lt, 1.0, 1.4)), followed = lt > 3.25;
    ctx.save(); ctx.translate(W / 2, 905); ctx.scale(bp, bp);
    ctx.fillStyle = followed ? GOLD : '#000'; ctx.strokeStyle = GOLD; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = followed ? '#000' : GOLD; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
    if (followed) { ctx.moveTo(-11, 1); ctx.lineTo(-3, 9); ctx.lineTo(12, -8); } else { ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.moveTo(0, -11); ctx.lineTo(0, 11); }
    ctx.stroke(); ctx.restore();
  }
  words(CONFIG.name, W / 2, 1010, 66, lt, 1.0, { weight: 800, stagger: .08 });
  words(CONFIG.sub, W / 2, 1075, 32, lt, 1.3, { weight: 500, color: '#9a9a9a', stagger: .04 });

  const btn = (y, start, text, filled, icon, pressT) => {
    const p = prog(lt, start, start + .5); if (p <= 0) return;
    const press = Math.sin(Math.PI * prog(lt, pressT, pressT + .3));
    const done = lt > pressT + .15;
    ctx.save(); ctx.globalAlpha *= eo(p);
    ctx.translate(W / 2, y + (1 - eo(p)) * 50); const s = 1 - press * .06; ctx.scale(s, s);
    const bw = 560, bh = 108;
    ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2);
    const isFilled = filled !== done;
    if (isFilled) { ctx.fillStyle = GOLD; ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0; }
    else { ctx.strokeStyle = GOLD; ctx.lineWidth = 4; ctx.stroke(); }
    const lb = done ? text[1] : text[0];
    font(44, 800); ctx.letterSpacing = '6px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = isFilled ? '#000' : GOLD; ctx.fillText(lb, 34, 2); ctx.letterSpacing = '0px';
    const tw = ctx.measureText(lb).width;
    icon(34 - tw / 2 - 52, 0, isFilled ? '#000' : GOLD, done);
    ctx.restore();
    const rp = prog(lt, pressT, pressT + .7);
    if (rp > 0 && rp < 1) { ctx.save(); ctx.globalAlpha = (1 - rp) * .7; ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W / 2 + 150, y, 20 + rp * 110, 0, 7); ctx.stroke(); ctx.restore(); }
  };
  const iconUser = (x, y, c, done) => {
    ctx.save(); ctx.translate(x, y); ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-6, -9, 9, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-6, 18, 16, Math.PI, 0); ctx.fill();
    ctx.beginPath();
    if (done) { ctx.moveTo(10, -2); ctx.lineTo(15, 4); ctx.lineTo(24, -8); } else { ctx.moveTo(17, -9); ctx.lineTo(17, 7); ctx.moveTo(9, -1); ctx.lineTo(25, -1); }
    ctx.stroke(); ctx.restore();
  };
  const iconShare = (x, y, c) => {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(4, -20); ctx.lineTo(26, 0); ctx.lineTo(4, 20); ctx.lineTo(4, 9);
    ctx.quadraticCurveTo(-14, 7, -24, 20); ctx.quadraticCurveTo(-20, -6, 4, -9); ctx.closePath(); ctx.fill(); ctx.restore();
  };
  btn(1210, 1.6, ['FOLLOW', 'FOLLOWING'], true, iconUser, 3.1);
  btn(1345, 1.9, ['SHARE', 'TERKIRIM'], false, iconShare, 4.2);
  words('Tips IT sehari-hari, bahasa gampang.', W / 2, 1465, 36, lt, 2.4, { weight: 500, color: '#a8a8a8', stagger: .04 });
}

// ---------- master ----------
function renderFrame(t) {
  const frame = Math.round(t * FPS);
  ctx.save(); ctx.globalAlpha = 1; ctx.filter = 'none';
  background(t);
  scene(t, 0, 5.3, s1, 0, .4);
  scene(t, 5.3, 15.8, s2, .3, .5);
  scene(t, 15.8, 25.0, s3, .3, .5);
  scene(t, 25.0, 34.9, s4, .3, .5);
  scene(t, 34.9, 45.6, s5, .3, .5);
  scene(t, 45.6, 51.8, s6, .3, .5);
  scene(t, 51.7, 57.51, cta, .2, .01);
  ctx.restore();
  overlay(t, frame);
}

window.renderFrame = renderFrame;
window.FPS = FPS; window.DURATION = DURATION;
window.ready = document.fonts.load(`800 40px Inter`).then(() => document.fonts.load(`300 40px Inter`)).then(() => document.fonts.ready).then(() => true);

if (!params.has('render')) {
  const t0 = performance.now();
  (function loop() { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else document.body.classList.add('render');
</script>
</body>
