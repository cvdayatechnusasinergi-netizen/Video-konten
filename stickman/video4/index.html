<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Decoy Popcorn</title>
<style>
  html,body{margin:0;background:#222;}
  canvas{display:block;width:360px;height:640px;}
  body.render canvas{width:1080px;height:1920px;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/stick.js"></script>
<script>
// ============ CONFIG ============
const params = new URLSearchParams(location.search);
const CONFIG = {
  channel: params.get('channel') || 'StickWise',
  series: 'Brain vs Wallet',
  ep: 2,
};
// ================================
const FPS = 30, DURATION = 35.6;
// VO starts: 0.15 3.65 9.2 12.0 15.9 20.65 24.1 29.35 33.6

function sceneIn(t, a) { const p = prog(t, a, a + .2); zoomAt(W / 2, H / 2, 1 + (1 - eo(p)) * .06); }

// ---------- local props ----------
function bucket(x, base, h, opts = {}) { // popcorn bucket, (x, base) = bottom center
  const { label = '', dim = 0 } = opts;
  const wb = h * .62, wt = h * .86;
  ctx.save(); ctx.translate(x, base);
  // popcorn top
  ctx.fillStyle = '#fff4d6'; ctx.strokeStyle = C.ink; ctx.lineWidth = 6;
  const R = rng(Math.round(h));
  for (let i = 0; i < 9; i++) { const px = (i / 8 - .5) * wt * .9, py = -h - 10 - R() * h * .12; ctx.beginPath(); ctx.arc(px, py, h * .11, 0, 7); ctx.fill(); ctx.stroke(); }
  // cup
  ctx.beginPath(); ctx.moveTo(-wt / 2, -h); ctx.lineTo(wt / 2, -h); ctx.lineTo(wb / 2, 0); ctx.lineTo(-wb / 2, 0); ctx.closePath();
  ctx.fillStyle = C.white; ctx.fill(); ctx.save(); ctx.clip();
  ctx.fillStyle = C.red; for (let i = -3; i < 4; i += 2) { ctx.beginPath(); ctx.moveTo(i * wt / 7, -h); ctx.lineTo((i + 1) * wt / 7, -h); ctx.lineTo((i + 1) * wb / 7, 0); ctx.lineTo(i * wb / 7, 0); ctx.closePath(); ctx.fill(); }
  ctx.restore(); ctx.lineWidth = 8; ctx.stroke();
  if (label) { font(h * .3, 900); ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = h * .05; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.strokeText(label, 0, -h * .48); ctx.fillText(label, 0, -h * .48); }
  if (dim) { ctx.globalAlpha = dim; ctx.fillStyle = C.paper; ctx.fillRect(-wt / 2 - 20, -h * 1.3, wt + 40, h * 1.35); }
  ctx.restore();
}
const MENU = [[390, 150, 'S', '$3'], [620, 205, 'M', '$6.50'], [870, 260, 'L', '$7']];
const BASE = 1220;
function menu(t, priceAt = [-1, -1, -1], opts = {}) {
  const { dimM = 0, hideM = false, lift = 0 } = opts;
  MENU.forEach(([x, h, l, p], i) => {
    if (i === 1 && hideM) return;
    const yOff = i === 1 ? -lift : 0;
    bucket(x, BASE + yOff, h, { label: l, dim: i === 1 ? dimM : 0 });
    pop(p, x, BASE - h - 110 + yOff, 64, t, priceAt[i], { color: i === 2 ? C.white : C.ink, bg: i === 2 ? 1 : null, rot: (i - 1) * 4 });
  });
}
function card(x, y, w, h, title, price, opts = {}) {
  const { strike = 0, hl = false, ribbon = '' } = opts;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = hl ? '#fff1c7' : C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 7; roughRect(-w / 2, -h / 2, w, h, 16); ctx.fill(); ctx.stroke();
  font(Math.min(40, w * .16), 900); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  title.split('\n').forEach((s, i, a) => ctx.fillText(s, 0, -h * .18 + (i - (a.length - 1) / 2) * 44));
  font(Math.min(60, w * .22), 900); ctx.fillStyle = C.red; ctx.fillText(price, 0, h * .28);
  if (ribbon) { ctx.fillStyle = C.gold; roughRect(-w / 2 + 10, -h / 2 - 26, w - 20, 48, 10); ctx.fill(); ctx.stroke(); font(26, 900); ctx.fillStyle = C.ink; ctx.fillText(ribbon, 0, -h / 2 - 1); }
  if (strike > 0) { ctx.strokeStyle = C.red; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-w / 2 + 10, -h / 2 + 10); ctx.lineTo(lerp(-w / 2 + 10, w / 2 - 10, strike), lerp(-h / 2 + 10, h / 2 - 10, strike)); ctx.stroke(); }
  ctx.restore();
}
function bars(x0, y0, vals, labels, t) { // vals 0..100, animated by caller
  vals.forEach((v, i) => {
    const x = x0 + i * 260, h = v * 4.2;
    ctx.fillStyle = i === 2 ? C.red : C.ink; roughRect(x - 70, y0 - h, 140, Math.max(h, 2), 6); ctx.fill();
    font(56, 900); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(Math.round(v) + '%', x, y0 - h - 44);
    font(30, 800); ctx.fillStyle = C.soft; ctx.fillText(labels[i], x, y0 + 40);
  });
  ctx.fillStyle = C.ink; ctx.fillRect(x0 - 120, y0, 760, 7);
}
function fishHook(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = C.ink; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(0, 30); ctx.arc(-25, 30, 25, 0, Math.PI * .95); ctx.lineTo(-58, 18); ctx.stroke(); ctx.restore(); }

// ---------- S0 hook ----------
function hookLayout(t, still, face = 'smile') {
  const T = still ? 99 : t;
  menu(T, [-1, -1, -1]);
  const m = stick(160, 1440, POSE.point, { s: .85, face, id: 1, look: .7, blink: !still && blinkAt(t) });
  pop('LARGE POPCORN =', 540, 420, 82, T, -1, { color: C.white, bg: 1, bgColor: C.ink, rot: -2 });
  pop('ONLY $0.50 MORE?!', 540, 560, 92, T, -1, { color: C.white, bg: 1, rot: 2 });
}
function s0(t) { ctx.save(); zoomAt(540, 1000, 1 + t * .02); hookLayout(t, false); ctx.restore(); }

// ---------- S1 the menu ----------
function s1(t) {
  sceneIn(t, 3.5);
  menu(t, [4.18, 5.71, 7.0]);
  const pick = t > 7.95;
  stick(160, 1440, pick ? POSE.cheer : POSE.think, { s: .85, face: pick ? 'happy' : 'neutral', id: 1, look: .6 });
  pop('EASY CHOICE ✓', 540, 420, 90, t, 7.95, { color: C.white, bg: 1, bgColor: '#2f9e44', rot: -2 });
  if (pick) { ctx.save(); ctx.strokeStyle = '#2f9e44'; ctx.lineWidth = 12; ctx.beginPath(); ctx.ellipse(870, BASE - 160, 175, 225, 0, 0, 6.283 * prog(t, 7.95, 8.4)); ctx.stroke(); ctx.restore(); }
}

// ---------- S2 spotlight on the medium ----------
function s2(t) {
  sceneIn(t, 9.05);
  menu(t, [-1, -1, -1]);
  const sp = eo(prog(t, 9.3, 9.7));
  ctx.save(); ctx.fillStyle = `rgba(15,15,15,${.78 * sp})`; ctx.beginPath(); ctx.rect(0, 0, W, H);
  ctx.moveTo(620 + lerp(900, 210, sp), BASE - 140); ctx.arc(620, BASE - 140, lerp(900, 210, sp), 0, 6.2832); ctx.fill('evenodd'); ctx.restore();
  pop("HERE'S THE THING", 540, 400, 76, t, 9.25, { color: C.ink, bg: 1, bgColor: C.white, rot: -2 });
  pop("NOT MEANT TO BE BOUGHT", 540, 1460, 62, t, 10.2, { color: C.white, bg: 1, rot: 2 });
}

// ---------- S3 decoy effect ----------
function s3(t) {
  sceneIn(t, 11.85);
  shake(t, Math.max(0, 14 - (t - 12.05) * 40) * (t > 12.05 ? 1 : 0));
  const swing = Math.sin(t * 3) * .12;
  MENU.forEach(([x, h, l, p], i) => {
    if (i === 1) {
      ctx.save(); ctx.translate(620, 640); ctx.rotate(swing);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -500); ctx.lineTo(0, 60); ctx.stroke();
      fishHook(0, 100, 1.4); bucket(0, 470, 230, { label: 'M' });
      ctx.restore();
    } else bucket(x, BASE + 120, h * .85, { label: l });
  });
  const p = prog(t, 12.05, 12.25);
  if (p > 0) {
    const s = lerp(2.2, 1, eo(p));
    ctx.save(); ctx.translate(540, 460); ctx.rotate(-6 * D2R); ctx.scale(s, s); ctx.globalAlpha = p;
    ctx.fillStyle = 'rgba(246,243,236,.92)'; roughRect(-400, -95, 800, 190, 18); ctx.fill();
    ctx.strokeStyle = C.red; ctx.lineWidth = 12; roughRect(-400, -95, 800, 190, 18); ctx.stroke();
    font(110, 900); ctx.fillStyle = C.red; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('DECOY EFFECT', 0, 6);
    ctx.restore();
  }
  if (t > 13.9) { burst(870, BASE - 380, 115 + Math.sin(t * 9) * 5, C.gold, 12, t * .4); pop('STEAL!', 870, BASE - 380, 52, t, 13.9, { rot: -8 }); }
  pop('makes LARGE look cheap', 540, 1520, 56, t, 13.0, { color: C.white, bg: 1, bgColor: C.ink });
}

// ---------- S4 + S5 the experiment ----------
const OPTS = [['WEB\nONLY', '$59'], ['PRINT\nONLY', '$125'], ['WEB +\nPRINT', '$125']];
function experiment(t, removeAt) {
  pop('REAL EXPERIMENT · MAGAZINE SUBSCRIPTION', 540, 360, 38, t, 15.95, { color: C.soft, weight: 800 });
  const gone = removeAt ? eio(prog(t, removeAt, removeAt + .6)) : 0;
  OPTS.forEach(([title, price], i) => {
    const p = back(prog(t, 16.3 + i * .25, 16.65 + i * .25));
    if (p <= 0) return;
    let x = 280 + i * 260, y = 600;
    if (i === 1 && gone > 0) { y += gone * 500; if (gone >= 1) return; }
    ctx.save(); if (i === 1) ctx.globalAlpha *= 1 - gone; ctx.translate(x, y); ctx.scale(p, p); ctx.translate(-x, -y);
    card(x, y, 230, 300, title, price, { hl: i === 2, strike: i === 1 ? prog(t, 17.3, 17.6) : 0 });
    ctx.restore();
  });
  if (t > 17.5 && gone < .3) pop('nobody picks this', 540, 800, 34, t, 17.5, { color: C.red, weight: 800, end: removeAt ? removeAt + .2 : 1e9 });
}
function s4(t) {
  sceneIn(t, 15.75);
  experiment(t, 0);
  const k = eo(prog(t, 18.6, 19.4));
  if (t > 18.4) bars(280, 1360, [16 * k, 0, 84 * k], ['WEB', 'PRINT', 'COMBO'], t);
  if (t > 19.6) pop('84% → COMBO', 540, 1500, 62, t, 19.6, { color: C.white, bg: 1 });
}
function s5(t) {
  sceneIn(t, 20.5);
  experiment(t, 20.8);
  const k = eio(prog(t, 22.6, 23.3));
  bars(280, 1360, [lerp(16, 68, k), 0, lerp(84, 32, k)], ['WEB', 'PRINT', 'COMBO'], t);
  if (t > 22.6) { shake(t, Math.max(0, 10 - (t - 22.6) * 20)); pop('84% → 32%', 540, 1500, 80, t, 23.2, { color: C.white, bg: 1, rot: -3 }); }
}

// ---------- S6 it's everywhere ----------
function s6(t) {
  sceneIn(t, 23.95);
  const panel = t < 26.2 ? 0 : t < 27.25 ? 1 : 2;
  if (t < 28.15) {
    const titles = ['COFFEE SIZES', 'STREAMING PLANS', 'PHONE PLANS'];
    pop(titles[panel], 540, 400, 80, t, [24.1, 26.2, 27.25][panel], { color: C.white, bg: 1, bgColor: C.ink, rot: -2 });
    if (panel === 0) [[330, .8, 'S $3'], [560, 1.0, 'M $4.75'], [810, 1.2, 'L $5']].forEach(([x, s, l], i) => { coffeeCup(x, 1000 - s * 30, s * 1.4); pop(l, x, 1180, 48, t, 24.4 + i * .2, { color: i === 2 ? C.white : C.ink, bg: i === 2 ? 1 : null }); });
    if (panel === 1) [['BASIC', '$7'], ['STANDARD', '$15'], ['PREMIUM', '$18']].forEach(([n, p], i) => card(270 + i * 270, 900, 240, 320, n, p, { hl: i === 2, ribbon: i === 2 ? 'MOST POPULAR' : '' }));
    if (panel === 2) [['5 GB', '$30'], ['15 GB', '$55'], ['UNLIMITED', '$60']].forEach(([n, p], i) => card(270 + i * 270, 900, 240, 320, n, p, { hl: i === 2, ribbon: i === 2 ? 'BEST VALUE' : '' }));
    pop('*example prices', 540, 1300, 30, t, 24.3, { color: C.soft, weight: 700 });
  } else {
    pop("ONCE YOU SEE IT...", 540, 520, 80, t, 28.2, {});
    pop("YOU CAN'T UNSEE IT", 540, 660, 86, t, 28.5, { color: C.white, bg: 1, rot: 2 });
    stick(540, 1380, POSE.shock, { s: 1, face: 'shock', id: 1, mouthOpen: .4 });
  }
}

// ---------- S7 the fix ----------
function s7(t) {
  sceneIn(t, 29.2);
  pop('THE FIX', 540, 380, 90, t, 29.35, { color: C.white, bg: 1, bgColor: '#2f9e44', rot: -2 });
  menu(t, [-1, -1, -1]);
  const cov = back(prog(t, 30.25, 30.55));
  if (cov > 0) {
    ctx.save(); ctx.translate(620, BASE - 160); ctx.rotate(-.06); ctx.scale(cov, cov);
    ctx.fillStyle = C.gold; ctx.strokeStyle = C.ink; ctx.lineWidth = 7; roughRect(-170, -230, 340, 420, 10); ctx.fill(); ctx.stroke();
    font(56, 900); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('IGNORE', 0, -40); ctx.fillText('ME', 0, 30);
    ctx.restore();
  }
  stick(160, 1440, t > 32.3 ? POSE.think : POSE.point, { s: .85, face: t > 32.3 ? 'neutral' : 'smile', id: 1, look: .6 });
  pop('DO I ACTUALLY WANT MORE?', 540, 1500, 58, t, 32.3, { color: C.white, bg: 1, bgColor: C.ink });
}

// ---------- S8 loop ----------
function s8(t) {
  sceneIn(t, 33.45);
  menu(t, [-1, -1, -1]);
  stick(160, 1440, POSE.think, { s: .85, face: 'smug', id: 1, look: .3 });
  pop('STILL GOING LARGE?', 540, 470, 96, t, 33.6, { color: C.white, bg: 1, rot: -3 });
  pop('EP 3 TOMORROW →', 540, 610, 44, t, 34.1, { color: C.soft, weight: 800 });
  const k = prog(t, 35.15, 35.6);
  if (k > 0) { ctx.save(); ctx.globalAlpha = k; paper(); hookLayout(0, true); ctx.restore(); }
}

const SCENES = [[s0, 0, 3.5], [s1, 3.5, 9.05], [s2, 9.05, 11.85], [s3, 11.85, 15.75], [s4, 15.75, 20.5], [s5, 20.5, 23.95], [s6, 23.95, 29.2], [s7, 29.2, 33.45], [s8, 33.45, 99]];

function renderFrame(t) {
  setTime(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  paper();
  for (const [fn, a, b] of SCENES) if (inScene(t, a, b)) { ctx.save(); fn(t); ctx.restore(); }
  for (const [, a] of SCENES) { const k = prog(t, a - .06, a + .08); if (a > 0 && k > 0 && k < 1) { ctx.fillStyle = `rgba(20,20,20,${(1 - Math.abs(k * 2 - 1)) * .45})`; ctx.fillRect(0, 0, W, H); } }
  vignette();
  seriesBadge(CONFIG.series, CONFIG.ep, t);
}

window.FPS = FPS; window.DURATION = DURATION;
if (params.get('render')) document.body.classList.add('render');
window.ready = document.fonts.load('900 100px Inter').then(() => document.fonts.load('700 50px Inter')).then(() => { renderFrame(0); return true; });
if (!params.get('render')) { const t0 = performance.now(); const loop = () => { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
