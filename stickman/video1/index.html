<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Billion Dollar Pizza</title>
<style>
  html,body{margin:0;background:#222;}
  canvas{display:block;width:360px;height:640px;}
  body.render canvas{width:1080px;height:1920px;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/stick.js"></script>
<script>
// ============ CONFIG ============
const params = new URLSearchParams(location.search);
const CONFIG = {
  channel: params.get('channel') || 'StickWise',
  tagline: 'History that hits your wallet',
};
// ================================
const FPS = 30, DURATION = 54;

// Scene boundaries (follow vo/build_vo.sh STARTS)
// S0 hook 0-3.4 | S1 2010 3.4-9.7 | S2 forum 9.7-15.7 | S3 deal 15.7-22.6 | S4 crazy 22.6-24.7
// S5 billion 24.7-30 | S6 jets 30-32.9 | S7 twist 32.9-43 | S8 lesson 43-49.7 | S9 outro 49.7-54

function sceneIn(t, a) { const p = prog(t, a, a + .22); const z = 1 + (1 - eo(p)) * .06; zoomAt(W / 2, H / 2, z); }

// ---------- S0: hook (frame 0 must already read as a title) ----------
function s0(t) {
  sceneIn(t, -1);
  ctx.save(); zoomAt(W / 2, 900, 1 + t * .025);
  // coins raining behind
  for (let i = 0; i < 12; i++) {
    const x = 90 + hash(i, 3) * 900, sp = 260 + hash(i, 4) * 260, y = ((hash(i, 5) * 1900 + t * sp) % 1000) + 740;
    coin(x, y, 34 + hash(i, 6) * 22, t * (1 + i % 3), { spin: Math.cos(t * 4 + i) });
  }
  speedLines(540, 1080, t, 16, 380, 900, .18);
  const m = stick(540, 1240, POSE.hold, { s: 1.3, face: 'happy', id: 1 });
  pizzaBox(540, m.lh[1] - 8, 330, -.03); pizzaBox(540, m.lh[1] - 82, 330, .04);
  ctx.restore();
  pop('$1.2 BILLION', 540, 440, 132, t, -1, { color: C.white, bg: 1, rot: -3, pad: 26 });
  pop('FOR 2 PIZZAS', 540, 610, 104, t, -1, { rot: 1 });
}

// ---------- S1: May 2010 ----------
function s1(t) {
  sceneIn(t, 3.4);
  pop('MAY 2010', 540, 400, 110, t, 3.5, { color: C.white, bg: 1, rot: -2 });
  desk(690, 1160, 520); chair(300, 1150);
  const typing = Math.floor(t * 9) % 2 ? POSE.type1 : POSE.type2;
  const m = stick(320, 1130, typing, { s: 1, face: t > 6.3 ? 'smug' : 'smile', look: .8, id: 2, blink: blinkAt(t) });
  computer(720, 1160, 1.15, () => {
    const p = prog(t, 5.0, 5.5);
    if (p > 0) { coin(0, -14, 52 * back(p), 0, { spin: Math.cos(t * 3) }); }
    if (t > 6.3) { font(30, 800); ctx.fillStyle = '#9ff0b4'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$0.004', 0, 58); }
  });
  pop('Bitcoin: brand new', 540, 560, 64, t, 5.0, { weight: 800 });
  pop('WORTH ≈ $0.004', 540, 670, 84, t, 6.4, { color: C.red, rot: -2 });
  pop('INTERNET MONOPOLY MONEY', 540, 800, 58, t, 8.2, { color: C.white, bg: 1, bgColor: C.ink, rot: 3, pad: 16 });
}

// ---------- S2: the forum post ----------
function s2(t) {
  sceneIn(t, 9.7);
  // forum card
  const p = eo(prog(t, 10.6, 11.1));
  if (p > 0) {
    ctx.save(); ctx.translate(540, 700); ctx.scale(lerp(.7, 1, back(p)), lerp(.7, 1, back(p))); ctx.globalAlpha = Math.min(1, p * 2); ctx.rotate(-1.2 * D2R);
    ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 8;
    roughRect(-450, -230, 900, 460, 22); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(-375, -155, 36, 0, 7); ctx.fill();
    font(40, 900); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('laszlo', -320, -170);
    font(28, 600); ctx.fillStyle = C.soft; ctx.fillText('Bitcoin Forum · May 18, 2010', -320, -128);
    ctx.fillStyle = C.line; ctx.fillRect(-410, -88, 820, 5);
    typeText("I'll pay 10,000 bitcoins for a couple of pizzas... like maybe 2 large ones.", -400, -55, 54, t, 12.7, 30, { maxW: 800, weight: 700 });
    if (t > 15.0) pop('10,000 ₿', 250, 165, 64, t, 15.0, { color: C.white, bg: 1, rot: -4, pad: 12 });
    ctx.restore();
  }
  const m = stick(330, 1330, t < 12.6 ? POSE.stand : POSE.point, { s: .95, face: t > 12.6 ? 'happy' : 'smile', look: .6, id: 3, blink: blinkAt(t, 1) });
  pop('LASZLO', m.head[0], m.head[1] - 120, 56, t, 10.0, { color: C.white, bg: 1, bgColor: C.ink, pad: 12 });
  // thought bubble with pizza
  const b = back(prog(t, 13.3, 13.7));
  if (b > 0) {
    ctx.save(); ctx.translate(720, 1170); ctx.scale(b, b);
    ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 7;
    [[-170, 90, 16], [-130, 55, 24]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke(); });
    ctx.beginPath(); ctx.ellipse(10, -40, 160, 110, 0, 0, 7); ctx.fill(); ctx.stroke();
    pizza(-50, -40, 70, t * .4); pizza(75, -40, 70, -t * .4);
    ctx.restore();
  }
}

// ---------- S3: the deal ----------
function s3(t) {
  sceneIn(t, 15.7);
  pop('A FEW DAYS LATER...', 540, 380, 60, t, 15.8, { color: C.soft, weight: 800, end: 17.9 });
  // door on the right
  inkLine([[880, 1560], [880, 880], [1080, 880]], 12, C.ink, 400);
  // delivery guy walks in
  const wx = lerp(1250, 790, eio(prog(t, 16.6, 18.1)));
  const walking = t > 16.6 && t < 18.1;
  const dPose = walking ? (Math.floor(t * 6) % 2 ? POSE.walk1 : POSE.walk2) : POSE.give;
  const d = stick(wx, 1330, mixPose(dPose, POSE.give, walking ? .5 : 1), { s: 1, face: 'smile', look: -.7, id: 4, flip: true, blink: blinkAt(t, 2) });
  // red cap for the delivery guy
  ctx.save(); ctx.fillStyle = C.red; ctx.strokeStyle = C.ink; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(d.head[0], d.head[1] - 8, 60, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillRect(d.head[0] - 100, d.head[1] - 14, 50, 12); ctx.restore();
  const got = eio(prog(t, 18.3, 18.9));
  const l = stick(320, 1330, got > .5 ? POSE.hold : POSE.stand, { s: 1, face: got > .5 ? 'happy' : 'smile', look: .7, id: 3, blink: blinkAt(t, 1) });
  const bx = lerp(d.lh[0] - 20, 320, got), by = lerp(d.lh[1] - 10, l.lh[1] - 10, got);
  pizzaBox(bx, by, 250, -.04); pizzaBox(bx, by - 62, 250, .05);
  pop('DEAL!', 540, 470, 120, t, 16.9, { color: C.white, bg: 1, rot: -4, end: 19.9 });
  pop('TOTAL VALUE?', 540, 470, 90, t, 20.0, { weight: 900 });
  // swinging price tag
  const tp = prog(t, 21.0, 21.3);
  if (tp > 0) priceTag(330, 650, '≈ $41', back(tp) * 1.25, Math.sin((t - 21) * 6) * .25 * Math.exp(-(t - 21) * 1.6));
}

// ---------- S4: Bitcoin went crazy ----------
function chartPath(p) { // p 0..1 of reveal; returns points
  const pts = []; const N = 80;
  for (let i = 0; i <= N * p; i++) {
    const x = i / N; let v = Math.pow(x, 6) + .015 * Math.sin(i * 1.7) * x;
    if (x > .72 && x < .8) v -= .08 * Math.sin((x - .72) / .08 * Math.PI) ; // a dip
    pts.push([170 + x * 760, 1240 - clamp(v, 0, 1.05) * 760]);
  }
  return pts;
}
function chart(t, p, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  inkLine([[150, 460], [150, 1260], [960, 1260]], 9, C.ink, 500);
  font(32, 800); ctx.fillStyle = C.soft; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ['2010', '2015', '2020', '2025'].forEach((y, i) => ctx.fillText(y, 190 + i * 240, 1280));
  const pts = chartPath(p);
  if (pts.length > 1) {
    ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.restore();
    const [hx, hy] = pts[pts.length - 1]; coin(hx, hy, 42, t * 2, { spin: Math.cos(t * 6) });
  }
  ctx.restore();
}
function s4(t) {
  sceneIn(t, 22.6);
  const p = eio(prog(t, 22.9, 24.6));
  shake(t, prog(t, 23.5, 24.6) * 14);
  chart(t, p);
  pop('...A LITTLE CRAZY', 540, 380, 84, t, 23.7, { color: C.white, bg: 1, rot: -3 });
}

// ---------- S5: over a billion ----------
function s5(t) {
  sceneIn(t, 24.7);
  const hit = prog(t, 28.4, 28.6);
  shake(t, hit > 0 ? Math.max(0, 12 - (t - 28.4) * 20) : 0);
  speedLines(540, 1150, t, 18, 340, 900, .22);
  const m = stick(540, 1330, POSE.shock, { s: 1.15, face: 'shock', id: 5, mouthOpen: .5 + .5 * Math.sin(t * 9) });
  sweat(m.head[0] + 85, m.head[1] - 30, 1.2, t);
  pop('10,000 ₿  =', 540, 360, 64, t, 24.9, { weight: 900, color: C.soft });
  const cp = prog(t, 25.9, 28.4); const k = 1 - Math.pow(1 - cp, 4);
  const v = Math.exp(lerp(Math.log(41), Math.log(1.26e9), k));
  if (t > 25.0) {
    if (hit > 0) burst(540, 500, 330 + Math.sin(t * 8) * 8, C.gold, 18, t * .3);
    const txt = '$' + Math.round(v).toLocaleString('en-US');
    const size = hit > 0 ? 112 : 104;
    pop(txt, 540, 500, size, t, 25.0, { color: hit > 0 ? C.white : C.ink, bg: hit > 0 ? 1 : null, rot: -2, pad: 18 });
  }
  pop("*at Bitcoin's Oct 2025 peak (~$126K per ₿)", 540, 880, 34, t, 28.7, { color: C.ink, weight: 700, bg: 1, bgColor: C.paper, pad: 10 });
}

// ---------- S6: fleet of jets ----------
function s6(t) {
  sceneIn(t, 30.0);
  for (let i = 0; i < 5; i++) {
    const p = prog(t, 30.6 + i * .12, 32.9 + i * .12);
    jet(lerp(-300, 1400, p) - i * 40, 700 + (i % 2 ? 110 : 0) + i * 70, .9 - i * .05, -.06);
  }
  const m = stick(540, 1330, POSE.hold, { s: 1.05, face: 'worried', id: 6, look: -.3 });
  slice(m.lh[0], m.lh[1] - 60, .9, .1);
  pop('NOT DINNER.', 540, 400, 100, t, 30.1, { rot: -2 });
  pop('A FLEET OF JETS.', 540, 530, 92, t, 31.0, { color: C.white, bg: 1, rot: 2 });
}

// ---------- S7: the twist ----------
function s7(t) {
  sceneIn(t, 32.9);
  if (t < 39.0) {
    pop("BUT HERE'S THE TWIST", 540, 420, 76, t, 33.1, { color: C.white, bg: 1, bgColor: C.ink, rot: -2, end: 34.5 });
    const relax = t > 34.5;
    const pose = t > 36.5 ? POSE.aha : relax ? POSE.relax : POSE.stand;
    const m = stick(540, 1300, pose, { s: 1.2, face: relax ? 'cool' : 'neutral', id: 7 });
    pop('NO REGRETS.', 540, 430, 120, t, 34.6, { rot: -3 });
    pop('SOMEONE HAD TO GO FIRST', 540, 590, 64, t, 36.6, { color: C.white, bg: 1, rot: 2 });
    pop('real stuff, real ₿', 540, 700, 44, t, 37.9, { color: C.soft, weight: 800 });
    if (t > 37.4) slice(m.lh[0] - 30, m.lh[1] - 30, .75, -.2);
  } else {
    sceneIn(t, 39.0);
    // calendar page
    const p = back(prog(t, 39.1, 39.5));
    ctx.save(); ctx.translate(540, 720); ctx.scale(p, p); ctx.rotate(-2 * D2R);
    ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 9;
    roughRect(-260, -270, 520, 540, 26); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.red; roughRect(-260, -270, 520, 140, 26); ctx.fill(); ctx.stroke();
    font(88, 900); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('MAY', 0, -198);
    font(280, 900); ctx.fillStyle = C.ink; ctx.fillText('22', 0, 60);
    ctx.restore();
    slice(800, 500, .8 * back(prog(t, 39.6, 40)), .4);
    pop('BITCOIN PIZZA DAY', 540, 1080, 86, t, 40.3, { color: C.white, bg: 1, rot: -2 });
    stick(540, 1420, Math.floor(t * 4) % 2 ? POSE.cheer : mixPose(POSE.cheer, POSE.stand, .25), { s: .8, face: 'happy', id: 8 });
    confetti(t, 40.3, 80);
  }
}

// ---------- S8: the lesson ----------
function bill(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = '#cfe6c4'; ctx.strokeStyle = C.ink; ctx.lineWidth = 7;
  roughRect(-150, -75, 300, 150, 12); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, 48, 52, 0, 0, 7); ctx.stroke();
  font(70, 900); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', 0, 4);
  ctx.restore();
}
function s8(t) {
  sceneIn(t, 43.0);
  pop('THE REAL LESSON', 540, 380, 70, t, 43.1, { color: C.white, bg: 1, bgColor: C.ink, rot: -2 });
  const bp = back(prog(t, 44.0, 44.4));
  if (bp > 0) {
    bill(300, 640, bp * 1.05, -.06);
    const sw = Math.sin((t - 44.6) * 5) * .3 * Math.exp(-Math.max(0, t - 44.6) * 1.2);
    if (t > 44.6) priceTag(380, 700, t > 46.6 ? 'this →' : '???', back(prog(t, 44.6, 44.9)) * .8, .5 + sw);
  }
  // what it could have become: growing coin stack
  const g = prog(t, 46.6, 47.5);
  if (g > 0) {
    inkLine([[500, 640], [600, 640]], 10, C.ink, 600); inkLine([[580, 615], [605, 640], [580, 665]], 10, C.ink, 610);
    const n = Math.floor(lerp(1, 7, eo(g)));
    for (let i = 0; i < n; i++) { const cx = 780 + (i % 2) * 6, cy = 780 - i * 30; ctx.fillStyle = C.gold; ctx.strokeStyle = C.ink; ctx.lineWidth = 6; ctx.fillRect(cx - 80, cy - 14, 160, 28); ctx.strokeRect(cx - 80, cy - 14, 160, 28); ctx.beginPath(); ctx.ellipse(cx, cy - 14, 80, 22, 0, 0, 7); ctx.fill(); ctx.stroke(); }
    if (n >= 7) coin(780, 780 - 7 * 30 - 70, 62, 0, { spin: Math.cos(t * 4) });
  }
  pop('EVERY $ YOU SPEND', 540, 900, 70, t, 44.1, {});
  pop('HAS A HIDDEN PRICE TAG', 540, 985, 70, t, 44.9, {});
  pop('OPPORTUNITY COST', 540, 1150, 96, t, 47.85, { color: C.white, bg: 1, rot: -2, pad: 22 });
  stick(540, 1450, POSE.think, { s: .75, face: t > 47.85 ? 'smug' : 'neutral', id: 9, blink: blinkAt(t, 3) });
}

// ---------- S9: outro ----------
function s9(t) {
  sceneIn(t, 49.7);
  const p = back(prog(t, 49.75, 50.2));
  ctx.save(); ctx.translate(540, 700); ctx.scale(p, p); ctx.rotate(Math.sin(t * 2) * .03); logoMark(0, 0, 220); ctx.restore();
  const wp = back(prog(t, 50.1, 50.45));
  if (wp > 0) { ctx.save(); ctx.translate(540, 1010); ctx.scale(wp, wp); logoWord(0, 0, 120, CONFIG.channel); ctx.restore(); }
  pop(CONFIG.tagline, 540, 1105, 46, t, 50.4, { color: C.soft, weight: 700 });
  // subscribe button + click
  const bp = back(prog(t, 50.7, 51.0));
  if (bp > 0) {
    const clicked = t > 51.8;
    ctx.save(); ctx.translate(540, 1280); ctx.scale(bp * (clicked && t < 52 ? .93 : 1), bp * (clicked && t < 52 ? .93 : 1));
    ctx.fillStyle = clicked ? C.ink : C.red; ctx.strokeStyle = C.ink; ctx.lineWidth = 8;
    roughRect(-250, -70, 500, 140, 70); ctx.fill(); ctx.stroke();
    font(62, 900); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(clicked ? 'SUBSCRIBED ✓' : 'SUBSCRIBE', 0, 4);
    ctx.restore();
    // hand cursor (stick arm)
    const cp = eio(prog(t, 51.1, 51.75));
    inkLine([[lerp(1000, 640, cp), lerp(1600, 1320, cp)], [lerp(1120, 760, cp), lerp(1760, 1480, cp)]], 16, C.ink, 700);
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(lerp(1000, 640, cp), lerp(1600, 1320, cp), 14, 0, 7); ctx.fill();
  }
  if (t > 51.8) confetti(t, 51.8, 50, 7);
}

const SCENES = [[s0, 0, 3.4], [s1, 3.4, 9.7], [s2, 9.7, 15.7], [s3, 15.7, 22.6], [s4, 22.6, 24.7], [s5, 24.7, 30.0], [s6, 30.0, 32.9], [s7, 32.9, 43.0], [s8, 43.0, 49.7], [s9, 49.7, 99]];

function renderFrame(t) {
  setTime(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  paper();
  for (const [fn, a, b] of SCENES) if (inScene(t, a, b)) { ctx.save(); fn(t); ctx.restore(); }
  // quick ink wipe on each cut
  for (const [, a] of SCENES) { const k = prog(t, a - .08, a + .1); if (a > 0 && k > 0 && k < 1) { ctx.fillStyle = `rgba(20,20,20,${(1 - Math.abs(k * 2 - 1)) * .5})`; ctx.fillRect(0, 0, W, H); } }
  vignette();
}

window.FPS = FPS; window.DURATION = DURATION;
if (params.get('render')) document.body.classList.add('render');
window.ready = document.fonts.load('900 100px Inter').then(() => document.fonts.load('700 50px Inter')).then(() => { renderFrame(0); return true; });
if (!params.get('render')) { const t0 = performance.now(); const loop = () => { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
