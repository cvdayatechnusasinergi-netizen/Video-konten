<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Worst Money Decisions Ranked</title>
<style>
  html,body{margin:0;background:#222;}
  canvas{display:block;width:960px;height:540px;}
  body.render canvas{width:1920px;height:1080px;}
</style>

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../lib/stick.js"></script>
<script src="../lib/props.js"></script>
<script src="vo/timing.js"></script>
<script>
// ============ CONFIG ============
const params = new URLSearchParams(location.search);
const CONFIG = { channel: params.get('channel') || 'StickWise' };
// ================================
const FPS = 30, END_SCREEN = 20, DURATION = VO_DURATION;
const PURPLE = '#6b3fa0';

// ---------- timing helpers (SEG from vo/timing.js) ----------
const S = i => SEG[i].s, E = i => SEG[i].s + SEG[i].d, D = i => SEG[i].d;
const P = (i, k) => SEG[i].ph[Math.min(k, SEG[i].ph.length - 1)];          // k-th phrase start
const F = (i, f) => SEG[i].s + SEG[i].d * f;                               // fraction of a line
function sceneIn(t, a) { const p = prog(t, a, a + .2); zoomAt(W / 2, H / 2, 1 + (1 - eo(p)) * .05); }
const GROUND = 1000;

// ---------- HUD ----------
function ladder(t, cur) { // countdown ladder top-right
  for (let n = 6; n >= 1; n--) {
    const x = 1880 - (n - 1) * 62, y = 60, on = n === cur, done = n > cur;
    ctx.fillStyle = on ? C.red : done ? C.ink : C.paper; ctx.strokeStyle = C.ink; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x, y, 24, 0, 7); ctx.fill(); ctx.stroke();
    font(26, 900); ctx.fillStyle = on || done ? C.white : C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(n, x, y + 1);
  }
}
function chip(text, num) {
  font(32, 900); const w = ctx.measureText(text).width;
  ctx.fillStyle = C.red; roughRect(40, 34, 90, 54, 10); ctx.fill();
  ctx.fillStyle = C.ink; roughRect(130, 34, w + 40, 54, 10); ctx.fill();
  ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('#' + num, 85, 62);
  ctx.textAlign = 'left'; ctx.fillText(text, 150, 62);
}
function sectionCard(t, i, num, title) { // big "#N" title during the "Number N..." line
  const p = eo(prog(t, S(i) - .3, S(i) + .25));
  ctx.save(); ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W * p, H); ctx.restore();
  if (p < .6) return;
  const q = back(prog(t, S(i), S(i) + .4));
  ctx.save(); ctx.translate(560, 540); ctx.scale(q, q); ctx.rotate(-4 * D2R);
  ctx.fillStyle = C.red; roughRect(-230, -230, 460, 460, 40); ctx.fill();
  font(330, 900); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('#' + num, 0, 20); ctx.restore();
  const lines = title.split('\n');
  let fs = 96; font(fs, 900); while (Math.max(...lines.map(l => ctx.measureText(l).width)) > 980 && fs > 50) { fs -= 4; font(fs, 900); }
  lines.forEach((l, k) => pop(l, 870, 540 + (k - (lines.length - 1) / 2) * fs * 1.2, fs, t, P(i, 1) - .1 + k * .15, { color: C.white, align: 'left' }));
}

// ======================= COLD OPEN =======================
function searchBox(x, y, s, label = 'SEARCH') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 7; roughRect(-200, -130, 400, 260, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ink; roughRect(-200, -130, 400, 46, 14); ctx.fill();
  ctx.fillStyle = C.white; roughRect(-150, -30, 300, 56, 28); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(110, -3, 14, 0, 7); ctx.moveTo(120, 8); ctx.lineTo(132, 20); ctx.stroke();
  font(32, 900); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, 0, 80);
  ctx.restore();
}
function cold(t) {
  sceneIn(t, 0);
  if (t < S(2) - .2) {
    pop('1999', 960, 140, 110, t, S(0) - .2, { color: C.white, bg: 1, rot: -2 });
    stick(380, 830, POSE.hold, { s: .8, face: 'happy', id: 1 });
    stick(560, 830, POSE.point, { s: .8, face: 'smile', id: 2 });
    searchBox(470, 520, .9, t > P(1, 1) ? 'GOOGLE' : 'LITTLE SEARCH ENGINE');
    if (t > F(0, .55) && t < P(1, 2)) priceTag(700, 380, '$750,000', back(prog(t, F(0, .55), F(0, .55) + .3)) * 1.1, .1);
    boss(1450, 830, t > S(1) ? POSE.point : POSE.hips, t > S(1) ? 'smug' : 'neutral', .85, { id: 3, flip: true, look: -.5 });
    if (t > S(1)) pop('NO.', 1450, 420, 130, t, S(1) + .1, { color: C.red, rot: 8 });
    if (t > P(1, 2)) { const hit = t > E(1) - .3; if (hit) burst(960, 300, 230, C.gold, 18, t * .3);
      counterText(t, P(1, 2) + .2, E(1) - .3, 750000, 3.6e12, 960, 300, 88, { color: hit ? C.white : C.ink, bg: hit ? 1 : null, rot: -2 }); }
  } else if (t < S(3) - .2) {
    sceneIn(t, S(2) - .2);
    ctx.save(); ctx.translate(380, 520); ctx.rotate(-.06); ctx.fillStyle = C.red; roughRect(-200, -200, 400, 400, 36); ctx.fill();
    font(250, 900); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('#1', 0, 15); ctx.restore();
    pop('...BUT FIRST', 1250, 220, 90, t, P(2, 1), {});
    for (let n = 6; n >= 2; n--) { const k = 6 - n; const x = 850 + k * 205, y = 560;
      const p = back(prog(t, P(2, 1) + .3 + k * .18, P(2, 1) + .6 + k * .18)); if (p <= 0) continue;
      ctx.save(); ctx.translate(x, y); ctx.scale(p, p); ctx.fillStyle = C.ink; roughRect(-85, -110, 170, 220, 16); ctx.fill();
      font(80, 900); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('#' + n, 0, -20);
      font(70, 900); ctx.fillStyle = C.gold; ctx.fillText('?', 0, 60); ctx.restore(); }
    pop('SO BAD THEY HURT', 1250, 860, 70, t, F(2, .8), { color: C.white, bg: 1, rot: 2 });
  } else {
    sceneIn(t, S(3) - .2);
    const p = back(prog(t, S(3), S(3) + .45));
    ctx.save(); ctx.translate(960, 420); ctx.scale(p, p); logoMark(0, 0, 200); ctx.restore();
    const w = back(prog(t, S(3) + .3, S(3) + .7)); if (w > 0) { ctx.save(); ctx.translate(960, 730); ctx.scale(w, w); logoWord(0, 0, 130, CONFIG.channel); ctx.restore(); }
    pop("LET'S COUNT THEM DOWN", 960, 870, 60, t, P(3, 1), { color: C.white, bg: 1, bgColor: C.ink });
  }
}

// ======================= #6 PIZZA =======================
function pizzaSec(t) {
  ladder(t, 6); chip('THE BILLION DOLLAR PIZZA', 6);
  if (t < S(6) - .2) { // May 2010 computer
    sceneIn(t, S(5) - .2);
    pop('MAY 2010', 960, 170, 100, t, S(5), { color: C.white, bg: 1, rot: -2 });
    desk(1060, 860, 560); chair(700, 850);
    stick(720, 830, Math.floor(t * 9) % 2 ? POSE.type1 : POSE.type2, { s: .85, face: 'smile', look: .8, id: 4 });
    computer(1080, 860, 1.1, () => coin(0, -10, 50, 0, { spin: Math.cos(t * 3) }));
    pop('BITCOIN: BRAND NEW', 1500, 420, 54, t, P(5, 1), {});
    pop('WHAT IS IT FOR??', 1500, 520, 50, t, F(5, .7), { color: C.red, rot: 4 });
  } else if (t < S(7) - .2) { // forum post
    sceneIn(t, S(6) - .2);
    const m = stick(330, 860, POSE.point, { s: .85, face: 'happy', look: .6, id: 4 });
    pop('LASZLO HANYECZ', 330, 450, 44, t, S(6) + .3, { color: C.white, bg: 1, bgColor: C.ink });
    ctx.save(); ctx.translate(1120, 520); ctx.rotate(-1 * D2R);
    ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 8; roughRect(-560, -260, 1120, 520, 22); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(-480, -190, 36, 0, 7); ctx.fill();
    font(40, 900); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('laszlo', -425, -205);
    font(28, 600); ctx.fillStyle = C.soft; ctx.fillText('Bitcoin Forum · May 18, 2010', -425, -162);
    ctx.fillStyle = C.line; ctx.fillRect(-510, -120, 1020, 5);
    typeText("I'll pay 10,000 bitcoins for a couple of pizzas.. like maybe 2 large ones.", -500, -80, 60, t, P(6, 1), 42, { maxW: 1000 });
    ctx.restore();
  } else if (t < S(8) - .2) { // the deal
    sceneIn(t, S(7) - .2);
    const wx = lerp(2100, 1250, eio(prog(t, S(7), S(7) + 1.2)));
    const d = stick(wx, 860, POSE.give, { s: .85, face: 'smile', look: -.7, id: 5, flip: true });
    const got = eio(prog(t, P(7, 1), P(7, 1) + .5));
    const l = stick(640, 860, got > .5 ? POSE.hold : POSE.stand, { s: .85, face: got > .5 ? 'happy' : 'smile', look: .7, id: 4 });
    const bx = lerp(d.lh[0] - 20, 640, got), by = lerp(d.lh[1] - 10, l.lh[1] - 10, got);
    pizzaBox(bx, by, 230, -.04); pizzaBox(bx, by - 56, 230, .05);
    pop('DEAL!', 960, 170, 110, t, S(7) + .3, { color: C.white, bg: 1, rot: -3 });
    if (t > P(7, 3)) priceTag(950, 330, '≈ $41', back(prog(t, P(7, 3), P(7, 3) + .3)) * 1.3, Math.sin((t - P(7, 3)) * 6) * .25 * Math.exp(-(t - P(7, 3)) * 1.6));
  } else if (t < S(9) - .2) { // went crazy
    sceneIn(t, S(8) - .2);
    const p = eio(prog(t, S(8) + .3, F(8, .45)));
    inkLine([[200, 300], [200, 950], [1100, 950]], 9, C.ink, 500);
    const pts = []; for (let i = 0; i <= 80 * p; i++) { const x = i / 80; pts.push([220 + x * 860, 940 - Math.pow(x, 6) * 620]); }
    if (pts.length > 1) { ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.restore(); const [hx, hy] = pts[pts.length - 1]; coin(hx, hy, 40, t * 2, { spin: Math.cos(t * 6) }); }
    pop('...A LITTLE CRAZY', 650, 170, 80, t, S(8) + .4, { color: C.white, bg: 1, rot: -3 });
    const hit = t > E(8) - .4; if (hit) burst(1500, 470, 250, C.gold, 18, t * .3);
    if (t > F(8, .45)) counterText(t, F(8, .5), E(8) - .4, 41, 1.26e9, 1500, 470, 84, { color: hit ? C.white : C.ink, bg: hit ? 1 : null, rot: -2 });
    pop("*at Bitcoin's Oct 2025 peak (~$126K per ₿)", 1500, 780, 30, t, E(8) - .3, { weight: 700, bg: 1, bgColor: C.paper, pad: 8 });
    stick(1500, 930, POSE.shock, { s: .5, face: 'shock', id: 4 });
  } else if (t < S(10) - .2) { // no regrets + pizza day
    sceneIn(t, S(9) - .2);
    stick(420, 860, t > P(9, 2) ? POSE.cheer : POSE.relax, { s: .9, face: t > P(9, 2) ? 'happy' : 'cool', id: 4 });
    pop('NO REGRETS', 420, 200, 90, t, S(9) + .5, { color: C.white, bg: 1, bgColor: C.ink, rot: -2 });
    if (t > P(9, 2)) {
      const p = back(prog(t, P(9, 2), P(9, 2) + .4));
      ctx.save(); ctx.translate(1250, 470); ctx.scale(p, p); ctx.rotate(-2 * D2R);
      ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 9; roughRect(-240, -250, 480, 500, 26); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.red; roughRect(-240, -250, 480, 130, 26); ctx.fill(); ctx.stroke();
      font(84, 900); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('MAY', 0, -184);
      font(250, 900); ctx.fillStyle = C.ink; ctx.fillText('22', 0, 50); ctx.restore();
      pop('BITCOIN PIZZA DAY', 1250, 820, 70, t, P(9, 3), { color: C.white, bg: 1, rot: -2 });
      confetti(t, P(9, 3), 60);
    }
  } else { // transition to #5
    sceneIn(t, S(10) - .2);
    pop('$1.2 BILLION?', 960, 330, 110, t, S(10), { color: C.soft });
    pop('NOTHING.', 960, 500, 150, t, F(10, .45), { color: C.white, bg: 1, rot: -3 });
    pop('wait for #5...', 960, 700, 60, t, F(10, .8), {});
  }
}

// ======================= #5 KODAK =======================
function kodakSec(t) {
  ladder(t, 5); chip('THE COMPANY THAT INVENTED ITS OWN KILLER', 5);
  if (t < S(13) - .2) {
    sceneIn(t, S(12) - .2);
    hq(500, 980, 1.25);
    pop('~$31 BILLION', 1300, 300, 110, t, F(12, .25), { color: C.white, bg: 1, bgColor: C.ink, rot: -2 });
    const n = Math.round(lerp(0, 145000, eo(prog(t, F(12, .6), E(12)))));
    for (let i = 0; i < Math.min(30, n / 4800); i++) stick(1000 + (i % 10) * 85, 760 + Math.floor(i / 10) * 95, POSE.stand, { s: .2, face: 'smile', id: 40 + i, lw: 22 });
    if (t > F(12, .6)) pop(n.toLocaleString('en-US') + ' EMPLOYEES', 1400, 1010, 56, t, F(12, .6), { color: C.white, bg: 1 });
  } else if (t < S(15) - .2) {
    sceneIn(t, S(13) - .2);
    pop('1975', 960, 150, 110, t, S(13), { color: C.white, bg: 1, rot: -3 });
    stick(380, 860, POSE.cheer, { s: .85, face: 'happy', id: 6 });
    pop('STEVE SASSON', 380, 400, 44, t, P(13, 1) + .3, { color: C.white, bg: 1, bgColor: C.ink });
    const p = back(prog(t, P(13, 2), P(13, 2) + .4)); if (p > 0) prototype(1000, 560, 1.3 * p, .03);
    pop('THE 1ST DIGITAL CAMERA', 1000, 300, 56, t, P(13, 2) + .2, { color: C.white, bg: 1 });
    if (t > S(14) - .2) {
      pop('8 LBS', 1500, 420, 90, t, S(14), { rot: -6 });
      pop('23 SEC / PHOTO', 1520, 580, 70, t, P(14, 1), { color: C.red, rot: 4 });
      pop('B&W · ON A CASSETTE', 1500, 720, 48, t, P(14, 2), { color: C.soft });
    }
  } else if (t < S(16) - .2) {
    sceneIn(t, S(15) - .2);
    pop("THE BOSSES' REACTION (per Sasson)", 960, 150, 60, t, S(15), { color: C.white, bg: 1, bgColor: C.ink });
    prototype(960, 650, .7);
    const face = t > P(15, 3) ? 'smug' : t > P(15, 2) ? 'smile' : 'neutral';
    boss(450, 860, POSE.hips, face, .85, { id: 7, look: .5 });
    boss(1470, 860, t > P(15, 3) ? POSE.point : POSE.hips, face, .85, { id: 8, flip: true, look: -.5 });
    pop('"THAT\'S CUTE."', 960, 290, 90, t, P(15, 2), {});
    pop('"BUT DON\'T TELL ANYONE."', 960, 430, 70, t, P(15, 3), { color: C.white, bg: 1, rot: 2 });
  } else if (t < S(17) - .2) {
    sceneIn(t, S(16) - .2);
    pop('KODAK = FILM $$$', 600, 150, 90, t, S(16) + .3, { color: C.white, bg: 1, bgColor: C.ink, rot: -2 });
    const n = Math.floor(lerp(0, 12, eo(prog(t, S(16) + .5, P(16, 1)))));
    for (let i = 0; i < n; i++) filmRoll(160 + (i % 4) * 230, 800 - Math.floor(i / 4) * 170, .9, (hash(i, 4) - .5) * .4);
    if (t > P(16, 1)) { prototype(1450, 520, .8); pop('NEEDS FILM?', 1450, 760, 70, t, P(16, 1) + .3, {}); pop('NOPE.', 1450, 880, 100, t, F(16, .85), { color: C.red, rot: 6 }); }
  } else if (t < S(18) - .2) {
    sceneIn(t, S(17) - .2);
    pop('...EVENTUALLY', 960, 150, 80, t, S(17) + .5, { color: C.soft });
    const n = Math.floor(lerp(0, 14, eo(prog(t, P(17, 1), P(17, 2) + .5))));
    for (let i = 0; i < n; i++) camPhone(260 + (i % 7) * 230, 420 + Math.floor(i / 7) * 330, .95, (hash(i, 9) - .5) * .5);
    if (t > P(17, 3)) { ctx.save(); ctx.globalAlpha = .9; filmRoll(960, 900, 1.2 * (1 - prog(t, P(17, 3), E(17))), .3); ctx.restore(); }
    pop('EVERYONE ELSE: FASTER', 960, 1010, 54, t, P(17, 1), { color: C.white, bg: 1, bgColor: C.ink });
  } else if (t < S(19) - .2) {
    sceneIn(t, S(18) - .2);
    pop('JANUARY 2012', 960, 150, 90, t, S(18), { color: C.red });
    const crack = prog(t, S(18) + .6, S(18) + 1.2), fall = eio(prog(t, S(18) + 1.2, S(18) + 2.2));
    shake(t, crack > 0 && fall < 1 ? 10 : 0);
    ctx.save(); ctx.globalAlpha = 1 - fall * .6; hq(960, 1030, 1.15, { crack, fall }); ctx.restore();
    slam(t, S(18) + 1.2, 960, 560, 'BANKRUPT', -.12);
  } else {
    sceneIn(t, S(19) - .2);
    pop('AT LEAST KODAK TRIED.', 960, 200, 80, t, S(19), {});
    cheque(960, 560, 1.6 * back(prog(t, P(19, 1), P(19, 1) + .4)), -.05, '$40 BILLION', 'OFFER');
    slam(t, F(19, .85), 1180, 650, 'NO', .2, C.red, 140);
  }
}

// ======================= #4 YAHOO =======================
function namedBoss(x, base, label, pose, face, opts = {}) { const m = boss(x, base, pose, face, opts.s || .85, opts); pop(label, x, m.head[1] - 110, 40, 99, -1, { color: C.white, bg: 1, bgColor: opts.lc || C.ink, pad: 10 }); return m; }
function yahooSec(t) {
  ladder(t, 4); chip('YAHOO SAYS NO TO MICROSOFT', 4);
  if (t < S(22) - .2) {
    sceneIn(t, S(21) - .2);
    pop('FEBRUARY 2008', 960, 150, 90, t, S(21), { color: C.white, bg: 1, rot: -2 });
    const m = namedBoss(420, 860, 'MICROSOFT', POSE.give, 'happy', { id: 9, look: .5, lc: BLUE });
    namedBoss(1500, 860, 'YAHOO', POSE.hips, 'neutral', { id: 10, flip: true, look: -.5, lc: PURPLE });
    if (t > P(21, 2)) { cheque(950, 560, 1.5 * back(prog(t, P(21, 2), P(21, 2) + .4)), -.04, '$44.6 BILLION', 'OFFER: BUY YAHOO'); pop('$31 / SHARE', 950, 760, 54, t, P(21, 2) + .3, { color: C.soft }); }
  } else if (t < S(23) - .2) {
    sceneIn(t, S(22) - .2);
    pop("YAHOO'S BOARD", 960, 150, 80, t, S(22), { color: C.white, bg: 1, bgColor: PURPLE });
    for (let i = 0; i < 3; i++) boss(700 + i * 260, 860, i === 1 && t > P(22, 1) ? POSE.point : POSE.hips, t > P(22, 1) ? 'smug' : 'neutral', .8, { id: 11 + i });
    pop('"THAT UNDERVALUES US."', 960, 330, 80, t, P(22, 1), {});
    slam(t, P(22, 2), 1550, 560, 'NO THANKS', .12, C.red, 90);
  } else if (t < S(24) - .2) {
    sceneIn(t, S(23) - .2);
    const fade = prog(t, P(23, 1), E(23));
    ctx.save(); ctx.globalAlpha = 1 - fade * .7; store(560, 980, 520, 600, { label: 'YAHOO', color: PURPLE }); ctx.restore();
    pop('MICROSOFT WALKS AWAY', 960, 150, 70, t, S(23) + .2, { color: C.white, bg: 1, bgColor: BLUE });
    pop('SEARCH → GOOGLE', 1380, 480, 70, t, P(23, 2), { color: C.white, bg: 1, bgColor: C.ink, rot: -2 });
    pop('SOCIAL → FACEBOOK', 1380, 640, 70, t, P(23, 3), { color: C.white, bg: 1, bgColor: C.ink, rot: 2 });
  } else if (t < S(25) - .2) {
    sceneIn(t, S(24) - .2);
    pop('2017', 960, 150, 110, t, S(24), { color: C.red });
    namedBoss(420, 860, 'VERIZON', POSE.give, 'smug', { id: 14, look: .5, lc: C.red });
    namedBoss(1500, 860, 'YAHOO', POSE.stand, 'sad', { id: 10, flip: true, look: -.5, lc: PURPLE });
    if (t > P(24, 2)) cheque(950, 560, 1.4 * back(prog(t, P(24, 2), P(24, 2) + .4)), .04, '$4.48 BILLION', 'PRICE: YAHOO');
  } else if (t < S(26) - .2) {
    sceneIn(t, S(25) - .2);
    const k = eo(prog(t, S(25) + .2, S(25) + 1.2));
    [[44.6, '2008 OFFER', C.ink], [4.48, '2017 SALE', C.red]].forEach(([v, l, c], i) => {
      const x = 600 + i * 380, h = v / 44.6 * 560 * k;
      ctx.fillStyle = c; roughRect(x - 120, 930 - h, 240, Math.max(2, h), 8); ctx.fill();
      font(56, 900); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$' + v + 'B', x, 930 - h - 46);
      font(36, 800); ctx.fillStyle = C.soft; ctx.fillText(l, x, 980);
    });
    slam(t, P(25, 1), 1500, 500, '-90%', -.1, C.red, 160);
  } else {
    sceneIn(t, S(26) - .2);

      font(80, 900); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(pressed ? 'SUBSCRIBED ✓' : 'SUBSCRIBE', 0, 5); ctx.restore(); }
  }
}

// ======================= END SCREEN (20 s) =======================
function endScreen(t) {
  const a = prog(t, E(57) + .3, E(57) + .8);
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  logoMark(960, 230, 110); logoWord(960, 420, 90, CONFIG.channel);
  font(40, 800); ctx.fillStyle = C.soft; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('WATCH NEXT', 960, 520);
  // placeholders where YouTube end-screen elements go (left video, right video)
  ctx.setLineDash([18, 14]); ctx.strokeStyle = C.soft; ctx.lineWidth = 5;
  roughRect(190, 590, 700, 394, 18); ctx.stroke(); roughRect(1030, 590, 700, 394, 18); ctx.stroke(); ctx.setLineDash([]);
  stick(110, 1000, POSE.point, { s: .45, face: 'happy', id: 28, look: .5 });
  stick(1820, 1000, POSE.point, { s: .45, face: 'happy', id: 29, flip: true, look: -.5 });
  ctx.restore();
}

// ======================= timeline =======================
const SECTIONS = [
  [cold, 0, 4], [(t) => { sectionCard(t, 4, 6, 'THE BILLION\nDOLLAR PIZZA'); }, 4, 5], [pizzaSec, 5, 11],
  [(t) => sectionCard(t, 11, 5, 'THE COMPANY THAT\nINVENTED ITS\nOWN KILLER'), 11, 12], [kodakSec, 12, 20],
  [(t) => sectionCard(t, 20, 4, 'YAHOO SAYS NO\nTO MICROSOFT'), 20, 21], [yahooSec, 21, 27], [ctaSec, 27, 28],
  [(t) => sectionCard(t, 28, 3, 'BLOCKBUSTER\nLAUGHS AT NETFLIX'), 28, 29], [blockSec, 29, 36],
  [(t) => sectionCard(t, 36, 2, 'THE THIRD\nFOUNDER OF APPLE'), 36, 37], [wayneSec, 37, 45],
  [(t) => sectionCard(t, 45, 1, "THE DAY EXCITE\nDIDN'T BUY GOOGLE"), 45, 46], [exciteSec, 46, 54], [outroSec, 54, 58],
];
const bound = i => i === 0 ? 0 : i >= SEG.length ? E(SEG.length - 1) + .3 : (E(i - 1) + S(i)) / 2;

function renderFrame(t) {
  setTime(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  paper();
  for (const [fn, a, b] of SECTIONS) if (t >= bound(a) && t < bound(b)) { ctx.save(); fn(t); ctx.restore(); }
  vignette();
  if (t > E(57) + .3) endScreen(t);
}

window.FPS = FPS; window.DURATION = DURATION;
if (params.get('render')) document.body.classList.add('render');
window.ready = document.fonts.load('900 100px Inter').then(() => document.fonts.load('700 50px Inter')).then(() => { renderFrame(0); return true; });
if (!params.get('render')) { const t0 = performance.now(); const loop = () => { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
</script>
