<!doctype html>
<html><head><meta charset="utf-8"><title>Thumbnail</title><style>html,body{margin:0;background:#222}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script src="../lib/stick.js"></script>
<script src="../lib/props.js"></script>
<script>
function draw() {
  setTime(0);
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(20,20,20,.07)'; for (let y = 20; y < H; y += 40) for (let x = 20; x < W; x += 40) { ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill(); }
  // left: shocked stickman + speed lines
  ctx.save(); ctx.strokeStyle = 'rgba(20,20,20,.18)'; ctx.lineCap = 'round';
  for (let i = 0; i < 16; i++) { const a = i / 16 * 6.283; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(290 + Math.cos(a) * 230, 400 + Math.sin(a) * 230); ctx.lineTo(290 + Math.cos(a) * 520, 400 + Math.sin(a) * 520); ctx.stroke(); }
  ctx.restore();
  const m = stick(290, 520, POSE.shock, { s: 1.15, face: 'shock', id: 1, mouthOpen: 1, lw: 17 });
  sweat(m.head[0] + 90, m.head[1] - 20, 1.4, .2);
  // right: text
  ctx.save(); ctx.translate(880, 150); ctx.rotate(-3 * D2R); ctx.fillStyle = C.ink; roughRect(-360, -62, 720, 124, 14); ctx.fill();
  font(76, 900); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('SAID NO TO', 0, 6); ctx.restore();
  ctx.save(); ctx.translate(880, 300); ctx.rotate(2 * D2R); ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 9; roughRect(-330, -80, 660, 160, 18); ctx.fill(); ctx.stroke();
  font(110, 900); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('GOOGLE', 0, 8); ctx.restore();
  burst(880, 520, 210, C.gold, 18, .2);
  ctx.save(); ctx.translate(880, 510); ctx.rotate(-4 * D2R); ctx.fillStyle = C.red; roughRect(-340, -78, 680, 156, 14); ctx.fill();
  font(104, 900); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$750,000?!', 0, 8); ctx.restore();
  // badge
  ctx.fillStyle = C.red; roughRect(24, 24, 120, 76, 12); ctx.fill(); font(56, 900); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('#1', 84, 64);
  ctx.fillStyle = C.ink; roughRect(144, 24, 470, 76, 12); ctx.fill(); font(38, 900); ctx.fillStyle = C.white; ctx.fillText('WORST MONEY MOVES', 379, 64);
}
window.ready = document.fonts.load('900 100px Inter').then(() => { draw(); return true; });
</script></body></html>
