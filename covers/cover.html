<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cover SUARA</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Cover thumbnail (1080x1920). Teks utama ditaruh di tengah (y 480–1440)
// supaya tetap terbaca saat grid profil TikTok memotong jadi 3:4.
const COVERS = {
  1: { ep: 1, tag: 'MINDSET', lines: [['1%', true], ['LEBIH BAIK'], ['TIAP HARI']], sub: 'setahun = 37x lipat' },
  2: { ep: 2, tag: 'DUIT', lines: [['GAJI ABIS'], ['TGL 10?', true]], sub: 'masalahnya bukan di gaji' },
  3: { ep: 3, tag: 'DANA DARURAT', lines: [['LO AMAN'], ['BERAPA', true], ['BULAN?']], sub: 'kalau besok nggak ada pemasukan' },
  4: { ep: 4, tag: 'DUIT', lines: [['GAJI 15 JT'], ['TAPI'], ['MINUS?', true]], sub: 'kaya bukan soal gaji besar' },
  6: { ep: 6, tag: 'INVESTASI', lines: [['MULAI'], ['UMUR 25 VS 45'], ['BEDA Rp840 JT', true]], sub: 'modalnya sama: sejuta sebulan' },
  7: { ep: 7, tag: 'UTANG', lines: [['CICILAN'], ['“CUMA” 680RB?'], ['BAYAR Rp8,2 JT', true]], sub: 'utang baik vs utang buruk' },
  5: { ep: 5, tag: 'LATTE FACTOR', lines: [['JAJAN'], ['RECEH ='], ['Rp172 JT', true]], sub: 'kok bisa? cek videonya' },
};
const id = new URLSearchParams(location.search).get('id') || '1';
const C = COVERS[id];
const W = 1080, H = 1920, ctx = document.getElementById('c').getContext('2d');
const FONT = 'Inter, sans-serif';
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function draw() {
  ctx.fillStyle = '#040404'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .47, 0, W / 2, H * .47, H * .65);
  g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  for (let y = 30; y < H; y += 60) for (let x = 30; x < W; x += 60) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill(); }

  // top tag + episode
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `600 34px ${FONT}`; ctx.letterSpacing = '14px'; ctx.fillStyle = '#bdbdbd';
  ctx.fillText(C.tag, W / 2 + 7, 470);
  ctx.letterSpacing = '0px';

  // main lines, auto-fit to 920px
  const n = C.lines.length;
  let size = n === 2 ? 210 : 175;
  ctx.font = `900 ${size}px ${FONT}`;
  const maxW = Math.max(...C.lines.map(([t, hl]) => ctx.measureText(t).width + (hl ? 70 : 0)));
  if (maxW > 920) size = Math.floor(size * 920 / maxW);
  const lh = size * 1.08, total = lh * n, y0 = 960 - total / 2 + lh / 2;
  C.lines.forEach(([t, hl], i) => {
    const y = y0 + i * lh;
    ctx.font = `900 ${size}px ${FONT}`;
    if (hl) {
      const tw = ctx.measureText(t).width;
      ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(255,255,255,.55)'; ctx.shadowBlur = 50;
      ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2 - 35, y - size * .55, tw + 70, size * 1.06, 24); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#000';
    } else ctx.fillStyle = '#fff';
    ctx.fillText(t, W / 2, y + size * .02);
  });

  // sub line
  ctx.font = `500 46px ${FONT}`; ctx.fillStyle = '#cfcfcf';
  ctx.fillText(C.sub, W / 2, y0 + (n - 1) * lh + size * .5 + 90);

  // brand mark + episode badge
  const by = 1560;
  ctx.save(); ctx.translate(W / 2 - 150, by);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 44, 0, 7); ctx.stroke();
  ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.beginPath();
  [[-28, 0], [-12, 0], [-6, -10], [0, 10], [6, -20], [12, 12], [18, 0], [28, 0]].forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.stroke(); ctx.restore();
  ctx.font = `800 40px ${FONT}`; ctx.letterSpacing = '10px'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText('SUARA', W / 2 - 86, by + 2); ctx.letterSpacing = '0px';
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(W / 2 + 140, by - 30, 100, 60, 30); ctx.fill();
  ctx.font = `900 34px ${FONT}`; ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.fillText('#' + C.ep, W / 2 + 190, by + 2);

  // grain
  const r = rng(3), id2 = ctx.getImageData(0, 0, W, H), d = id2.data;
  for (let i = 0; i < d.length; i += 4) { const v = (r() - .5) * 14; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
  ctx.putImageData(id2, 0, 0);
}
window.ready = document.fonts.load(`900 40px Inter`).then(() => document.fonts.load(`500 40px Inter`)).then(() => { draw(); return true; });
</script>
</body>
</html>
